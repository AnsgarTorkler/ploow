name: Release

# Läuft, sobald ein Tag der Form v1.13.2 gepusht wird.
#
# Warum in zwei Stufen?
#
# Die erste Fassung liess alle drei Systeme gleichzeitig bauen UND
# gleichzeitig ans Release hängen. Das ging schief: drei Jobs versuchen
# dasselbe Release anzulegen, einer gewinnt, die anderen legen ein
# zweites an oder verlieren ihre Datei. Ergebnis waren zwei Releases
# für eine Version, und die .dmg fehlte, während ihr Blockmap dalag.
#
# Jetzt bauen die drei Systeme nur und legen ihre Dateien als Artefakt
# ab. Ein einziger Job danach sammelt alles ein und legt EIN Release an.
# Kein Wettlauf mehr möglich.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # nötig, um das Release anzulegen und zu befüllen

jobs:
  # ---------- Stufe 1: bauen ----------
  bauen:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Ein fehlgeschlagenes System soll die anderen nicht abbrechen –
      # sonst steht am Ende gar nichts bereit.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Die Testreihe läuft nur einmal – sie prüft Dateien und Logik,
      # nicht das Betriebssystem. Dreimal dasselbe kostet nur Zeit.
      - name: Testreihe
        if: matrix.os == 'ubuntu-latest'
        run: npm test

      # --publish never: hier wird ausdrücklich NICHT veröffentlicht.
      # Das macht Stufe 2, und zwar genau einmal.
      - name: Bauen
        run: npx electron-builder --publish never
        env:
          # Ohne Apple-Entwicklerkonto lässt sich nicht beglaubigen.
          # Ausdrücklich abschalten, sonst bricht der Bau ab, statt
          # eine unsignierte .dmg zu liefern.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Ergebnisse ablegen
        uses: actions/upload-artifact@v4
        with:
          name: bau-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error     # nichts gebaut ist ein Fehler, kein Erfolg
          retention-days: 14

  # ---------- Stufe 2: veröffentlichen ----------
  veroeffentlichen:
    name: Release anlegen
    needs: bauen
    # Auch wenn ein System gescheitert ist: was gebaut wurde, soll
    # ankommen. Besser eine Fassung für Windows als keine.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Alle Ergebnisse einsammeln
        uses: actions/download-artifact@v4
        with:
          path: eingesammelt
          pattern: bau-*
          merge-multiple: true         # alles in einen Ordner

      - name: Auflisten, was zusammengekommen ist
        run: |
          echo "### Dateien im Release" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh eingesammelt/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls eingesammelt/

      - name: Ein Release, ein Mal
        uses: softprops/action-gh-release@v2
        with:
          files: eingesammelt/*
          # Als Entwurf: so lässt sich vorher nachsehen, ob alle vier
          # Dateien dabei sind, bevor die Website darauf zeigt.
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
