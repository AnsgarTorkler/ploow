/* ---------- Ablauf und Dialog ---------- */
let jsonPlan=null;

/* ============================================================
   EINLESEN AUS FREMDEN DATEIEN
   Drei Formate, ein Weg: alles wird in dieselbe Zwischenform
   gebracht – Listen von Objekten mit Feldnamen – und läuft dann
   durch dieselbe Vorschau mit Feldzuordnung wie bisher das JSON.
   ============================================================ */

/* ---------- CSV und TSV ----------
   Bewusst von Hand, ohne Bibliothek: Anführungszeichen, doppelte
   Anführungszeichen darin und Zeilenumbrüche in Feldern müssen
   stimmen, alles andere braucht es nicht. */
function csvTrennzeichen(text){
  /* Zitierte Felder erst entfernen, damit ein Komma im Text nicht als
     Trennzeichen zählt. Was danach am häufigsten vorkommt, gewinnt. */
  const kopf=(String(text).split(/\r?\n/)[0]||"").replace(/"[^"]*"/g,"");
  const zaehle=z=>kopf.split(z).length-1;
  const kandidaten=[[";",zaehle(";")],["\t",zaehle("\t")],[",",zaehle(",")]];
  kandidaten.sort((a,b)=>b[1]-a[1]);
  return kandidaten[0][1]>0 ? kandidaten[0][0] : ",";
}
function csvZerlegen(text, trenn){
  const zeilen=[]; let feld="", zeile=[], inZitat=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inZitat){
      if(c==='"'){ if(text[i+1]==='"'){ feld+='"'; i++; } else inZitat=false; }
      else feld+=c;
      continue;
    }
    if(c==='"'){ inZitat=true; continue; }
    if(c===trenn){ zeile.push(feld); feld=""; continue; }
    if(c==="\n"){ zeile.push(feld); zeilen.push(zeile); zeile=[]; feld=""; continue; }
    if(c==="\r") continue;
    feld+=c;
  }
  if(feld!==""||zeile.length){ zeile.push(feld); zeilen.push(zeile); }
  return zeilen.filter(z=>z.some(x=>String(x).trim()!==""));
}
function csvDatensaetze(text, name){
  const trenn=csvTrennzeichen(text);
  const zeilen=csvZerlegen(text, trenn);
  if(zeilen.length<2) return [];
  /* Die erste Zeile sind die Feldnamen. Leere oder doppelte bekommen
     einen Ersatznamen, sonst überschreiben sich Spalten gegenseitig. */
  const gesehen={};
  const felder=zeilen[0].map((f,i)=>{
    let n=String(f).trim()||("Spalte "+(i+1));
    if(gesehen[n]) n=n+" "+(++gesehen[n]); else gesehen[n]=1;
    return n;
  });
  const eintraege=zeilen.slice(1).map(z=>{
    const o={}; felder.forEach((f,i)=>o[f]=(z[i]!==undefined?String(z[i]).trim():""));
    return o;
  }).filter(o=>Object.values(o).some(v=>v!==""));
  return eintraege.length ? [{pfad:name.replace(/\.[^.]+$/,""), eintraege, felder}] : [];
}

/* ---------- Markdown ----------
   Erkannt wird die Form, die Sluuw selbst ausgibt: "## Figuren" als
   Gruppe, darunter "### Name" je Eintrag und "**Feld:** Wert" als
   Angaben. Alles andere unter einer Überschrift wird zum Fließtext.
   Eine fremde Datei ohne diese Struktur landet als Notizen – besser
   als sie abzuweisen. */
function mdWert(zeile){
  const m=zeile.match(/^\s*[-*]?\s*\*\*(.+?):?\*\*:?\s*(.*)$/);
  return m ? [m[1].trim(), m[2].trim()] : null;
}
function mdDatensaetze(text, name){
  const zeilen=String(text).split(/\r?\n/);
  const gruppen=new Map();          /* Gruppenname -> Liste von Einträgen */
  let gruppe=name.replace(/\.[^.]+$/,"");
  let eintrag=null, fliess=[];

  const abschliessen=()=>{
    if(!eintrag) return;
    const t=fliess.join("\n").trim();
    if(t) eintrag["Text"]=(eintrag["Text"]?eintrag["Text"]+"\n\n":"")+t;
    fliess=[];
    if(!gruppen.has(gruppe)) gruppen.set(gruppe, []);
    gruppen.get(gruppe).push(eintrag);
    eintrag=null;
  };

  zeilen.forEach(z=>{
    const h=z.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      const tiefe=h[1].length;
      const roh=h[2].trim();
      const titel=roh.replace(/[*_`]/g,"").trim();
      if(tiefe<=2){ abschliessen(); gruppe=titel||gruppe; return; }
      abschliessen();
      /* "### 3. Der Ruf des Nordens *(Entwurf)*" – die Nummer und der
         kursive Zusatz am Ende gehören nicht in den Namen. Geprüft wird
         am Rohtext, weil die Sternchen sonst schon entfernt wären. */
      const klammer=(roh.match(/[*_]?\((.+?)\)[*_]?\s*$/)||[])[1];
      let name=roh.replace(/[*_]?\(.+?\)[*_]?\s*$/,"").replace(/[*_`]/g,"")
                  .replace(/^\d+[.)]\s*/,"").trim();
      eintrag={Name:name||titel};
      if(klammer) eintrag["Status"]=klammer.trim();
      return;
    }
    if(!eintrag) return;
    const p=mdWert(z);
    if(p && p[1]){ eintrag[p[0]]=eintrag[p[0]]?eintrag[p[0]]+" · "+p[1]:p[1]; return; }
    if(/^\s*[-*]\s*\[[ xX]\]/.test(z)) return;     /* Häkchenlisten sind Schritte, keine Felder */
    if(z.trim()) fliess.push(z.replace(/^>\s?/,"").trim());
  });
  abschliessen();

  const saetze=[];
  gruppen.forEach((eintraege, g)=>{
    if(!eintraege.length) return;
    const felder=[];
    eintraege.forEach(e=>Object.keys(e).forEach(k=>{ if(!felder.includes(k)) felder.push(k); }));
    saetze.push({pfad:g, eintraege, felder});
  });
  return saetze;
}

/* Wählt anhand der Endung – und notfalls anhand des Inhalts. */
function importZerlegen(text, endung, name){
  const t=String(text||"");
  const e=String(endung||"").toLowerCase();
  if(e==="json"){
    let daten=null;
    try{ daten=JSON.parse(t); }catch(err){ return {fehler:err.message}; }
    return {saetze:jsonDatensaetze(daten)};
  }
  if(e==="csv"||e==="tsv") return {saetze:csvDatensaetze(t, name)};
  if(e==="md"||e==="markdown") return {saetze:mdDatensaetze(t, name)};
  /* Unbekannt oder .txt: erst JSON versuchen, dann Tabelle, dann Text. */
  const roh=t.trim();
  if(roh.startsWith("{")||roh.startsWith("[")){
    try{ return {saetze:jsonDatensaetze(JSON.parse(roh))}; }catch(err){}
  }
  if(/^#{1,6}\s/m.test(t)) return {saetze:mdDatensaetze(t, name)};
  const alsTabelle=csvDatensaetze(t, name);
  if(alsTabelle.length && alsTabelle[0].felder.length>1) return {saetze:alsTabelle};
  return {saetze:mdDatensaetze(t, name)};
}

/* Ein Weg für alle Formate: Datei lesen, zerlegen, Vorschau zeigen. */
async function importDatei(pfad){
  if(!DATEI||!DATEI.importLesen){
    await dlgInfo(tx("an.nichtVerfueg"), tx("ki.jsonNurApp"));
    return;
  }
  const r=await DATEI.importLesen(pfad||null);
  if(!r||!r.ok){ if(r&&!r.abgebrochen) await dlgInfo(tx("sp.dateiUnles"),(r&&r.fehler)||tx("ki.unbekannt")); return; }
  await importVerarbeiten(r.text, r.endung, r.name);
}

async function importVerarbeiten(text, endung, name){
  const erg=importZerlegen(text, endung, name);
  if(erg.fehler){ await dlgInfo(tx("sp.dateiUnles"), erg.fehler); return; }
  const saetze=erg.saetze||[];
  if(!saetze.length){
    await dlgInfo(tx("ki.nichtsGefunden"),
      tx("ki.keineListe", name)+"\n\n"+tx("imp.formate"));
    return;
  }
  jsonPlan={
    name,
    saetze:saetze.map((s,i)=>{
      const art=rateArt(s.pfad, s.felder);
      return {...s, nr:i, art, an:true, zuordnung:rateZuordnung(art, s.felder)};
    })
  };
  jsonDialogZeigen();
}

async function jsonImport(){
  if(!DATEI||!DATEI.jsonLesen){
    await dlgInfo(tx("an.nichtVerfueg"), tx("ki.jsonNurApp"));
    return;
  }
  const r=await DATEI.jsonLesen();
  if(!r||!r.ok){ if(r&&!r.abgebrochen) await dlgInfo(tx("sp.dateiUnles"),(r&&r.fehler)||tx("ki.unbekannt")); return; }

  const saetze=jsonDatensaetze(r.daten);
  if(!saetze.length){
    await dlgInfo(tx("ki.nichtsGefunden"),
      tx("ki.keineListe", r.name)+"\n\n"+tx("ki.erwartet")+"\n"+
      '{ "figuren": [ { "name": "Mira", "role": "protagonist" } ] }');
    return;
  }

  jsonPlan={
    name:r.name,
    saetze:saetze.map((s,i)=>{
      const art=rateArt(s.pfad, s.felder);
      return {...s, nr:i, art, an:true, zuordnung:rateZuordnung(art, s.felder)};
    })
  };
  jsonDialogZeigen();
}

function jsonSetzeArt(nr, art){
  const s=jsonPlan.saetze[nr];
  s.art=art;
  s.zuordnung=rateZuordnung(art, s.felder);   // Zielfelder ändern sich mit der Art
  jsonDialogZeigen();
}
function jsonSetzeFeld(nr, quelle, ziel){
  const s=jsonPlan.saetze[nr];
  if(ziel) Object.keys(s.zuordnung).forEach(q=>{ if(q!==quelle&&s.zuordnung[q]===ziel) s.zuordnung[q]=""; });
  s.zuordnung[quelle]=ziel;
  jsonDialogZeigen();
}
function jsonSetzeAn(nr, an){ jsonPlan.saetze[nr].an=an; jsonDialogZeigen(); }
function jsonAbbrechen(){ jsonPlan=null; const o=$("jsonOverlay"); if(o) o.remove(); }

function jsonDialogZeigen(){
  const alt=$("jsonOverlay"); if(alt) alt.remove();
  const gesamt=jsonPlan.saetze.filter(s=>s.an).reduce((n,s)=>n+s.eintraege.length,0);

  const ov=document.createElement("div");
  ov.className="overlay show"; ov.id="jsonOverlay";
  ov.innerHTML=`<div class="modal jsonModal">
    <h2>${esc(tx("imp.titel"))}</h2>
    <p class="dlgText">${esc(tx("imp.gefunden", jsonPlan.name, jsonPlan.saetze.length))}</p>

    ${jsonPlan.saetze.map(s=>{
      const K=KINDS[s.art];
      const erlaubt=K.fields.filter(f=>f.t!=="image");
      const beispiel=s.eintraege[0]||{};
      return `<div class="jsSatz${s.an?"":" aus"}">
        <div class="jsKopf">
          <label class="jsAn"><input type="checkbox" ${s.an?"checked":""}
            onchange="jsonSetzeAn(${s.nr}, this.checked)"> ${esc(tx("imp.uebernehmen"))}</label>
          <code class="jsPfad">${esc(s.pfad)}</code>
          <span class="jsAnzahl">${esc(tx("imp.nEintraege", s.eintraege.length))}</span>
          <select onchange="jsonSetzeArt(${s.nr}, this.value)" title="${esc(tx("imp.alsArt"))}">
            ${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${k===s.art?"selected":""}>${esc(v.icon+" "+v.label)}</option>`).join("")}
          </select>
        </div>
        <table class="jsTabelle">
          <thead><tr><th>${esc(tx("imp.spFeld"))}</th><th>${esc(tx("imp.spWird"))}</th><th>${esc(tx("imp.spBeispiel"))}</th></tr></thead>
          <tbody>${s.felder.map(q=>{
            const wert=jsonWert(beispiel[q]);
            return `<tr class="${s.zuordnung[q]?"":"jsAus"}">
              <td><code>${esc(q)}</code></td>
              <td><select onchange="jsonSetzeFeld(${s.nr}, ${JSON.stringify(q).replace(/"/g,"&quot;")}, this.value)">
                <option value="">${esc(tx("imp.nichtUeber"))}</option>
                ${erlaubt.map(f=>`<option value="${f.k}" ${s.zuordnung[q]===f.k?"selected":""}>${esc(f.l.replace(" *",""))}</option>`).join("")}
              </select></td>
              <td class="jsWert" title="${esc(wert)}">${esc(wert.slice(0,120))}</td>
            </tr>`;}).join("")}</tbody>
        </table>
      </div>`;
    }).join("")}

    <div class="modalBtns">
      <span class="jsSumme">${esc(tx("imp.summe", gesamt))}</span>
      <button class="btn" onclick="jsonAbbrechen()">${esc(tx("btn.abbrechen"))}</button>
      <button class="btn primary" ${gesamt?"":"disabled"} onclick="jsonUebernehmen()">${esc(tx("imp.anlegen"))}</button>
    </div>
  </div>`;
  hintergrundKlick(ov, jsonAbbrechen);
  document.body.appendChild(ov);
}

function jsonUebernehmen(){
  if(!jsonPlan) return;
  let n=0;
  const proArt={};
  jsonPlan.saetze.filter(s=>s.an).forEach(s=>{
    const neue=jsonZuEintraegen(s.eintraege, s.art, s.zuordnung);
    const maxOrder=Math.max(0,...byKind(s.art).map(i=>i.order||0));
    neue.forEach((e,i)=>{
      e.id=uid(); e.added=todayStr(); e.touched=nowIso(); e.order=maxOrder+1+i;
      state.items.push(e); n++;
    });
    proArt[s.art]=(proArt[s.art]||0)+neue.length;
  });
  jsonAbbrechen();
  suchIndexLeeren(); save(); renderAll();
  const teile=Object.entries(proArt).map(([k,v])=>v+" "+KINDS[k].plural);
  toast(tx("ex.gelesen", n)+(teile.length?" · "+teile.join(", "):""));
}

/* ============================================================
   SPRACHE
   Deutsch ist die Quellsprache. Fehlt ein Text in der gewählten
   Sprache, greift Englisch, dann Deutsch – auf dem Bildschirm
   steht also nie eine leere Stelle oder ein roher Schlüssel.

   Die Sprache gehört zum Rechner, nicht zum Buch: sie liegt
   deshalb in den Programmeinstellungen und nicht in der
   .story-Datei. Sonst würde ein weitergegebenes Projekt die
   Oberfläche des Empfängers umstellen.
   ============================================================ */
/* Der Produktname steht in der Oberfläche an genau einer Stelle. Die
   verbindliche Fassung liegt in src/main/produkt.js; test-kennung.js
   hält beide zusammen, damit sie nicht auseinanderlaufen. */
const PRODUKT = "Sluuw";
const SPR = (typeof SluuwSprachen!=="undefined") ? SluuwSprachen : null;
const SPRACHEN   = SPR ? SPR.SPRACHEN   : {de:{eigen:"Deutsch", deutsch:"Deutsch", rtl:false}};
const SPRACHLISTE= SPR ? SPR.REIHENFOLGE: ["de"];
const TEXTE      = SPR ? SPR.TEXTE      : {};
const ARTKUERZEL = SPR ? SPR.ARTKUERZEL : {};
let sprache="en";

/* tx("nav.kapitel") oder mit Platzhaltern: tx("zeit.vorMin", 12) */
function tx(schluessel, ...werte){
  const zeile=TEXTE[schluessel];
  let text = zeile ? (zeile[sprache] || zeile.en || zeile.de) : null;
  if(text===null||text===undefined) text=schluessel;   // sichtbar, statt still leer zu bleiben
  return String(text).replace(/\{(\d+)\}/g, (m,i)=> werte[+i]!==undefined ? werte[+i] : m);
}
/* Kürzel einer Eintragsart in der Änderungsliste */
function artKuerzel(art){
  const z=ARTKUERZEL[art];
  return z ? (z[sprache]||z.en||z.de) : "???";
}
function istRtl(){ return !!(SPRACHEN[sprache]&&SPRACHEN[sprache].rtl); }

/* Name einer Sprache in der gerade eingestellten Sprache – „German" auf
   Englisch, „alemán" auf Spanisch. Chromium bringt die Namen für alle
   Sprachen mit, deshalb müssen sie nicht übersetzt gepflegt werden.
   Fehlt die Unterstützung, bleibt der deutsche Name aus der Sprachdatei. */
let _namenCache={};
function sprachName(code){
  const schl=sprache+"/"+code;
  if(_namenCache[schl]) return _namenCache[schl];
  let name=null;
  try{ name=new Intl.DisplayNames([sprache],{type:"language"}).of(code); }catch(e){}
  if(!name||name===code) name=(SPRACHEN[code]||{}).deutsch||code;
  // Groß am Anfang: manche Sprachen liefern klein geschriebene Namen
  name=name.charAt(0).toUpperCase()+name.slice(1);
  _namenCache[schl]=name;
  return name;
}

/* Was nicht bei jedem Zeichnen neu entsteht, muss beim Sprachwechsel
   eigens nachgezogen werden: die Menüleiste des Profi-Modus und die
   wenigen festen Beschriftungen im Markup. */
function beschrifteFest(){
  renderProChrome();
  const setzen=(id, text)=>{ const e=$(id); if(!e) return;
    e.setAttribute("title", text); e.setAttribute("aria-label", text); };
  const feld=$("sSearch");
  if(feld){
    feld.setAttribute("placeholder", tx("pr.suchen"));
    feld.setAttribute("aria-label", tx("kopf.suchen"));
    feld.setAttribute("title", tx("kopf.suchHinweis"));
  }
  const kb=$("sSearchKb"); if(kb) kb.textContent=tx("tk.strg")+" K";
  const pl=$("proLabel"); if(pl) pl.textContent=tx("pro.modus");
  setzen("proSwitch", tx("pro.modus"));
  const ps=$("proSwitch"); if(ps) ps.setAttribute("title", tx("pro.wechseln"));
  setzen("optsBtn",  tx("ein.knopf"));
  setzen("themeBtn", tx("thema.knopf"));
  setzen("tbClose", tx("btn.schliessen"));
  setzen("tbMin",   tx("fen.minimieren"));
  setzen("tbMax",   tx("fen.maximieren"));
}

function setSprache(code, still){
  if(!SPRACHEN[code]) code="en";
  sprache=code; _namenCache={};
  einstellungen.sprache=code;
  document.documentElement.lang=code;
  /* Arabisch und Urdu laufen von rechts nach links. dir="rtl" dreht
     Textfluss, Ausrichtung und die Reihenfolge der Flex-Kästen mit. */
  document.documentElement.dir = istRtl() ? "rtl" : "ltr";
  document.body.classList.toggle("rtl", istRtl());
  beschrifteFest();
  if(!still){
    einstellungenSpeichern();
    renderAll();
    if($("optsOverlay").classList.contains("show")) renderOpts();
    toast(tx("ein.sprache")+": "+SPRACHEN[code].eigen);
  }
}

/* ============================================================
   PROGRAMMEINSTELLUNGEN
   Getrennt vom Projekt: das gehört zum Rechner, nicht zum Buch.
   Deshalb im lokalen Speicher und nicht in der .story-Datei –
   sonst würde ein weitergegebenes Projekt die Einstellungen des
   Empfängers überschreiben.
   ============================================================ */
/* Englisch ist die Standardsprache: die App wird international angeboten,
   und Englisch versteht der größte Teil der Zielgruppe. */
const EINST_STANDARD = {updates:true, sprache:"en"};
let einstellungen = Object.assign({}, EINST_STANDARD);
function einstellungenLaden(){
  try{
    /* Beim Umbenennen von StoryPlaner auf Sluuw soll niemand seine
       Sprachwahl verlieren: fehlt der neue Schlüssel, wird einmal der
       alte gelesen und danach unter dem neuen Namen gesichert. */
    let roh=localStorage.getItem("sluuw.einstellungen");
    let uebernommen=false;
    if(roh===null){ roh=localStorage.getItem("storyplaner.einstellungen"); uebernommen=roh!==null; }
    const d=JSON.parse(roh);
    if(d&&typeof d==="object") einstellungen=Object.assign({}, EINST_STANDARD, {
      updates:d.updates!==false,
      sprache:(d.sprache&&SPRACHEN[d.sprache])?d.sprache:"en"
    });
    if(uebernommen) einstellungenSpeichern();
  }catch(e){}
  setSprache(einstellungen.sprache, true);
  updateEinstellungMelden();
}
function einstellungenSpeichern(){
  try{ localStorage.setItem("sluuw.einstellungen", JSON.stringify(einstellungen)); }catch(e){}
}
function updateEinstellungMelden(){
  try{ window.sluuw.app.updateEinstellung(einstellungen.updates); }catch(e){}
}
function setUpdates(an){
  einstellungen.updates=!!an;
  einstellungenSpeichern(); updateEinstellungMelden(); renderOpts();
  toast(an?tx("upd.anGemeldet"):tx("upd.ausGemeldet"));
}

/* ============================================================
   AKTUALISIERUNG – ANZEIGE
   ============================================================ */
let updateStand={stand:"unbekannt"};
function updateStandText(){
  const s=updateStand;
  if(s.stand==="suche") return tx("upd.suche");
  if(s.stand==="keine") return tx("upd.keine");
  if(s.stand==="verfuegbar") return tx("upd.verfuegbar", s.version);
  if(s.stand==="laedt") return tx("upd.laedt", s.prozent||0);
  if(s.stand==="geladen") return tx("upd.geladen", s.version);
  if(s.stand==="fehler") return tx("upd.fehler", s.fehler||"?");
  if(s.stand==="nicht-eingerichtet") return tx("upd.keineQuelle");
  if(s.stand==="entwicklungsbetrieb") return tx("upd.entwicklung");
  return tx("upd.ungeprueft");
}
async function updatePruefen(){
  updateStand={stand:"suche"}; renderOpts();
  let r=null;
  try{ r=await window.sluuw.app.aktualisierungPruefen(); }catch(e){}
  if(r&&!r.ok){ updateStand={stand:r.grund, fehler:r.fehler}; renderOpts(); }
}

/* ============================================================
   PROJEKTMENÜ
   Hängt an der Projektkarte in der Seitenleiste und führt alle
   Dateibefehle zusammen: anlegen, öffnen, speichern, einlesen,
   ausgeben – dazu die zuletzt geöffneten Projekte.
   ============================================================ */
function popupSchliessen(){ const p=$("popupMenu"); if(p) p.remove(); }
function popup(anker, eintraege){
  popupSchliessen();
  const el=document.createElement("div");
  el.id="popupMenu"; el.className="popupMenu";
  el.innerHTML=eintraege.map((e,i)=> e.sep
    ? `<div class="popSep"></div>`
    : `<button class="popItem${e.aus?" aus":""}" data-i="${i}"${e.aus?" disabled":""}>
        <span class="pl">${esc(e.t)}</span>${e.kb?`<span class="pk">${esc(e.kb)}</span>`:""}
        ${e.sub?`<span class="ps">${esc(e.sub)}</span>`:""}</button>`).join("");
  document.body.appendChild(el);
  const r=anker.getBoundingClientRect();
  el.style.left=Math.max(8, Math.min(r.left, window.innerWidth-el.offsetWidth-8))+"px";
  let top=r.bottom+4;
  if(top+el.offsetHeight>window.innerHeight-8) top=Math.max(8, r.top-el.offsetHeight-4);
  el.style.top=top+"px";
  el.addEventListener("click",ev=>{
    const b=ev.target.closest("[data-i]"); if(!b) return;
    const e=eintraege[+b.dataset.i];
    popupSchliessen();
    if(e&&e.run) e.run();
  });
  /* Klick daneben schließt. Der Anker ist ausgenommen: sonst schlösse
     das Drücken auf die Projektkarte das Menü, und der darauf folgende
     Klick öffnete es sofort wieder – es ließe sich nie zuklappen. */
  setTimeout(()=>{
    const zu=ev=>{
      if(ev.target.closest("#popupMenu")) return;
      if(anker && anker.contains && anker.contains(ev.target)) return;
      popupSchliessen();
      document.removeEventListener("mousedown",zu,true);
    };
    document.addEventListener("mousedown",zu,true);
  },0);
}
function projektMenue(anker){
  /* Ein zweiter Klick auf die Projektkarte schließt das Menü wieder.
     Vorher blieb es offen und man musste danebenklicken. */
  if($("popupMenu")){ popupSchliessen(); return; }
  const zuletzt=zuletztListe.filter(e=>e.file!==projektDatei).slice(0,6);
  /* Auch die Umschalt- und Steuerungstaste heißen nicht überall gleich. */
  const strg=tx("tk.strg"), umsch=tx("tk.umsch");
  const e=[
    {t:tx("pm.neu"), kb:strg+"+N", run:projektNeu},
    {t:tx("pm.oeffnen"), kb:strg+"+O", run:()=>projektOeffnen()},
    {t:tx("bib.titel"), sub:tx("bib.ordner"), run:()=>go("bibliothek"), aus:!BIB},
    {sep:1},
    {t:tx("pm.speichern"), kb:strg+"+S", run:()=>speichereJetzt(false)},
    {t:tx("pm.speichernUnter"), kb:strg+"+"+umsch+"+S", run:()=>speichereJetzt(true)},
    {sep:1},
    {t:tx("pm.manuskript"), run:manuskriptEinlesen, aus:!DATEI},
    {t:tx("pm.sicherungLesen"), run:importJSON},
    {t:tx("pm.einlesen"), run:()=>importDatei(), aus:!DATEI},
    {t:tx("pm.kiExport"), run:kiExport},
    {t:tx("pm.sicherungGeben"), run:()=>exportJSON(true)},
    {t:tx("nav.expose"), run:exportMarkdown},
    {t:tx("pm.projektExport"), run:projektExport, aus:!DATEI},
    {sep:1}
  ];
  if(zuletzt.length){
    zuletzt.forEach(z=>e.push({t:z.title||dateiName(z.file), sub:dateiName(z.file), run:()=>projektOeffnen(z.file)}));
    e.push({sep:1});
  }
  e.push({t:tx("btn.ordnerZeigen"), run:()=>window.sluuw.app.ordnerZeigen("sicherungen"), aus:!DATEI||!projektDatei});
  e.push({t:tx("pm.rechtliches"), run:()=>rechtDialog()});
  e.push({t:tx("pm.ueber"), run:ueberDialog});
  popup(anker, e);
}

/* ============================================================
   WORTZAHLEN AUS DEM MANUSKRIPT
   Der Hauptprozess liest .docx/.odt/.rtf/.txt/.md und liefert
   Abschnitte samt Wortzahl zurück. Hier werden sie den Kapiteln
   zugeordnet – erst per Namensgleichheit, dann der Reihe nach.
   ============================================================ */
async function manuskriptEinlesen(){
  if(!window.sluuw||!window.sluuw.manuskript){
    await dlgInfo(tx("an.nichtVerfueg"), tx("mk.nurAnwendung"));
    return;
  }
  const r=await window.sluuw.manuskript.lesen();
  if(!r||!r.ok){ if(r&&!r.abgebrochen) await dlgInfo(tx("mk.unlesbar"),(r&&r.fehler)||tx("ki.unbekannt")); return; }

  const abschnitte=[];
  r.dateien.forEach(d=>d.sections.forEach(s=>abschnitte.push(s)));
  if(!abschnitte.length){ await dlgInfo(tx("ki.nichtsGefunden"), tx("mk.keinText")); return; }

  const kapitel=byKind("kapitel").sort((a,b)=>(a.order||0)-(b.order||0));
  const gesamt=abschnitte.reduce((n,s)=>n+s.words,0);

  /* Zuordnung: gleicher Titel schlägt Reihenfolge. */
  const offen=abschnitte.slice();
  const plan=[];
  kapitel.forEach(k=>{
    const t=itemName(k).trim().toLowerCase();
    const i=offen.findIndex(s=>s.title&&s.title.trim().toLowerCase()===t);
    if(i>=0){ plan.push({kapitel:k, abschnitt:offen.splice(i,1)[0], wie:tx("mk.wieTitel")}); }
  });
  kapitel.filter(k=>!plan.some(p=>p.kapitel===k)).forEach(k=>{
    if(offen.length) plan.push({kapitel:k, abschnitt:offen.shift(), wie:tx("mk.wieReihe")});
  });

  const zeilen=plan.map(p=>`${itemName(p.kapitel)}: ${zahl(p.kapitel.words||0)} → ${zahl(p.abschnitt.words)} (${p.wie})`);
  const rest=offen.length?"\n"+tx("mk.ohnePassend", offen.length, offen.map(s=>s.title||tx("fm.ohneTitel")).slice(0,5).join(", ")):"";
  const uebrig=kapitel.length-plan.length;

  const ok=await dlgFrage(tx("mk.uebernehmen"),
    tx("mk.kopf", r.dateien.map(d=>d.name).join(", "), abschnitte.length, zahl(gesamt))+"\n\n"+
    zeilen.slice(0,12).join("\n")+(zeilen.length>12?"\n"+tx("mk.weitere", zeilen.length-12):"")+
    (uebrig>0?"\n"+tx("mk.unveraendert", uebrig):"")+rest,
    tx("btn.uebernehmen"));
  if(!ok) return;

  plan.forEach(p=>{ p.kapitel.words=p.abschnitt.words; touch(p.kapitel.id); });
  suchIndexLeeren(); save(); renderAll();
  toast(tx("mk.fertig", plan.length, zahl(totalWords())));
}

/* ================= RECHTLICHES =================
   Ein Fenster mit drei Reitern. Die Texte kommen als Markdown aus
   dem Paket; hier wird nur so viel davon umgesetzt, wie in diesen
   Dateien vorkommt – Überschriften, Absätze, Listen, Zitate, Code.
   Eine Bibliothek dafür wäre bei fünf Konstrukten übertrieben.

   Wichtig: markdown() maskiert ZUERST und setzt danach um. Andersherum
   könnte ein < aus einer Datei zu einem Element werden. */
let rtOffen = null;

/* Am Anfang jeder Vorlage steht ein Zitatblock mit Anweisungen an mich
   selbst („Vorlage. Alle […] ausfüllen"). Der gehört in die Datei, aber
   nicht auf den Bildschirm der Nutzerin – dort wirkte er wie ein Fehler.
   Deshalb fliegt genau dieser eine Block heraus, und nur er: andere
   Zitate im Text bleiben stehen. */
function rtOhneVorlagenhinweis(roh){
  const zeilen = String(roh||"").replace(/\r\n/g,"\n").split("\n");
  const aus=[]; let imHinweis=false;
  for(const z of zeilen){
    const t=z.trim();
    if(!imHinweis && /^>\s*\*\*(Vorlage|Template)\.?\*\*/.test(t)){ imHinweis=true; continue; }
    if(imHinweis){
      if(t.startsWith(">")) continue;      // Fortsetzung des Zitats
      imHinweis=false;                     // erste Zeile danach beendet ihn
      if(!t) continue;                     // die Leerzeile gleich mit
    }
    aus.push(z);
  }
  return aus.join("\n");
}

function rtMarkdown(roh){
  const zeilen = rtOhneVorlagenhinweis(roh).split("\n");
  const aus=[]; let inListe=false, inZitat=[];
  const zitatSchliessen=()=>{ if(inZitat.length){
    aus.push("<blockquote>"+inZitat.join(" ")+"</blockquote>"); inZitat=[]; } };
  const listeSchliessen=()=>{ if(inListe){ aus.push("</ul>"); inListe=false; } };

  /* Fett, Code und die eckigen Lücken der Vorlagen hervorheben –
     Letzteres, damit sofort auffällt, was noch auszufüllen ist. */
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (m,t)=>"<code>"+t+"</code>")
    .replace(/\*\*([^*]+)\*\*/g, (m,t)=>"<strong>"+t+"</strong>")
    .replace(/\[([^\]]{2,})\]/g, (m,t)=>'<span class="luecke">['+t+']</span>');

  zeilen.forEach(z=>{
    const t=z.trim();
    if(!t){ listeSchliessen(); zitatSchliessen(); return; }
    if(t.startsWith("> ")){ listeSchliessen(); inZitat.push(inline(t.slice(2))); return; }
    zitatSchliessen();
    const h=t.match(/^(#{1,3})\s+(.*)$/);
    if(h){ listeSchliessen(); const n=h[1].length; aus.push("<h"+n+">"+inline(h[2])+"</h"+n+">"); return; }
    if(/^[-*]\s+/.test(t)){ if(!inListe){ aus.push("<ul>"); inListe=true; }
      aus.push("<li>"+inline(t.replace(/^[-*]\s+/,""))+"</li>"); return; }
    listeSchliessen();
    aus.push("<p>"+inline(t)+"</p>");
  });
  listeSchliessen(); zitatSchliessen();
  return aus.join("");
}

/* Welche Datei zu welchem Reiter gehört. Impressum gibt es nur auf
   Deutsch – es erfüllt eine deutsche Pflicht und wird sonst überall
   in derselben Fassung gezeigt, weil die Anbieterangaben dieselben
   sind. Datenschutz und Lizenz liegen zweisprachig vor. */
function rtDatei(reiter){
  const d = sprache === "de";
  /* Auch die Anbieterangaben gibt es zweisprachig. Die deutsche Fassung
     ist die verbindliche – § 5 DDG verlangt sie –, aber wer die App auf
     Englisch bedient, soll nicht plötzlich vor deutschem Text sitzen.
     Genau das war vorher der Fall und sah entsprechend falsch aus. */
  if(reiter === "impressum")   return d ? "impressum" : "imprint";
  if(reiter === "datenschutz") return d ? "datenschutz" : "privacy";
  return d ? "lizenz" : "license";
}

  if(rtOffen){ rtWechseln(reiter || "impressum"); return; }

      <button class="btn primary" id="rtZu">${esc(tx("btn.schliessen"))}</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  rtOffen=ov;

  ov.querySelectorAll("[data-r]").forEach(b =>
    b.addEventListener("click", ()=>rtWechseln(b.dataset.r)));
  ov.querySelector("#rtOrdner").addEventListener("click",
    ()=>{ try{ window.sluuw.app.ordnerZeigen("programm"); }catch(e){} });
  ov.querySelector("#rtZu").addEventListener("click", rechtSchliessen);
  hintergrundKlick(ov, rechtSchliessen);

function rtTaste(e){
  if(e.key==="Escape" && rtOffen){ e.preventDefault(); e.stopPropagation(); rechtSchliessen(); }
}
function rechtSchliessen(){
  if(!rtOffen) return;
  rtOffen.remove(); rtOffen=null;
  document.removeEventListener("keydown", rtTaste, true);
}

async function rtWechseln(reiter){
  if(!rtOffen) return;
  rtOffen.querySelectorAll("[data-r]").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.r===reiter)));
  const ziel=rtOffen.querySelector("#rtInhalt");
  ziel.textContent="…";
  let r=null;
  try{ r=await window.sluuw.app.rechtstext(rtDatei(reiter)); }catch(e){}
  if(!rtOffen) return;                       // zwischenzeitlich geschlossen
  ziel.innerHTML = (r && r.ok && r.text)
    ? rtMarkdown(r.text)
    : `<p>${esc(tx("rt.nichtLesbar"))}</p>`;
  ziel.scrollTop=0;
}

/* ============================================================
   ORDNER
   Eine zweite Ordnung neben den Eintragsarten: Kapitel, Figuren und
   Orte lassen sich so gruppieren, wie der Kopf gerade sortiert –
   „Teil 1", „Nebenhandlung", „noch offen". Ein Eintrag liegt in
   höchstens einem Ordner; wer keinen wählt, arbeitet wie bisher.
   ============================================================ */
let ordnerAuf=null;                 /* null = Wurzel, sonst Ordner-Id */
const ordnerOffen=new Set();        /* aufgeklappte Zweige im Baum */

function ordnerListe(){ if(!Array.isArray(state.ordner)) state.ordner=[]; return state.ordner; }
function ordnerVon(id){ return ordnerListe().find(o=>o.id===id)||null; }
function ordnerKinder(id){
  return ordnerListe().filter(o=>(o.parent||"")===(id||""))
    .sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name));
}
function ordnerInhalt(id){
  return state.items.filter(i=>(i.folder||"")===(id||""));
}
/* Weg von der Wurzel bis zum Ordner – für die Brotkrumen und um
   Schleifen beim Verschieben auszuschließen. */
function ordnerPfad(id){
  const weg=[]; let o=ordnerVon(id), schutz=0;
  while(o && schutz++<50){ weg.unshift(o); o=ordnerVon(o.parent); }
  return weg;
}
function ordnerTiefe(id){ return ordnerPfad(id).length; }
function ordnerIstIn(kind, moeglicherElter){
  if(!kind||!moeglicherElter) return false;
  return ordnerPfad(kind).some(o=>o.id===moeglicherElter);
}
/* Zählt alles, was an einem Ordner hängt – auch über Unterordner. */
function ordnerZahl(id){
  let n=ordnerInhalt(id).length;
  ordnerKinder(id).forEach(k=>n+=ordnerZahl(k.id));
  return n;
}

async function ordnerNeu(elter){
  if(ordnerTiefe(elter)>=ORDNER_TIEFE){ toast(tx("or.tiefe", ORDNER_TIEFE)); return; }
  const name=await dlgEingabe(elter?tx("or.unterordner"):tx("or.neuerOrdner"), tx("dlg.name"), "");
  if(!name||!name.trim()) return;
  const o={id:uid(), name:name.trim(), parent:elter||"",
           order:Math.max(0,...ordnerKinder(elter).map(k=>k.order||0))+1};
  ordnerListe().push(o);
  if(elter) ordnerOffen.add(elter);
  ordnerAuf=o.id;
  save(); renderPro(); toast(tx("or.angelegt", o.name));
}
async function ordnerUmbenennen(id){
  const o=ordnerVon(id); if(!o) return;
  const name=await dlgEingabe(tx("or.umbenennen"), tx("dlg.name"), o.name);
  if(!name||!name.trim()) return;
  o.name=name.trim(); save(); renderPro();
}
async function ordnerLoeschen(id){
  const o=ordnerVon(id); if(!o) return;
  const drin=ordnerInhalt(id).length;
  if(!await dlgFrage(tx("or.loeschen"), tx("or.loeschenFrage", o.name, drin), tx("btn.loeschen"), true)) return;
  const hoch=o.parent||"";
  /* Nichts wird mitgelöscht: Inhalt und Unterordner rutschen eine Ebene hoch. */
  state.items.forEach(i=>{ if((i.folder||"")===id) i.folder=hoch; });
  ordnerListe().forEach(k=>{ if((k.parent||"")===id) k.parent=hoch; });
  state.ordner=ordnerListe().filter(x=>x.id!==id);
  if(ordnerAuf===id) ordnerAuf=hoch||null;
  save(); renderPro();
}
/* Verschiebt einen Eintrag oder einen Ordner. Ein Ordner darf nicht in
   sich selbst wandern – das ergäbe einen Kreis, aus dem der Baum nicht
   mehr herausfindet. */
function ordnerVerschieben(was, zielId){
  const ziel=zielId||"";
  const o=ordnerVon(was);
  if(o){
    if(was===ziel || ordnerIstIn(ziel, was)) return false;
    if(ordnerTiefe(ziel)+1>ORDNER_TIEFE){ toast(tx("or.tiefe", ORDNER_TIEFE)); return false; }
    o.parent=ziel;
  } else {
    const it=state.items.find(i=>i.id===was);
    if(!it) return false;
    it.folder=ziel; touch(it.id);
  }
  save(); renderPro();
  const name=ziel?ordnerVon(ziel).name:tx("or.alle");
  toast(tx("or.verschoben", o?o.name:itemName(state.items.find(i=>i.id===was)), name));
  return true;
}
function ordnerZweig(id, ebene){
  const kinder=ordnerKinder(id);
  return kinder.map(k=>{
    const hatKinder=ordnerKinder(k.id).length>0;
    const auf=ordnerOffen.has(k.id);
    return `<div class="obZeile ${ordnerAuf===k.id?"aktiv":""}" data-ordner="${k.id}" draggable="true"
        style="padding-left:${6+ebene*14}px" onclick="ordnerAuf='${k.id}';renderPro()">
        <button class="obPfeil" onclick="event.stopPropagation();ordnerKlappen('${k.id}')"
          aria-label="${esc(tx("or.unterordner"))}">${hatKinder?(auf?"▾":"▸"):"·"}</button>
        <span class="obName">📁 ${esc(k.name)}</span>
        <span class="obZahl">${ordnerZahl(k.id)||""}</span>
      </div>` + (auf?ordnerZweig(k.id, ebene+1):"");
  }).join("");
}
function ordnerKlappen(id){
  ordnerOffen.has(id)?ordnerOffen.delete(id):ordnerOffen.add(id);
  renderPro();
}

/* Ziehen und Ablegen: Einträge und Ordner lassen sich in jeden Ordner
   des Baums und in jede Zeile der Liste fallen lassen. */
function ordnerZiehenVerdrahten(el){
  el.querySelectorAll("[draggable=true]").forEach(z=>{
    z.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("text/plain", z.dataset.id || z.dataset.ordner || "");
      e.dataTransfer.effectAllowed="move";
    });
  });
  el.querySelectorAll("[data-ordner]").forEach(ziel=>{
    ziel.addEventListener("dragover", e=>{ e.preventDefault(); ziel.classList.add("obZiel"); });
    ziel.addEventListener("dragleave", ()=>ziel.classList.remove("obZiel"));
    ziel.addEventListener("drop", e=>{
      e.preventDefault(); e.stopPropagation();
      ziel.classList.remove("obZiel");
      const was=e.dataTransfer.getData("text/plain");
      if(was) ordnerVerschieben(was, ziel.dataset.ordner);
    });
  });
}

   werden die Zuhörer dort angemeldet und nicht einmalig beim Start –
   sonst hängen sie an Knöpfen, die es längst nicht mehr gibt. */
function proMenuesVerdrahten(){
  document.querySelectorAll(".pMenu>button").forEach(b=>{
    b.addEventListener("click",e=>{
      e.stopPropagation();
      const m=b.parentElement, was=m.classList.contains("open");
      document.querySelectorAll(".pMenu").forEach(x=>x.classList.remove("open"));
      if(!was) m.classList.add("open");
    });

      if(document.querySelector(".pMenu.open")){
        document.querySelectorAll(".pMenu").forEach(x=>x.classList.remove("open"));
        b.parentElement.classList.add("open");

    });

/* Tastenkürzel */
document.addEventListener("keydown",e=>{
  const typing=["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName);
  if(e.key==="Escape"){
    if($("popupMenu")){ popupSchliessen(); return; }
    const lb=document.querySelector(".lightbox");
    const vo=document.querySelector(".videoOverlay");
    if(lb) lb.remove();
    else if(vo) vo.querySelector("button").click();
    else if($("wizardOverlay")) $("wizardOverlay").remove();
    else if($("detailOverlay")) closeDetail();
    else if($("formOverlay").classList.contains("show")) closeForm();
    else if(mmConnectFrom){ mmConnectFrom=null; mmRerender(); }
    else if(state.pro&&selection.size){ selection.clear(); renderPro(); }
    return;
  }
  const strg=e.ctrlKey||e.metaKey, k=(e.key||"").toLowerCase();
  if(strg&&k==="k"){
    e.preventDefault();
    const box=state.pro?$("pSearch"):$("sSearch");
    box.focus(); box.select();
    return;
  }
  /* Dateibefehle gelten überall, auch während man in einem Feld tippt. */
  if(strg&&k==="s"){ e.preventDefault(); speichereJetzt(e.shiftKey); return; }
  if(strg&&k==="o"){ e.preventDefault(); projektOeffnen(); return; }
  if(strg&&k==="n"&&!e.shiftKey){ e.preventDefault(); projektNeu(); return; }
  if(strg&&k==="z"&&!e.shiftKey){ if(typing) return; e.preventDefault(); rueckgaengig(); return; }
  if(strg&&(k==="y"||(k==="z"&&e.shiftKey))){ if(typing) return; e.preventDefault(); wiederherstellen(); return; }
  if($("formOverlay").classList.contains("show")){ if(e.key==="Enter"&&e.ctrlKey) saveForm(); return; }
  if(typing) return;
  if((e.key==="n"||e.key==="N")&&!strg){ e.preventDefault(); openForm(); }
  else if(state.pro){
    if(e.key==="Delete") deleteSelected();
    else if(e.key==="F2") editSelected();
    else if((e.ctrlKey||e.metaKey)&&e.key==="a"){ e.preventDefault(); selectAllRows(); }
    else if((e.ctrlKey||e.metaKey)&&e.key==="e"){ e.preventDefault(); exportJSON(); }
    else if(e.key>="1"&&e.key<="9"&&WS_REITER[+e.key-1]) setWs(WS_REITER[+e.key-1][0]);
  }
});

let attachTarget=null, attachAusFormular=false;
/* Dateiendungen, aus denen sich eine Wortzahl gewinnen lässt */
const MANUSKRIPT_ENDUNGEN = ["docx","odt","rtf","txt","md"];
const endungVon = name => String(name||"").split(".").pop().toLowerCase();
const istManuskript = f => f && f.type==="file" && MANUSKRIPT_ENDUNGEN.includes(endungVon(f.name));

function fileIcon(mime, name){
  const e=endungVon(name);
  if(["doc","docx","dot","dotx","odt","rtf"].includes(e)) return "📝";
  if(["xls","xlsx","csv","ods"].includes(e)) return "📊";
  if(["ppt","pptx","odp"].includes(e)) return "📽️";
  if(["txt","md"].includes(e)) return "📃";
  if(!mime) return "📎";
  if(mime.startsWith("video/")) return "🎬";
  if(mime.startsWith("audio/")) return "🎵";
  if(mime.startsWith("image/")) return "🖼️";
  if(mime.includes("pdf")) return "📕";
  if(mime.includes("word")||mime.includes("opendocument.text")) return "📝";
  if(mime.includes("sheet")||mime.includes("excel")) return "📊";
  if(mime.includes("presentation")||mime.includes("powerpoint")) return "📽️";
  if(mime.includes("zip")||mime.includes("compressed")) return "🗜️";
  return "📎";
}
function attachFiles(itemId){ anhangCacheVerwerfen(); attachTarget=itemId; $("attachInput").click(); }
$("attachInput").addEventListener("change", e=>{
  const it=state.items.find(x=>x.id===attachTarget);
  const list=[...e.target.files];
  e.target.value="";
  if(!it||!list.length) return;
  it.files=it.files||[];
  let pending=list.length;
  const done=()=>{ if(--pending<=0){
    save();
    if(attachAusFormular){ attachAusFormular=false; openForm(it.id); }
    else openDetail(it.id);
    toast(tx("an.angehaengt", list.length));
  } };
  list.forEach(f=>{
    if(f.type.startsWith("image/")){
      shrinkImage(f, d=>{ it.files.push({id:uid(), name:f.name, type:"image", img:d}); done(); });
    } else {
      if(f.size>250*1024*1024){ toast(tx("an.zuGross", f.name)); done(); return; }
      const fid=uid();
      idbPut(fid, f).then(()=>{ it.files.push({id:fid, name:f.name, type:"file", mime:f.type||""}); done(); })
        .catch(()=>{ toast(tx("an.nichtGesp", f.name)); done(); });
    }
  });
});
function playBlob(blob, isAudio){
  const url=URL.createObjectURL(blob);
  const ov=document.createElement("div");
  ov.className="videoOverlay";
  ov.innerHTML=`<video src="${esc(safeMedia(url))}" controls autoplay ${isAudio?'style="height:60px;width:min(500px,90vw)"':""}></video><button>Schließen ✕</button>`;
  const close=()=>{ URL.revokeObjectURL(url); ov.remove(); };
  ov.querySelector("button").onclick=close;
  hintergrundKlick(ov, close);
  document.body.appendChild(ov);
}
function openAttachment(itemId, fileId){
  const it=state.items.find(x=>x.id===itemId); if(!it) return;
  const f=(it.files||[]).find(x=>x.id===fileId); if(!f) return;
  if(f.type==="image"){ zoomImg(f.img); return; }
  idbGet(f.id).then(blob=>{
    if(!blob){ toast(tx("an.dateiAnhWeg")); return; }
    if((f.mime||"").startsWith("video/")) playBlob(blob);
    else if((f.mime||"").startsWith("audio/")) playBlob(blob, true);
    else if(window.sluuw&&window.sluuw.anhang){
      /* In der Anwendung wird die Datei in einen Ordner unter dem
         Benutzerverzeichnis geschrieben und dem System übergeben –
         ein Word-Dokument öffnet sich damit in Word. */
      blobZuBase64(blob).then(async b64=>{
        const r=await window.sluuw.anhang.oeffnen(f.name||"anhang", b64);
        if(r&&r.ok) toast(tx("an.geoeffnet", f.name||tx("an.datei")));
        else await dlgInfo(tx("an.oeffnenNicht"), (r&&r.fehler)||tx("an.keinProgramm"));
      }).catch(()=>toast(tx("an.nichtGeoeffnet")));
    }
    else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=f.name||"datei"; a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 800);
      toast(tx("an.heruntergeladen", f.name||tx("an.datei")));
    }
  }).catch(()=>toast(tx("an.nichtGeladen")));
}
/* Nur der Datenteil, ohne den "data:...;base64,"-Kopf */
function blobZuBase64(blob){
  return blobToDataURL(blob).then(d=>String(d).slice(String(d).indexOf(",")+1));
}

function anhangImOrdner(itemId, fileId){
  const it=state.items.find(x=>x.id===itemId); if(!it) return;
  const f=(it.files||[]).find(x=>x.id===fileId); if(!f) return;
  idbGet(f.id).then(blobZuBase64).then(b64=>window.sluuw.anhang.imOrdnerZeigen(f.name||"anhang", b64))
    .catch(()=>toast(tx("an.nichtBereit")));
}

/* Wortzahl aus einem angehängten Manuskript in das Kapitel oder die Folge
   übernehmen. Der Anhang bleibt dabei in der Projektdatei – es wird nur
   gezählt, nichts verschoben. */
async function anhangWortzahl(itemId, fileId){
  const it=state.items.find(x=>x.id===itemId); if(!it) return;
  const f=(it.files||[]).find(x=>x.id===fileId); if(!f) return;
  if(!window.sluuw||!window.sluuw.anhang){
    await dlgInfo(tx("an.nichtVerfueg"), tx("an.nurAnwendung"));
    return;
  }
  let r=null;
  try{
    const blob=await idbGet(f.id);
    if(!blob){ toast(tx("an.nichtGefunden")); return; }
    r=await window.sluuw.anhang.wortzahl(f.name, await blobZuBase64(blob));
  }catch(e){ r={ok:false, fehler:e.message}; }
  if(!r||!r.ok){ await dlgInfo(tx("an.nichtLesbar"),(r&&r.fehler)||tx("an.nichtAusgew")); return; }

  const alt=+it.words||0;
  const abschnitte=r.sections.length;
  const ok=await dlgFrage(tx("an.wortzahlTitel"),
    tx("an.wortzahlFrage", f.name, zahl(r.total)+(abschnitte>1?tx("an.inAbschnitten", abschnitte):""), itemName(it), zahl(alt)),
    tx("an.aufSetzen", zahl(r.total)));
  if(!ok) return;
  it.words=r.total; touch(it.id);
  suchIndexLeeren(); save(); renderAll(); openDetail(itemId);
  toast(tx("an.wortAktualisiert", zahl(totalWords())));
}

async function delAttachment(itemId, fileId){
  const it0=state.items.find(x=>x.id===itemId); if(!it0) return;
  const f0=(it0.files||[]).find(x=>x.id===fileId);
  if(f0 && !await loeschenBestaetigt(f0.name||tx("an.datei"))) return;
  anhangCacheVerwerfen();
  const it=state.items.find(x=>x.id===itemId); if(!it) return;
  const f=(it.files||[]).find(x=>x.id===fileId);
  it.files=(it.files||[]).filter(x=>x.id!==fileId);
  if(f&&f.type==="file") idbDel(f.id);
  save(); openDetail(itemId);
}
function cleanupItemFiles(it){
  anhangCacheVerwerfen(); (it.files||[]).forEach(f=>{ if(f.type==="file") idbDel(f.id); }); }
function attachSection(it){
  const files=it.files||[];
  const imgs=files.filter(f=>f.type==="image"), others=files.filter(f=>f.type!=="image");
  return `<div class="dSection"><h4>📎 ${esc(tx("an.titel", files.length))}
      <button class="btn small" onclick="attachFiles('${it.id}')" style="margin-left:8px">＋ ${esc(tx("btn.dateiAnhaengen"))}</button></h4>
    ${imgs.length?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      ${imgs.map(f=>`<div style="position:relative">
        <img src="${esc(safeSrc(f.img))}" style="width:96px;height:96px;object-fit:cover;border-radius:10px;cursor:zoom-in" onclick="zoomImg(this.src)" title="${esc(f.name)}">
        <button style="position:absolute;top:-6px;right:-6px;border:none;background:var(--bad);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer" onclick="delAttachment('${it.id}','${f.id}')" title="Entfernen">✕</button>
      </div>`).join("")}</div>`:""}
    ${others.length?`<div class="anhangListe">${others.map(f=>{
      const medien=(f.mime||"").startsWith("video/")||(f.mime||"").startsWith("audio/");
      const wort=istManuskript(f)&&["kapitel","folge"].includes(it.kind);
      return `<div class="anhangZeile">
        <button class="anhangName" onclick="openAttachment('${it.id}','${f.id}')"
          title="${esc(medien?tx("an.abspielen"):tx("an.imProgramm"))}">
          <span class="ic">${fileIcon(f.mime, f.name)}</span><span class="nm">${esc(f.name)}</span></button>
        ${wort?`<button class="btn small" onclick="anhangWortzahl('${it.id}','${f.id}')"
          title="${esc(tx("btn.wortzahl"))}">${esc(tx("btn.wortzahl"))}</button>`:""}
        <button class="btn small" onclick="anhangImOrdner('${it.id}','${f.id}')" title="${esc(tx("btn.ordnerZeigen"))}">${esc(tx("btn.ordnerZeigen"))}</button>
        <button class="btn small" onclick="delAttachment('${it.id}','${f.id}')" title="${esc(tx("an.entfernen"))}">✕</button>
      </div>`;}).join("")}</div>`:""}
    ${!files.length?`<span style="font-size:12.5px;color:var(--text2)">${esc(tx("an.keineDateien"))}</span>`:""}
  </div>`;
}

function mmFocus(nodeId, mapId){
  closeDetail();
  if(mapId&&state.minds.some(m=>m.id===mapId)) state.activeMind=mapId;
  if(state.pro) setWs("mind");
  else { view="mind"; renderSimple(); }
  mmSel=nodeId;
  setTimeout(()=>{
    const svg=$("mmSvg"), n=state.mind.nodes.find(x=>x.id===nodeId);
    if(!svg||!n) return;
    const r=svg.getBoundingClientRect();
    mmView={x:r.width/2-n.x, y:r.height/2-n.y, z:1};
    mmRerender();
  }, 60);
}

/* ================= MINDMAP ================= */
let mmSel=null, mmDragId=null, mmDragOff={x:0,y:0}, mmPanStart=null, mmView={x:0,y:0,z:1}, mmConnectFrom=null, mmEl=null;
const KIND_COLORS={kapitel:"#b0713a", folge:"#c2570b", figur:"#3b6bcd", ort:"#3a8f8a", welt:"#4a7c59", beat:"#8a5a8f", ereignis:"#c98a1b", notiz:"#c0392b"};
function ensureMind(){
  if(!state.mind||!Array.isArray(state.mind.nodes)) state.mind={nodes:[],edges:[]};
  if(!state.mind.nodes.length){
    state.mind.nodes.push({id:uid(), x:430, y:250, text:state.book.title||"Mein Buch", color:"#b0713a"});
    state.mind.edges=[];
  }
}
function wrapText(t, max){
  max=max||24;
  const words=String(t).split(/\s+/).filter(Boolean), lines=[]; let cur="";
  words.forEach(w=>{
    while(w.length>max){ if(cur){lines.push(cur);cur="";} lines.push(w.slice(0,max)); w=w.slice(max); }
    if((cur+" "+w).trim().length>max && cur){ lines.push(cur); cur=w; } else cur=(cur?cur+" ":"")+w;
  });
  if(cur) lines.push(cur);
  if(!lines.length) lines.push(" ");
  return lines.length>14 ? lines.slice(0,14).concat(["…"]) : lines;
}
function nodeW(t){ return Math.max(76, String(t).length*8.2+30); }
function mmRerender(){ if(mmEl) renderMindInto(mmEl); }
function switchMind(id){ state.activeMind=id; mmSel=null; mmConnectFrom=null; mmView={x:0,y:0,z:1}; save(); mmRerender(); }
async function newMind(){
  const n=await dlgEingabe(tx("mm.neue"), tx("dlg.name"), tx("mm.neue"));
  if(!n) return;
  const m={id:uid(), name:n, nodes:[], edges:[]};
  state.minds.push(m); switchMind(m.id);
}
async function renameMind(){
  const m=curMind();
  const n=await dlgEingabe(tx("mm.umbenennenA"), tx("dlg.name"), m.name);
  if(n){ m.name=n; save(); mmRerender(); }
}
async function delMind(){
  if(state.minds.length<=1){ toast(tx("mm.letzte")); return; }
  const m=curMind();
  if(!await dlgFrage(tx("mm.loeschen"), tx("mm.loeschenFrage", m.name, m.nodes.length), tx("btn.loeschen"), true)) return;
  m.nodes.forEach(n=>{ if(n.video) idbDel(n.id); });
  state.minds=state.minds.filter(x=>x.id!==m.id);
  state.activeMind=state.minds[0].id;
  mmSel=null; save(); mmRerender();
}
function elementMind(itemId){
  const it=state.items.find(x=>x.id===itemId); if(!it){ toast(tx("dlg.eintragWeg")); return; }
  let m=state.minds.find(x=>x.scope===itemId);
  if(!m){
    m={id:uid(), name:KINDS[it.kind].icon+" "+itemName(it), scope:itemId,
      nodes:[{id:uid(), x:430, y:230, text:itemName(it), color:KIND_COLORS[it.kind]||"#b0713a", link:itemId, img:(it.images||[])[0]||undefined}],
      edges:[]};
    state.minds.push(m); save();
    toast(tx("mm.eigene", itemName(it)));
  }
  closeDetail();
  state.activeMind=m.id; mmSel=null; mmConnectFrom=null; mmView={x:0,y:0,z:1};
  if(state.pro) setWs("mind"); else { view="mind"; renderSimple(); }
}
function renderMindInto(el){
  ensureMind(); mmEl=el;
  const M=state.mind;
  const nodeById=id=>M.nodes.find(n=>n.id===id);
  const edges=M.edges.filter(([a,b])=>nodeById(a)&&nodeById(b));
  el.innerHTML=`<div class="mmToolbar">
    <select onchange="switchMind(this.value)" title="${esc(tx("mm.wechseln"))}">${state.minds.map(m=>`<option value="${m.id}" ${m.id===M.id?"selected":""}>🗂 ${esc(m.name)}</option>`).join("")}</select>
    <button class="btn small" onclick="newMind()" title="${esc(tx("mm.neueAnlegen"))}">＋ ${esc(tx("mm.map"))}</button>
    <button class="btn small" onclick="renameMind()" title="${esc(tx("mm.umbenennenA"))}">✏️ ${esc(tx("mm.map"))}</button>
    <button class="btn small" onclick="delMind()" title="${esc(tx("mm.aktiveLoeschen"))}">🗑️ ${esc(tx("mm.map"))}</button>
    <span style="border-left:1px solid var(--border);height:22px"></span>
    <button class="btn primary small" onclick="addMindNode()">＋ ${esc(tx("mm.knoten"))}</button>
    <button class="btn small" onclick="addMindNode(null,null,'text')">＋ ${esc(tx("mm.text"))}</button>
    <button class="btn small" onclick="addMindNode(null,null,'notiz')">＋ ${esc(tx("mm.notiz"))}</button>
    <button class="btn small" onclick="mmArtWechseln()" title="${esc(tx("mm.artWechseln"))}">◧</button>
    <button class="btn small ${mmConnectFrom?"primary":""}" onclick="startConnect()"
      aria-pressed="${!!mmConnectFrom}">🔗 ${esc(mmConnectFrom?tx("mm.zielAnklicken"):tx("mm.verbinden"))}</button>
    <button class="btn small" onclick="renameMindNode()">✏️ ${esc(tx("mm.umbenennenK"))}</button>
    <button class="btn small" onclick="mmPickImage()">🖼️ ${esc(tx("mm.bild"))}</button>
    <button class="btn small" onclick="mmPickVideo()">🎬 ${esc(tx("mm.video"))}</button>
    <button class="btn small" onclick="mmClearMedia()">✖ ${esc(tx("mm.medien"))}</button>
    <button class="btn small" onclick="delMindNode()">🗑️ ${esc(tx("btn.loeschen"))}</button>
    <input type="file" id="mmImgFile" accept="image/*" style="display:none">
    <input type="file" id="mmVidFile" accept="video/*" style="display:none">
    ${PL_COLORS.map(c=>`<button class="colorDot" style="background:${c}" title="${esc(tx("mm.farbe"))}" onclick="setNodeColor('${c}')"></button>`).join("")}
    <select onchange="addStoryNode(this)"><option value="">${esc(tx("mm.ausStory"))}</option>
      ${Object.entries(KINDS).map(([k,K])=>{ const its=byKind(k); return its.length?`<optgroup label="${K.icon} ${K.plural}">${its.map(i=>`<option value="${i.id}">${esc(itemName(i))}</option>`).join("")}</optgroup>`:""; }).join("")}</select>
    <span style="margin-left:auto;display:flex;gap:4px">
      <button class="btn small" onclick="mmZoom(1.2)">➕</button>
      <button class="btn small" onclick="mmZoom(1/1.2)">➖</button>
      <button class="btn small" onclick="mmView={x:0,y:0,z:1};mmApplyView()" title="${esc(tx("mm.ansichtZurueck"))}">⌂</button></span></div>
  <div class="mmWrap"><svg id="mmSvg">
    <g id="mmRoot" transform="translate(${mmView.x},${mmView.y}) scale(${mmView.z})">
      ${edges.map(([a,b])=>{ const na=nodeById(a), nb=nodeById(b);
        return `<line class="mmEdge" data-a="${a}" data-b="${b}" x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}"/>`; }).join("")}
      ${M.nodes.map(n=>{
        /* Drei Darstellungen aus denselben Daten:
           knoten – gefüllte Kachel wie bisher, für Begriffe und Verweise
           text   – nur Schrift, ohne Rahmen; zum Beschriften von Bereichen
           notiz  – Zettel mit heller Fläche für längere Gedanken
           Die Art steht am Knoten, nicht in einer zweiten Liste. */
        const art=n.typ||"knoten";
        const breite=art==="notiz"?26:(art==="text"?34:22);
        const lines=wrapText(n.text, breite);
        const zeile=art==="text"?21:17;
        const tW=Math.max(art==="notiz"?150:76, Math.max(...lines.map(l=>l.length))*(art==="text"?9.6:8.2)+30);
        const textH=lines.length*zeile;
        const hasImg=!!n.img;
        const W=hasImg?Math.max(tW,170):tW;
        const H=hasImg?(102+textH+16):(textH+(art==="notiz"?30:21));
        const Y=-H/2;
        const firstY=hasImg ? Y+94+24 : -((lines.length-1)*zeile)/2+(art==="text"?7:5);
        const farbe=safeColor(n.color||"#b0713a");
        const rahmen =
          art==="text"  ? "" :
          art==="notiz" ? `<rect x="${-W/2}" y="${Y}" width="${W}" height="${H}" rx="4"
                             fill="${esc(farbe)}" fill-opacity="0.16" stroke="${esc(farbe)}" stroke-width="1.5"/>`
                        : `<rect x="${-W/2}" y="${Y}" width="${W}" height="${H}" rx="12" fill="${esc(farbe)}"/>`;
        const textKlasse = art==="knoten" ? "" : ` class="mmTxt ${art}"`;
        const textFarbe  = art==="knoten" ? "" : ` fill="${esc(farbe)}"`;
        return `<g class="mmNode n-${art} ${mmSel===n.id?"sel":""}" data-id="${n.id}" data-typ="${art}" transform="translate(${n.x},${n.y})">
        ${rahmen}
        ${hasImg?`<image class="mmBild" data-bild="${n.id}" href="${esc(safeSrc(n.img))}" x="${-W/2+8}" y="${Y+8}" width="${W-16}" height="86" preserveAspectRatio="xMidYMid slice"/>`:""}
        <text${textKlasse}${textFarbe} text-anchor="middle" y="${firstY}" font-size="${art==="text"?16:13}">${lines.map((l,i)=>`<tspan x="0" dy="${i===0?0:zeile}">${esc(l)}</tspan>`).join("")}</text>
        ${n.video?`<g class="mmPlay" data-vid="${n.id}" transform="translate(${W/2-4},${Y+4})"><circle r="13"/><text text-anchor="middle" y="4.5">▶</text></g>`:""}</g>`;
      }).join("")}
    </g></svg>
    <div class="mmHint">${esc(tx("mm.hinweis2"))}</div></div>`;
  const iF=$("mmImgFile"), vF=$("mmVidFile");
  iF.addEventListener("change", ()=>mmSetImage(iF.files[0]));
  vF.addEventListener("change", ()=>mmSetVideo(vF.files[0]));
  const svg=$("mmSvg");
  svg.addEventListener("pointerdown", mmDown);
  svg.addEventListener("pointermove", mmMove);
  svg.addEventListener("pointerup", mmUp);
  svg.addEventListener("pointerleave", mmUp);
  svg.addEventListener("dblclick", e=>{
    const nd=e.target.closest(".mmNode"); if(!nd) return;
    const node=state.mind.nodes.find(n=>n.id===nd.dataset.id);
    if(!node) return;
    /* Auf dem Bild oder dem Abspielknopf geht es um das Medium, sonst
       um den Knoten. Vorher öffnete jeder Doppelklick die Detailseite –
       das Bild ließ sich gar nicht groß ansehen. */
    if(e.target.closest(".mmBild")){ zoomImg(safeSrc(node.img)); return; }
    if(e.target.closest(".mmPlay")){ openVideo(node.id); return; }
    if(node.link && state.items.some(i=>i.id===node.link)) openDetail(node.link);
    else renameMindNode(node.id);
  });
  svg.addEventListener("wheel", e=>{
    e.preventDefault();
    const rect=svg.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    const wx=(px-mmView.x)/mmView.z, wy=(py-mmView.y)/mmView.z;
    const z2=Math.min(2.5, Math.max(0.3, mmView.z*(e.deltaY<0?1.12:1/1.12)));
    mmView.x=px-wx*z2; mmView.y=py-wy*z2; mmView.z=z2; mmApplyView();
  }, {passive:false});
}
function mmApplyView(){ const g=$("mmRoot"); if(g) g.setAttribute("transform",`translate(${mmView.x},${mmView.y}) scale(${mmView.z})`); }
function mmZoom(f){ mmView.z=Math.min(2.5,Math.max(0.3,mmView.z*f)); mmApplyView(); }
function mmWorld(e){
  const rect=$("mmSvg").getBoundingClientRect();
  return {x:(e.clientX-rect.left-mmView.x)/mmView.z, y:(e.clientY-rect.top-mmView.y)/mmView.z};
}
function mmDown(e){
  const play=e.target.closest(".mmPlay");
  if(play){ openVideo(play.dataset.vid); return; }
  const nd=e.target.closest(".mmNode");
  if(nd){
    const id=nd.dataset.id;
    if(mmConnectFrom&&mmConnectFrom!==id){
      /* Der Modus bleibt an: wer eine Verbindung zieht, zieht meist
         gleich mehrere. Der angeklickte Knoten wird zum neuen
         Ausgangspunkt – so entstehen Ketten mit je einem Klick.
         Beendet wird über den Knopf oder mit Esc. */
      toggleMindEdge(mmConnectFrom,id);
      mmConnectFrom=id; mmSel=id;
      save(); mmRerender(); return;
    }
    mmSel=id;
    document.querySelectorAll(".mmNode").forEach(n=>n.classList.toggle("sel",n.dataset.id===id));
    const node=state.mind.nodes.find(n=>n.id===id), p=mmWorld(e);
    mmDragId=id; mmDragOff={x:p.x-node.x, y:p.y-node.y};
  } else {
    mmPanStart={x:e.clientX-mmView.x, y:e.clientY-mmView.y};
    $("mmSvg").classList.add("panning");
  }
}
function mmMove(e){
  if(mmDragId){
    const node=state.mind.nodes.find(n=>n.id===mmDragId); if(!node) return;
    const p=mmWorld(e);
    node.x=Math.round(p.x-mmDragOff.x); node.y=Math.round(p.y-mmDragOff.y);
    const g=document.querySelector(`.mmNode[data-id="${mmDragId}"]`);
    if(g) g.setAttribute("transform",`translate(${node.x},${node.y})`);
    document.querySelectorAll(`line[data-a="${mmDragId}"]`).forEach(l=>{ l.setAttribute("x1",node.x); l.setAttribute("y1",node.y); });
    document.querySelectorAll(`line[data-b="${mmDragId}"]`).forEach(l=>{ l.setAttribute("x2",node.x); l.setAttribute("y2",node.y); });
  } else if(mmPanStart){
    mmView.x=e.clientX-mmPanStart.x; mmView.y=e.clientY-mmPanStart.y; mmApplyView();
  }
}
function mmUp(){
  if(mmDragId) save();
  mmDragId=null; mmPanStart=null;
  const s=$("mmSvg"); if(s) s.classList.remove("panning");
}
const MM_ARTEN=["knoten","text","notiz"];
function addMindNode(text, color, typ){
  ensureMind();
  const art=MM_ARTEN.includes(typ)?typ:"knoten";
  const base=state.mind.nodes.find(n=>n.id===mmSel)||state.mind.nodes[0]||{x:400,y:260};
  const n={id:uid(), x:base.x+180+Math.round(Math.random()*40-20), y:base.y+Math.round(Math.random()*180-90),
    text:text||(art==="notiz"?tx("mm.neueNotiz"):art==="text"?tx("mm.neuerText"):tx("mm.neueIdee")),
    color:color||PL_COLORS[state.mind.nodes.length%PL_COLORS.length]};
  if(art!=="knoten") n.typ=art;
  state.mind.nodes.push(n);
  /* Freie Texte und Zettel hängen an nichts – sie sollen dort liegen,
     wo man sie hinlegt, nicht an einem Ast baumeln. */
  if(art==="knoten" && base.id) state.mind.edges.push([base.id, n.id]);
  mmSel=n.id; save(); mmRerender();
  if(!text) renameMindNode(n.id);
}
/* Dieselben Daten anders zeigen: Kachel → Text → Zettel → Kachel. */
function mmArtWechseln(){
  const n=state.mind.nodes.find(x=>x.id===mmSel);
  if(!n){ toast(tx("mm.knotenWaehlen")); return; }
  const i=MM_ARTEN.indexOf(n.typ||"knoten");
  const neu=MM_ARTEN[(i+1)%MM_ARTEN.length];
  if(neu==="knoten") delete n.typ; else n.typ=neu;
  save(); mmRerender();
}
/* Ein Umschalter: einmal an, bleibt an, bis er wieder gedrückt wird. */
function startConnect(){
  if(mmConnectFrom){ mmConnectFrom=null; mmRerender(); toast(tx("mm.verbindenAus")); return; }
  if(!mmSel){ toast(tx("mm.verbindenHilfe")); return; }
  mmConnectFrom=mmSel; mmRerender();
  toast(tx("mm.zielKlicken"));
}
function toggleMindEdge(a,b){
  const i=state.mind.edges.findIndex(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a));
  if(i>=0) state.mind.edges.splice(i,1); else state.mind.edges.push([a,b]);
}
async function renameMindNode(id){
  id=id||mmSel;
  const n=state.mind.nodes.find(x=>x.id===id);
  if(!n){ toast(tx("mm.keinKnoten")); return; }
  const t=await dlgEingabe(tx("mm.knotenText"), tx("dlg.text"), n.text);
  if(t){ n.text=t; save(); mmRerender(); }
}
async function delMindNode(){
  if(!mmSel){ toast(tx("mm.keinKnoten")); return; }
  const n=state.mind.nodes.find(x=>x.id===mmSel);
  if(n && !await loeschenBestaetigt(n.text||tx("mm.knoten"))) return;
  idbDel(mmSel);
  state.mind.nodes=state.mind.nodes.filter(n=>n.id!==mmSel);
  state.mind.edges=state.mind.edges.filter(([a,b])=>a!==mmSel&&b!==mmSel);
  mmSel=null; mmConnectFrom=null; save(); mmRerender();
}
function setNodeColor(c){
  const n=state.mind.nodes.find(x=>x.id===mmSel);
  if(!n){ toast(tx("mm.knotenWaehlen")); return; }
  n.color=c; save(); mmRerender();
}
function addStoryNode(sel){
  const it=state.items.find(x=>x.id===sel.value);
  sel.value="";
  if(!it) return;
  addMindNode(KINDS[it.kind].icon+" "+itemName(it), KIND_COLORS[it.kind]);
  const n=state.mind.nodes.find(x=>x.id===mmSel);
  if(n){ n.link=it.id; const cv=(it.images||[])[0]; if(cv) n.img=cv; save(); mmRerender(); }
  toast(tx("mm.tippDetail", itemName(it)));
}

/* --- Mindmap-Medien (Bilder im Knoten, Videos über IndexedDB) --- */
let _mdb=null;
function idb(){
  return new Promise((res,rej)=>{
    if(_mdb) return res(_mdb);
    if(!window.indexedDB){ rej(new Error(tx("al.indexedDB"))); return; }
    /* Der Name der Datenbank bleibt bewusst der alte: darin liegen
       Anhänge und Videos bereits vorhandener Projekte. Ein neuer Name
       hieße, dass sie unsichtbar werden – Umbenennen ist das nicht wert. */
    const r=indexedDB.open("storyplaner-media",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("media");
    r.onsuccess=()=>{ _mdb=r.result; res(_mdb); };
    r.onerror=()=>rej(r.error);
  });
}
function idbPut(k,v){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction("media","readwrite"); t.objectStore("media").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); })); }
function idbGet(k){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction("media"); const q=t.objectStore("media").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); })); }
function idbDel(k){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction("media","readwrite"); t.objectStore("media").delete(k); t.oncomplete=res; t.onerror=()=>rej(t.error); })).catch(()=>{}); }
function idbClear(){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction("media","readwrite"); t.objectStore("media").clear(); t.oncomplete=res; t.onerror=()=>rej(t.error); })).catch(()=>{}); }
function mmNodeSel(){
  const n=state.mind.nodes.find(x=>x.id===mmSel);
  if(!n) toast(tx("mm.knotenAnklicken"));
  return n;
}
function mmPickImage(){ if(mmNodeSel()) $("mmImgFile").click(); }
function mmPickVideo(){ if(mmNodeSel()) $("mmVidFile").click(); }
function mmSetImage(file){
  const n=mmNodeSel(); if(!n||!file) return;
  shrinkImage(file, d=>{ n.img=d; save(); mmRerender(); toast(tx("mm.bildAngehaengt")); }, 480);
}
function mmSetVideo(file){
  const n=mmNodeSel(); if(!n||!file) return;
  if(file.size>250*1024*1024){ toast(tx("mm.videoGross")); return; }
  idbPut(n.id, file).then(()=>{
    n.video=file.name||true; save(); mmRerender();
    toast(tx("mm.videoAngeh"));
  }).catch(()=>toast(tx("mm.videoFehlerB")));
}
function mmClearMedia(){
  const n=mmNodeSel(); if(!n) return;
  if(!n.img&&!n.video){ toast(tx("mm.keineMedien")); return; }
  delete n.img;
  if(n.video){ idbDel(n.id); delete n.video; }
  save(); mmRerender(); toast("Medien entfernt.");
}
function openVideo(id){
  idbGet(id).then(blob=>{
    if(!blob){ toast(tx("mm.videoWegLang")); return; }
    const url=URL.createObjectURL(blob);
    const ov=document.createElement("div");
    ov.className="videoOverlay";
    ov.innerHTML=`<video src="${esc(safeMedia(url))}" controls autoplay></video><button>Schließen ✕</button>`;
    const close=()=>{ URL.revokeObjectURL(url); ov.remove(); };
    ov.querySelector("button").onclick=close;
    hintergrundKlick(ov, close);
    document.body.appendChild(ov);
  }).catch(()=>toast(tx("mm.videoLaden")));
}

/* ============================================================
   RUNDGANG
   Ein Scheinwerfer legt sich über die Oberfläche und lässt genau
   ein Element frei; daneben steht eine Sprechblase mit Erklärung.

   Drei Dinge, an denen solche Führungen üblicherweise scheitern
   und die deshalb hier gelöst sind:

   1. Ziele werden über data-tour angesprochen, nicht über Klassen
      oder ids. Klassen ändern sich beim Umbauen, das Attribut ist
      eine ausdrückliche Zusage zwischen Oberfläche und Rundgang.
   2. Der Scheinwerfer ist ein Kasten mit einem sehr großen Schatten
      ringsum. Dadurch bleibt das Loch in der Mitte durchsichtig UND
      anklickbar – eine volle Überdeckung würde das Element sperren.
   3. Bedienbarkeit ohne Maus: Pfeiltasten blättern, Esc beendet,
      der Fokus wandert in die Sprechblase, und eine stille Zeile
      meldet Vorlesesoftware jeden Schritt.
   ============================================================ */
const TOUR_STAND = "1";        /* hochzählen, wenn alle den Rundgang neu sehen sollen */

/* Ein Schritt: Ziel, Überschrift, Text – und optional, was vorher
   eingestellt sein muss, damit das Ziel überhaupt sichtbar ist. */
const TOUR_EINFACH = [
  {ziel:null,               t:"tour.e1.t", x:"tour.e1.x"},
  {ziel:"projekt",          t:"tour.e2.t", x:"tour.e2.x"},
  {ziel:"nav",              t:"tour.e3.t", x:"tour.e3.x"},
  {ziel:"neu",              t:"tour.e4.t", x:"tour.e4.x"},
  {ziel:"fuss",             t:"tour.e5.t", x:"tour.e5.x"}
];
const TOUR_PROFI = [
  {ziel:null,               t:"tour.p1.t", x:"tour.p1.x"},
  {ziel:"menue0",           t:"tour.p2.t", x:"tour.p2.x"},
  {ziel:"menue1",           t:"tour.p3.t", x:"tour.p3.x"},
  {ziel:"menue2",           t:"tour.p4.t", x:"tour.p4.x"},
  {ziel:"menue3",           t:"tour.p5.t", x:"tour.p5.x"},
  {ziel:"ws-table",         t:"tour.p6.t", x:"tour.p6.x", ws:"table"},
  {ziel:"ws-ordner",        t:"tour.p7.t", x:"tour.p7.x", ws:"ordner"},
  {ziel:"ws-beat",          t:"tour.p8.t", x:"tour.p8.x", ws:"beat"},
  {ziel:"sammlungen",       t:"tour.p9.t", x:"tour.p9.x", ws:"table"}
];

let tourSchritte=null, tourNr=0, tourVorher=null;

function tourLaeuft(){ return !!tourSchritte; }
function tourZiel(name){
  return name ? document.querySelector('[data-tour="'+name+'"]') : null;
}

function tourStart(welche){
  const profi = welche==="profi" || (welche===undefined && state.pro);
  tourSchritte = profi ? TOUR_PROFI : TOUR_EINFACH;
  tourNr = 0;
  tourVorher = {pro:state.pro, ws:ws, view:view};
  /* Der Rundgang zeigt, was er beschreibt: für den Profi-Rundgang
     wird in den Profi-Modus gewechselt, für den einfachen zurück. */
  if(profi !== state.pro) setPro(profi);
  tourZeichnen();
  document.addEventListener("keydown", tourTaste, true);
  window.addEventListener("resize", tourNachfuehren);
}
function tourEnde(gemerkt){
  document.removeEventListener("keydown", tourTaste, true);
  window.removeEventListener("resize", tourNachfuehren);
  const f=$("tourFolie"); if(f) f.remove();
  const fertig = tourSchritte && tourNr>=tourSchritte.length-1;
  tourSchritte=null;
  try{ localStorage.setItem("sluuw.tour", TOUR_STAND); }catch(e){}
  if(tourVorher && !gemerkt){ ws=tourVorher.ws; view=tourVorher.view; }
  tourVorher=null;
  renderAll();
  if(fertig) toast(tx("tour.abgeschlossen"));
}
function tourWeiter(d){
  if(!tourSchritte) return;
  const n=tourNr+d;
  if(n<0) return;
  if(n>=tourSchritte.length){ tourEnde(true); return; }
  tourNr=n; tourZeichnen();
}
function tourTaste(e){
  if(!tourSchritte) return;
  if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); tourEnde(); return; }
  if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){ e.preventDefault(); e.stopPropagation(); tourWeiter(1); return; }
  if(e.key==="ArrowLeft"){ e.preventDefault(); e.stopPropagation(); tourWeiter(-1); return; }
  /* Alles andere bleibt liegen: der Rundgang soll die Oberfläche
     nicht bedienen, während er sie erklärt. */
  if(e.key!=="Tab"){ e.preventDefault(); e.stopPropagation(); }
}

function tourZeichnen(){
  const s=tourSchritte[tourNr];
  if(s.ws && ws!==s.ws){ ws=s.ws; if(state.pro) renderPro(); }

  let f=$("tourFolie");
  if(!f){
    f=document.createElement("div");
    f.id="tourFolie"; f.className="tourFolie";
    f.innerHTML=`<div class="tourLoch" id="tourLoch"></div>
      <div class="tourBlase" id="tourBlase" role="dialog" aria-modal="true"
           aria-labelledby="tourTitel" aria-describedby="tourText" tabindex="-1">
        <div class="tbKopf">
          <span class="tbZaehler" id="tourZaehler"></span>
          <button class="tbX" onclick="tourEnde()" id="tourX"></button>
        </div>
        <h3 id="tourTitel"></h3>
        <p id="tourText"></p>
        <div class="tbBalken"><div id="tourBalken"></div></div>
        <div class="tbFuss">
          <button class="btn small" id="tourUeber" onclick="tourEnde()"></button>
          <span style="flex:1"></span>
          <button class="btn small" id="tourZurueck" onclick="tourWeiter(-1)"></button>
          <button class="btn primary small" id="tourVor" onclick="tourWeiter(1)"></button>
        </div>
      </div>
      <p class="tourStill" id="tourStill" role="status" aria-live="polite"></p>`;
    document.body.appendChild(f);
  }
  const n=tourSchritte.length, ist=tourNr+1;
  $("tourTitel").textContent=tx(s.t);
  $("tourText").textContent=tx(s.x);
  $("tourZaehler").textContent=tx("tour.schritt", ist, n);
  $("tourBalken").style.width=Math.round(ist/n*100)+"%";
  $("tourX").setAttribute("aria-label", tx("tour.beenden"));
  $("tourX").textContent="✕";
  $("tourUeber").textContent=tx("tour.ueberspringen");
  $("tourZurueck").textContent=tx("tour.zurueck");
  $("tourZurueck").style.visibility = tourNr?"visible":"hidden";
  $("tourVor").textContent = ist===n ? tx("tour.fertig") : tx("tour.weiter");
  $("tourStill").textContent=tx("tour.schritt", ist, n)+": "+tx(s.t);
  tourNachfuehren();
  const blase=$("tourBlase"); if(blase&&blase.focus) blase.focus();
}

/* Setzt Scheinwerfer und Sprechblase an die Stelle des Ziels. Läuft
   auch bei jeder Größenänderung, damit nichts verrutscht. */
function tourNachfuehren(){
  if(!tourSchritte) return;
  const loch=$("tourLoch"), blase=$("tourBlase");
  if(!loch||!blase) return;
  const s=tourSchritte[tourNr];
  const el=tourZiel(s.ziel);
  const bb = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;

  if(!bb || (!bb.width && !bb.height)){
    /* Ohne Ziel: die Sprechblase steht in der Mitte, ohne Scheinwerfer. */
    loch.style.display="none";
    blase.style.left="50%"; blase.style.top="50%";
    blase.style.transform="translate(-50%,-50%)";
    return;
  }
  const luft=8;
  loch.style.display="block";
  loch.style.left=(bb.left-luft)+"px";
  loch.style.top=(bb.top-luft)+"px";
  loch.style.width=(bb.width+luft*2)+"px";
  loch.style.height=(bb.height+luft*2)+"px";

  /* Die Sprechblase sucht sich die Seite mit dem meisten Platz und
     bleibt dabei im Fenster – sonst steht sie halb außerhalb. */
  const bw=Math.min(360, (window.innerWidth||1280)-32), bh=blase.offsetHeight||210;
  const W=window.innerWidth||1280, H=window.innerHeight||800;
  let l, t;
  if(bb.right+bw+24 < W){ l=bb.right+18; t=bb.top; }
  else if(bb.left-bw-24 > 0){ l=bb.left-bw-18; t=bb.top; }
  else if(bb.bottom+bh+24 < H){ l=bb.left; t=bb.bottom+18; }
  else { l=bb.left; t=Math.max(12, bb.top-bh-18); }
  blase.style.transform="none";
  blase.style.width=bw+"px";
  blase.style.left=Math.max(12, Math.min(l, W-bw-12))+"px";
  blase.style.top=Math.max(12, Math.min(t, H-bh-12))+"px";
}

/* Beim ersten Start von allein – danach nur noch über das Hilfe-Menü. */
function tourVielleicht(){
  let gesehen=null;
  try{ gesehen=localStorage.getItem("sluuw.tour"); }catch(e){}
  if(gesehen===TOUR_STAND) return;
  setTimeout(()=>{ if(!tourLaeuft()) tourStart(); }, 600);
}

/* ================= INIT ================= */
hintergrundKlick($("optsOverlay"), closeOpts);
/* Erst die Sprache, dann zeichnen: sonst entsteht das erste Bild in der
   Vorgabesprache und wird sofort wieder überschrieben – und die
   Profi-Menüleiste gäbe es beim ersten Zeichnen noch gar nicht. */
einstellungenLaden();
applyTheme();
renderAll();
tourVielleicht();
renderSaveBanner();
renderTitlebar();

/* Doppelklick auf die Titelleiste maximiert, wie im Betriebssystem gewohnt */
document.querySelector(".titlebar").addEventListener("dblclick", e=>{ if(!e.target.closest("button")) winMax(); });
window.addEventListener("resize", popupSchliessen);

/* ---------- Datei auf das Fenster ziehen ----------
   Ein .story-Projekt wird geöffnet, alles andere landet in der
   Einlese-Vorschau. Ohne preventDefault würde der Browser die Datei
   selbst anzeigen und die Anwendung verlassen – das wäre der Verlust
   aller ungesicherten Änderungen. */
let zieheTiefe=0;
function ablegeflaeche(an){
  let f=$("dropZone");
  if(an && !f){
    f=document.createElement("div");
    f.id="dropZone"; f.className="dropZone";
    f.innerHTML=`<div class="dzInner"><div class="dzIcon">⬇</div>
      <div class="dzTitel">${esc(tx("imp.ablegen"))}</div>
      <div class="dzSub">${esc(tx("imp.ablegenSub"))}</div></div>`;
    document.body.appendChild(f);
  }
  if(!an && f) f.remove();
}
window.addEventListener("dragenter", e=>{
  if(!(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))) return;
  e.preventDefault(); zieheTiefe++; ablegeflaeche(true);
});
window.addEventListener("dragover", e=>{
  if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")) e.preventDefault();
});
window.addEventListener("dragleave", e=>{
  if(!(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))) return;
  zieheTiefe=Math.max(0, zieheTiefe-1);
  if(!zieheTiefe) ablegeflaeche(false);
});
window.addEventListener("drop", async e=>{
  const dateien=e.dataTransfer&&e.dataTransfer.files;
  if(!dateien||!dateien.length) return;
  e.preventDefault(); zieheTiefe=0; ablegeflaeche(false);
  if(dateien.length>1) toast(tx("imp.nurEine"));
  await dateiAblegen(dateien[0]);
});

/* Getrennt, damit die Testreihe den Ablauf ohne echtes Ereignis prüfen kann. */
async function dateiAblegen(f){
  if(!f) return;
  const name=f.name||"", endung=(name.match(/\.([^.]+)$/)||[])[1]||"";
  /* Ein Projekt wird geöffnet, nicht eingelesen: der Pfad liegt in der
     Anwendung vor, im Browser gäbe es ihn nicht. */
  if(endung.toLowerCase()==="story"){
    if(DATEI&&DATEI.oeffnen&&f.path) await projektOeffnen(f.path);
    else await dlgInfo(tx("an.nichtVerfueg"), tx("sp.nurAnwendung"));
    return;
  }
  if(DATEI&&DATEI.importLesen&&f.path){ await importDatei(f.path); return; }
  /* Ohne Pfad – etwa im Browser – hilft der Inhalt weiter. */
  try{
    const text=await new Promise((res,rej)=>{
      const r=new FileReader(); r.onload=()=>res(String(r.result)); r.onerror=rej; r.readAsText(f);
    });
    await importVerarbeiten(text, endung, name);
  }catch(err){ await dlgInfo(tx("sp.dateiUnles"), String(err&&err.message||err)); }
}

/* Fehler in der Oberfläche landen im Protokoll statt still zu verschwinden. */
window.addEventListener("error", ev=>{
  try{ window.sluuw.app.protokolliere(ev.message, ev.error&&ev.error.stack); }catch(e){}
});
window.addEventListener("unhandledrejection", ev=>{
  try{ window.sluuw.app.protokolliere("Unbehandeltes Versprechen: "+(ev.reason&&ev.reason.message), ev.reason&&ev.reason.stack); }catch(e){}
});

/* Schließen: erst fragen, dann wirklich zu. */
if(winApi&&winApi.onCloseRequested) winApi.onCloseRequested(async ()=>{
  if(winApi.closeInProgress) winApi.closeInProgress();   /* Wir leben – Notbremse im Hauptprozess lösen */
  clearTimeout(autoTimer);
  if(ungesichert){
    const r=await dlg({titel:tx("beenden.titel"),
      text:tx("sp.beendenFrage", state.book.title||tx("bib.ohneTitel")),
      knoepfe:[{t:tx("btn.abbrechen")},{t:tx("sp.ohneSpeichern"), gefahr:true},{t:tx("sp.speichernBeenden"), w:true}]});
    if(!r||r.knopf===0) return;
    if(r.knopf===2 && !await speichereJetzt(false)) return;
    if(r.knopf===1 && !projektDatei && DATEI) await DATEI.entwurfVerwerfen();
  }
  winApi.confirmClose();
});

/* Doppelklick auf eine .story-Datei im Explorer */
if(DATEI&&DATEI.onOeffnenAnfrage) DATEI.onOeffnenAnfrage(pfad=>projektOeffnen(pfad));

/* Hinweis auf neue Fassungen, sobald eine Bezugsquelle hinterlegt ist */
async function updateInstallieren(){
  if(ungesichert && !await speichereJetzt(false)) return;
  window.sluuw.app.aktualisierungInstallieren();
}
if(window.sluuw&&window.sluuw.app&&window.sluuw.app.onAktualisierung){
  window.sluuw.app.onAktualisierung(async d=>{
    updateStand=d;
    if($("optsOverlay").classList.contains("show")) renderOpts();   /* Einstellungen offen: dort mitlaufen lassen */

    if(d.stand==="verfuegbar"){
      if(await dlgFrage(tx("upd.neueVersion"), tx("upd.bereitsteht", d.version), tx("upd.herunterladen")))
        window.sluuw.app.aktualisierungLaden();
    } else if(d.stand==="laedt"){
      if((d.prozent||0)%25===0) toast(tx("upd.ladeProzent", d.prozent));
    } else if(d.stand==="geladen"){
      if(await dlgFrage(tx("upd.istBereit", d.version), tx("upd.neustartText"), tx("upd.neustart")))
        updateInstallieren();
    } else if(d.stand==="fehler"){
      toast(tx("upd.fehlerLang"));
    }
  });
}

/* Zuletzt: Daten laden. Alles davor muss stehen, damit das Laden schon rendern darf. */
load().catch(async e=>{
  try{ window.sluuw.app.protokolliere("Laden fehlgeschlagen: "+e.message, e.stack); }catch(_){}
  await dlgInfo(tx("sp.ladeFehler"), e.message+"\n\n"+tx("sp.ladeFehlerT"));
  ensureTl(); curMind(); renderAll();
});
