   2. overflow:hidden und text-overflow wirken nicht auf inline-
      Elemente. Ein <span> mit Auslassungspunkten kürzt also
      nicht, sondern läuft weiter – so geschehen beim Dateinamen
      in der Projektkarte.
   ============================================================ */
.btn{flex-shrink:0; max-width:100%;}
/* Ist wirklich kein Platz mehr, lieber umbrechen als austreten */
.modalBtns .btn{white-space:normal; text-align:center;}

/* Sehr lange Wörter – Dateipfade, erfundene Namen – sprengen sonst die Karte */
.dlgText,.relNote,.dataRow .v,.mCard .desc,.chapRow .meta,.tlItem p,.emptyMsg{overflow-wrap:anywhere;}
.mCard h3,.chapRow h3,.tlItem h3,.relCard .rh h3,.pcHead h2{overflow-wrap:anywhere; min-width:0;}
.toast{overflow-wrap:anywhere;}

/* Flex-Kinder dürfen nicht breiter werden als ihr Kasten */
.mCard,.chapRow .grow,.miniItem .grow,.relCard,.panelCard,.statStrip{min-width:0;}
.mCard>*{min-width:0; max-width:100%;}
.cardBtns,.filterBar,.headActions{flex-wrap:wrap;}

/* Kleine Bildschirme: mehr Platz für Inhalt, weniger für Rahmen */
@media (max-width:640px){
  .sidebar{display:none;}
  .mainHead{padding:12px 14px 10px;}
  #sContent{padding:6px 14px 28px;}
  .cardGrid{grid-template-columns:1fr; gap:14px;}
  .relGrid{grid-template-columns:1fr;}
  .modal{padding:20px 16px; border-radius:var(--radius);}
  .btn{padding:7px 11px;}
  .statStrip{gap:20px; padding:14px 16px;}
  .sparkWrap{margin-left:0;}
}

/* ============================================================
   ANGLEICHUNG DER ÜBRIGEN ANSICHTEN
   Die neue Oberfläche lebt von Kanten statt Schatten. Karten,
   Zeilen und Spalten werden entsprechend flacher gestellt.
   ============================================================ */
.mCard,.dashCard,.chapRow,.tlItem,.kCard{box-shadow:none;}
.mCard{border-radius:var(--radius); padding:15px;}
.mCard:hover{transform:none; border-color:var(--line-strong); background:var(--panel-hover);}
.chapRow{border-radius:var(--radius); padding:12px 14px; margin-bottom:7px;}
.chapRow:hover{transform:none; border-color:var(--line-strong); background:var(--panel-hover);}
.dashCard{border-radius:var(--radius); padding:18px;}
.dashCard h2{font-size:13.5px; color:var(--text); margin-bottom:12px;}
.chapNum{border-radius:8px; font-size:13px;}
.typeIcon{border-radius:9px;}
.tlItem{border-radius:var(--radius);}
.kCol{border-radius:var(--radius); background:var(--panel2); border:1px solid var(--border-subtle);}
.kCard{border-radius:8px; background:var(--panel); border-color:var(--border);}
.kCard:hover{border-color:var(--line-strong);}
.chipToggle{border-radius:var(--radius-sm); padding:5px 11px; font-size:12px;}
.chipToggle.active{box-shadow:none; color:var(--accent-ink);}
.statNum{background:var(--panel2); border-radius:9px;}
.statNum b{font-weight:400; font-size:22px;}
.linkChip{border-radius:var(--radius-sm); padding:3px 10px; font-size:12.5px; font-weight:550;}
.progressBar{box-shadow:none; background:var(--panel2);}
.progressBar>div{background:var(--accent);}
.barRow .bar>div{background:var(--accent);}
.modal{border-radius:var(--radius);}
.toast{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:var(--radius);}
.toast button{color:var(--accent);}
.mmWrap{border-radius:var(--radius); box-shadow:none;}
.filterBar{margin-bottom:14px;}

    'ein.browserText':  { de:'{0} MB von rund 5 MB belegt ({1} %). Diese Grenze gilt nur, weil die App gerade im Browser läuft. In der installierten Anwendung werden Projekte als Dateien gespeichert und sind unbegrenzt groß.', en:'{0} MB of about 5 MB used ({1}%). This limit applies only because the app is running in a browser. In the installed application projects are saved as files and have no size limit.', zh:'已用 {0} MB，约 5 MB 上限（{1}%）。此限制仅因当前在浏览器中运行。安装版将项目保存为文件，没有大小限制。', hi:'लगभग 5 MB में से {0} MB उपयोग ({1}%)। यह सीमा केवल इसलिए है क्योंकि ऐप ब्राउज़र में चल रहा है। स्थापित अनुप्रयोग में परियोजनाएँ फ़ाइलों के रूप में सहेजी जाती हैं और असीमित होती हैं।', es:'{0} MB de unos 5 MB usados ({1} %). Este límite existe solo porque la app se ejecuta en el navegador. En la aplicación instalada los proyectos se guardan como archivos, sin límite de tamaño.', ar:'استُخدم {0} ميغابايت من نحو 5 ({1}٪). هذا الحد قائم فقط لأن التطبيق يعمل في المتصفح. في التطبيق المثبَّت تُحفظ المشاريع كملفات بلا حد للحجم.', fr:'{0} Mo utilisés sur environ 5 Mo ({1} %). Cette limite n’existe que parce que l’app tourne dans un navigateur. Dans l’application installée, les projets sont des fichiers, sans limite de taille.', bn:'প্রায় ৫ MB-র মধ্যে {0} MB ব্যবহৃত ({1}%)। এই সীমা কেবল ব্রাউজারে চলার কারণে। ইনস্টল করা অ্যাপে প্রকল্প ফাইল হিসেবে সংরক্ষিত হয়, আকারের সীমা নেই।', pt:'{0} MB de cerca de 5 MB usados ({1} %). Este limite existe só porque a app corre no navegador. Na aplicação instalada os projetos são ficheiros, sem limite de tamanho.', id:'{0} MB dari sekitar 5 MB terpakai ({1}%). Batas ini hanya berlaku karena aplikasi berjalan di peramban. Pada aplikasi terpasang, proyek disimpan sebagai berkas tanpa batas ukuran.', ur:'تقریباً 5 MB میں سے {0} MB استعمال ({1}%)۔ یہ حد صرف اس لیے ہے کہ ایپ براؤزر میں چل رہی ہے۔ نصب شدہ ایپلی کیشن میں منصوبے فائلوں کے طور پر محفوظ ہوتے ہیں، حجم کی کوئی حد نہیں۔' },

    /* ---------- Einstellungen: eigene Optionen ---------- */
    'opt.hinweis':      { de:'Neue Optionen legst du direkt im Formular an: wähle im Dropdown den Eintrag „➕ Neue Option …". Der Kapitel- und Folgen-Status sowie die Akte bleiben fest – Fortschrittsanzeige, Statistik und Akt-Struktur rechnen auf genau diesen Werten.', en:'You add new options right in the form: choose “➕ New option …” in the dropdown. Chapter and episode status and the acts stay fixed – progress, statistics and act structure are calculated from exactly those values.', zh:'新选项直接在表单中添加：在下拉列表中选择“➕ 新选项 …”。章节与剧集状态以及幕保持固定——进度、统计和幕结构正是基于这些值计算的。', hi:'नए विकल्प सीधे फ़ॉर्म में जोड़ें: ड्रॉपडाउन में „➕ नया विकल्प …" चुनें। अध्याय और एपिसोड की स्थिति तथा अंक निश्चित रहते हैं – प्रगति, आँकड़े और अंक-संरचना इन्हीं मानों पर गणना करते हैं।', es:'Las opciones nuevas se añaden en el formulario: elige “➕ Nueva opción …” en el desplegable. El estado de capítulos y episodios y los actos son fijos: el progreso, las estadísticas y la estructura de actos se calculan con esos valores.', ar:'تُضاف الخيارات الجديدة من النموذج مباشرة: اختر «➕ خيار جديد …» من القائمة. تبقى حالة الفصول والحلقات والفصول الثلاثة ثابتة – فالتقدّم والإحصاءات وبنية الفصول تُحسب من هذه القيم بالذات.', fr:'Les nouvelles options s’ajoutent dans le formulaire : choisissez « ➕ Nouvelle option … » dans la liste. Le statut des chapitres et épisodes ainsi que les actes restent fixes : progression, statistiques et structure en dépendent.', bn:'নতুন বিকল্প সরাসরি ফর্মে যোগ করুন: ড্রপডাউনে „➕ নতুন বিকল্প …" বাছুন। অধ্যায় ও পর্বের অবস্থা এবং অঙ্ক স্থির থাকে – অগ্রগতি, পরিসংখ্যান ও অঙ্ক-কাঠামো ঠিক এই মানগুলির উপরেই হিসাব করে।', pt:'As novas opções adicionam-se no formulário: escolha “➕ Nova opção …” na lista. O estado de capítulos e episódios e os atos são fixos – progresso, estatísticas e estrutura baseiam-se nesses valores.', id:'Pilihan baru ditambahkan langsung di formulir: pilih “➕ Pilihan baru …” pada daftar. Status bab dan episode serta babak tetap – kemajuan, statistik dan struktur babak dihitung dari nilai-nilai itu.', ur:'نئے اختیارات براہِ راست فارم میں شامل کریں: فہرست میں سے «➕ نیا اختیار …» چنیں۔ ابواب اور اقساط کی حالت اور ایکٹ مقرر رہتے ہیں – پیش رفت، اعداد و شمار اور ایکٹ کی ساخت انہی اقدار پر شمار ہوتی ہے۔' },

    'ex.projektText':   { de:'Als Ordner voller Markdown-Dateien: eine Datei je Eintrag, sortiert wie in der Ordner-Ansicht. Lesbar mit jedem Texteditor, unabhängig von Sluuw.\n\nAls JSON: eine einzige Datei mit allem, zum Wiedereinlesen gedacht.', en:'As a folder of Markdown files: one file per entry, sorted as in the folder view. Readable in any text editor, independent of Sluuw.\n\nAs JSON: a single file containing everything, meant for importing back.', zh:'导出为 Markdown 文件夹：每个条目一个文件，按文件夹视图排序，任何文本编辑器都能读，不依赖 Sluuw。\n\n导出为 JSON：单个文件包含全部内容，便于再次导入。', hi:'Markdown फ़ोल्डर के रूप में: प्रति प्रविष्टि एक फ़ाइल, फ़ोल्डर-दृश्य के क्रम में। किसी भी टेक्स्ट एडिटर में पढ़ने योग्य, Sluuw से स्वतंत्र।\n\nJSON के रूप में: सब कुछ एक फ़ाइल में, फिर से आयात करने के लिए।', es:'Como carpeta de archivos Markdown: un archivo por entrada, ordenado como en la vista de carpetas. Legible en cualquier editor, sin depender de Sluuw.\n\nComo JSON: un único archivo con todo, pensado para volver a importarlo.', ar:'كمجلد من ملفات Markdown: ملف لكل مدخل، مرتّب كما في عرض المجلدات. يُقرأ بأي محرر نصوص، بمعزل عن Sluuw.\n\nكـJSON: ملف واحد يضم كل شيء، مُعدّ لإعادة الاستيراد.', fr:'Sous forme de dossier de fichiers Markdown : un fichier par entrée, classé comme dans la vue Dossiers. Lisible dans n’importe quel éditeur, indépendamment de Sluuw.\n\nEn JSON : un seul fichier contenant tout, prévu pour être réimporté.', bn:'Markdown ফোল্ডার হিসেবে: প্রতি এন্ট্রিতে একটি ফাইল, ফোল্ডার-দৃশ্যের ক্রমে। যেকোনো টেক্সট এডিটরে পড়া যায়, Sluuw ছাড়াই।\n\nJSON হিসেবে: সবকিছু একটি ফাইলে, আবার আমদানির জন্য।', pt:'Como pasta de ficheiros Markdown: um ficheiro por entrada, ordenado como na vista de pastas. Legível em qualquer editor, independente do Sluuw.\n\nComo JSON: um único ficheiro com tudo, pensado para reimportar.', id:'Sebagai folder berisi berkas Markdown: satu berkas per entri, tersusun seperti pada tampilan folder. Dapat dibaca di editor teks mana pun, tanpa Sluuw.\n\nSebagai JSON: satu berkas berisi semuanya, untuk diimpor kembali.', ur:'Markdown فائلوں کے فولڈر کے طور پر: فی اندراج ایک فائل، فولڈر منظر کی ترتیب میں۔ کسی بھی ٹیکسٹ ایڈیٹر میں پڑھی جا سکتی ہے، Sluuw کے بغیر بھی۔\n\nJSON کے طور پر: سب کچھ ایک فائل میں، دوبارہ درآمد کے لیے۔' },

    'tour.abgeschlossen': { de:'Rundgang beendet. Über „Hilfe“ lässt er sich jederzeit wiederholen.', en:'Tour finished. You can replay it any time from “Help”.', zh:'导览结束。可随时从「帮助」重新观看。', hi:'परिचय समाप्त। „सहायता“ से कभी भी दोहरा सकते हैं।', es:'Recorrido terminado. Puedes repetirlo cuando quieras desde «Ayuda».', ar:'انتهت الجولة. يمكنك إعادتها متى شئت من «مساعدة».', fr:'Visite terminée. Vous pouvez la refaire à tout moment depuis « Aide ».', bn:'পরিচিতি শেষ। „সহায়তা“ থেকে যেকোনো সময় আবার দেখতে পারেন।', pt:'Visita terminada. Pode repeti-la a qualquer momento em «Ajuda».', id:'Tur selesai. Anda bisa mengulanginya kapan saja dari “Bantuan”.', ur:'دورہ مکمل۔ «مدد» سے کبھی بھی دہرا سکتے ہیں۔' },
    'tour.e1.t':          { de:'Willkommen bei Sluuw', en:'Welcome to Sluuw', zh:'欢迎使用 Sluuw', hi:'Sluuw में आपका स्वागत है', es:'Bienvenido a Sluuw', ar:'مرحباً بك في Sluuw', fr:'Bienvenue dans Sluuw', bn:'Sluuw-এ স্বাগতম', pt:'Bem-vindo ao Sluuw', id:'Selamat datang di Sluuw', ur:'Sluuw میں خوش آمدید' },
    'tour.e1.x':          { de:'Ein kurzer Rundgang durch die fünf Stellen, die Sie täglich brauchen. Mit den Pfeiltasten weiter, mit Esc jederzeit beenden.', en:'A short tour of the five places you will use every day. Arrow keys to move on, Esc to stop at any time.', zh:'快速了解你每天会用到的五个地方。方向键继续，Esc 随时退出。', hi:'रोज़ काम आने वाली पाँच जगहों का छोटा परिचय। तीर कुंजी से आगे, Esc से कभी भी बंद।', es:'Un recorrido breve por los cinco sitios que usarás a diario. Flechas para avanzar, Esc para salir.', ar:'جولة قصيرة في المواضع الخمسة التي ستستخدمها يومياً. الأسهم للتقدّم، وEsc للإنهاء في أي وقت.', fr:'Une courte visite des cinq endroits que vous utiliserez chaque jour. Flèches pour avancer, Échap pour quitter.', bn:'প্রতিদিন কাজে লাগে এমন পাঁচটি জায়গার সংক্ষিপ্ত পরিচয়। তীর-চিহ্নে এগোন, Esc-এ যেকোনো সময় বন্ধ।', pt:'Uma visita curta aos cinco lugares que usará todos os dias. Setas para avançar, Esc para sair.', id:'Tur singkat ke lima tempat yang Anda pakai tiap hari. Panah untuk lanjut, Esc untuk keluar.', ur:'ان پانچ مقامات کا مختصر دورہ جو آپ روز استعمال کریں گے۔ تیر سے آگے، Esc سے کبھی بھی بند۔' },
    'tour.e2.t':          { de:'Ihr Projekt', en:'Your project', zh:'你的项目', hi:'आपकी परियोजना', es:'Tu proyecto', ar:'مشروعك', fr:'Votre projet', bn:'আপনার প্রকল্প', pt:'O seu projeto', id:'Proyek Anda', ur:'آپ کا منصوبہ' },
    'tour.e2.x':          { de:'Hier steht, woran Sie gerade arbeiten. Ein Klick öffnet das Projektmenü: neu anlegen, öffnen, speichern, einlesen und ausgeben.', en:'This shows what you are working on. A click opens the project menu: create, open, save, import and export.', zh:'这里显示你正在做的项目。点击可打开项目菜单：新建、打开、保存、导入和导出。', hi:'यहाँ दिखता है कि आप किस पर काम कर रहे हैं। क्लिक करने पर परियोजना-मेनू खुलता है: नया, खोलें, सहेजें, आयात और निर्यात।', es:'Aquí ves en qué estás trabajando. Un clic abre el menú del proyecto: crear, abrir, guardar, importar y exportar.', ar:'هنا يظهر ما تعمل عليه. والنقر يفتح قائمة المشروع: إنشاء وفتح وحفظ واستيراد وتصدير.', fr:'Ici s’affiche ce sur quoi vous travaillez. Un clic ouvre le menu du projet : créer, ouvrir, enregistrer, importer et exporter.', bn:'এখানে দেখা যায় আপনি কী নিয়ে কাজ করছেন। ক্লিকে প্রকল্প-মেনু খোলে: নতুন, খুলুন, সংরক্ষণ, আমদানি ও রপ্তানি।', pt:'Aqui vê no que está a trabalhar. Um clique abre o menu do projeto: criar, abrir, guardar, importar e exportar.', id:'Di sini terlihat proyek yang sedang Anda kerjakan. Klik untuk membuka menu proyek: buat, buka, simpan, impor, dan ekspor.', ur:'یہاں نظر آتا ہے کہ آپ کس پر کام کر رہے ہیں۔ کلک سے منصوبہ مینو کھلتا ہے: نیا، کھولیں، محفوظ، درآمد اور برآمد۔' },
    'tour.e3.t':          { de:'Alle Bereiche', en:'All sections', zh:'所有板块', hi:'सभी भाग', es:'Todas las secciones', ar:'كل الأقسام', fr:'Toutes les sections', bn:'সব বিভাগ', pt:'Todas as secções', id:'Semua bagian', ur:'تمام حصے' },
    'tour.e3.x':          { de:'Kapitel, Figuren, Orte, Welt, Handlung, Zeitleiste, Mindmap – jeder Bereich Ihres Buches liegt hier. Die Zahl daneben zeigt, wie viel schon darin steht.', en:'Chapters, characters, places, world, plot, timeline, mind map – every part of your book lives here. The number shows how much is in it already.', zh:'章节、角色、地点、世界观、情节、时间线、思维导图——你这本书的每个部分都在这里。旁边的数字表示已有多少内容。', hi:'अध्याय, पात्र, स्थान, विश्व, कथानक, समयरेखा, माइंड मैप – आपकी किताब का हर हिस्सा यहीं है। बगल की संख्या बताती है कि उसमें कितना है।', es:'Capítulos, personajes, lugares, mundo, trama, línea de tiempo, mapa mental: cada parte de tu libro está aquí. El número indica cuánto hay ya.', ar:'الفصول والشخصيات والأماكن والعالم والحبكة والخط الزمني والخريطة الذهنية – كل جزء من كتابك هنا. والرقم بجانبه يبيّن كم فيه.', fr:'Chapitres, personnages, lieux, monde, intrigue, chronologie, carte mentale – chaque partie de votre livre est ici. Le nombre indique ce qui s’y trouve déjà.', bn:'অধ্যায়, চরিত্র, স্থান, জগৎ, কাহিনি, সময়রেখা, মাইন্ড ম্যাপ – আপনার বইয়ের প্রতিটি অংশ এখানে। পাশের সংখ্যা বলে দেয় কতটা আছে।', pt:'Capítulos, personagens, lugares, mundo, trama, linha do tempo, mapa mental – cada parte do seu livro está aqui. O número mostra quanto já existe.', id:'Bab, tokoh, tempat, dunia, plot, linimasa, peta pikiran – setiap bagian buku Anda ada di sini. Angka di sampingnya menunjukkan isinya.', ur:'ابواب، کردار، مقامات، دنیا، کہانی، ٹائم لائن، ذہنی نقشہ – آپ کی کتاب کا ہر حصہ یہاں ہے۔ ساتھ کا عدد بتاتا ہے کہ اس میں کتنا ہے۔' },
    'tour.e4.t':          { de:'Neu anlegen', en:'Add something new', zh:'新建内容', hi:'नया जोड़ें', es:'Añadir algo nuevo', ar:'أضف شيئاً جديداً', fr:'Ajouter du nouveau', bn:'নতুন যোগ করুন', pt:'Adicionar algo novo', id:'Tambah baru', ur:'نیا شامل کریں' },
    'tour.e4.x':          { de:'Legt einen Eintrag in dem Bereich an, den Sie gerade offen haben. Geht auch mit der Taste N – ohne die Maus zu benutzen.', en:'Creates an entry in the section you currently have open. The key N does the same, without touching the mouse.', zh:'在你当前打开的板块中新建一个条目。按 N 键同样可以，不用鼠标。', hi:'जो भाग खुला है, उसमें एक प्रविष्टि बनाता है। N कुंजी से भी – बिना माउस के।', es:'Crea una entrada en la sección que tienes abierta. La tecla N hace lo mismo, sin usar el ratón.', ar:'يُنشئ مدخلاً في القسم المفتوح حالياً. ويؤدي المفتاح N الغرض نفسه دون استخدام الفأرة.', fr:'Crée une entrée dans la section ouverte. La touche N fait la même chose, sans la souris.', bn:'যে বিভাগ খোলা আছে সেখানে একটি এন্ট্রি তৈরি করে। N কী দিয়েও একই – মাউস ছাড়াই।', pt:'Cria uma entrada na secção que tem aberta. A tecla N faz o mesmo, sem usar o rato.', id:'Membuat entri di bagian yang sedang terbuka. Tombol N melakukan hal sama, tanpa mouse.', ur:'جو حصہ کھلا ہے اس میں اندراج بناتا ہے۔ N کلید سے بھی – ماؤس کے بغیر۔' },
    'tour.e5.t':          { de:'Sprache und Aussehen', en:'Language and appearance', zh:'语言与外观', hi:'भाषा और रूप', es:'Idioma y aspecto', ar:'اللغة والمظهر', fr:'Langue et apparence', bn:'ভাষা ও চেহারা', pt:'Idioma e aspeto', id:'Bahasa dan tampilan', ur:'زبان اور ظاہری شکل' },
    'tour.e5.x':          { de:'Hinter dem Zahnrad ⚙ stellen Sie die Sprache um – elf stehen zur Wahl. Daneben schaltet ☀/☾ zwischen hell und dunkel, links wechseln Sie in den Profi-Modus.', en:'Behind the gear ⚙ you change the language – eleven to choose from. Next to it, ☀/☾ switches light and dark, and on the left you switch to pro mode.', zh:'齿轮 ⚙ 后面可以切换语言——共十一种。旁边的 ☀/☾ 切换明暗，左侧切换到专业模式。', hi:'गियर ⚙ के पीछे भाषा बदलें – ग्यारह विकल्प। बगल में ☀/☾ हल्का/गहरा बदलता है, बाईं ओर प्रो मोड।', es:'Detrás del engranaje ⚙ cambias el idioma: once opciones. Al lado, ☀/☾ alterna claro y oscuro, y a la izquierda pasas al modo profesional.', ar:'خلف الترس ⚙ تُغيّر اللغة – أحد عشر خياراً. وبجانبه يبدّل ☀/☾ بين الفاتح والداكن، وعلى اليسار تنتقل إلى الوضع الاحترافي.', fr:'Derrière l’engrenage ⚙ vous changez de langue – onze au choix. À côté, ☀/☾ bascule clair/sombre, et à gauche vous passez en mode pro.', bn:'গিয়ার ⚙-এর পেছনে ভাষা বদলান – এগারোটি বিকল্প। পাশে ☀/☾ হালকা-গাঢ় বদলায়, বাঁয়ে প্রো মোডে যান।', pt:'Atrás da engrenagem ⚙ muda o idioma – onze à escolha. Ao lado, ☀/☾ alterna claro e escuro, e à esquerda passa ao modo profissional.', id:'Di balik roda gigi ⚙ Anda mengubah bahasa – ada sebelas pilihan. Di sebelahnya ☀/☾ mengganti terang/gelap, di kiri beralih ke mode pro.', ur:'گیئر ⚙ کے پیچھے زبان بدلیں – گیارہ اختیارات۔ ساتھ میں ☀/☾ روشن/تاریک بدلتا ہے، بائیں طرف پرو موڈ۔' },

    /* --- Rundgang: Profi-Modus --- */
    'tour.p1.t': { de:'Der Profi-Modus', en:'Pro mode', zh:'专业模式', hi:'प्रो मोड', es:'El modo profesional', ar:'الوضع الاحترافي', fr:'Le mode pro', bn:'প্রো মোড', pt:'O modo profissional', id:'Mode pro', ur:'پرو موڈ' },
    'tour.p1.x': { de:'Dieselben Daten, dichter angeordnet: Menüleiste oben, Sammlungen links, Eigenschaften rechts. Alles, was hier geht, geht auch im einfachen Modus – nur mit weniger Klicks.', en:'The same data, packed tighter: menu bar on top, collections on the left, properties on the right. Everything here works in simple mode too – just with fewer clicks.', zh:'同样的数据，排布更紧凑：顶部菜单栏，左侧集合，右侧属性。这里能做的事简易模式也能做，只是点击更少。', hi:'वही डेटा, सघन रूप में: ऊपर मेनू, बाएँ संग्रह, दाएँ गुण। यहाँ जो होता है वह सरल मोड में भी होता है – बस कम क्लिक में।', es:'Los mismos datos, más compactos: barra de menú arriba, colecciones a la izquierda, propiedades a la derecha. Todo lo de aquí también está en el modo sencillo, solo con menos clics.', ar:'البيانات نفسها بترتيب أكثف: شريط القوائم أعلى، والمجموعات يساراً، والخصائص يميناً. وكل ما هنا متاح في الوضع البسيط أيضاً – بنقرات أقل فقط.', fr:'Les mêmes données, plus denses : barre de menu en haut, collections à gauche, propriétés à droite. Tout ce qui est ici existe aussi en mode simple – avec moins de clics.', bn:'একই ডেটা, ঘন বিন্যাসে: উপরে মেনু, বাঁয়ে সংগ্রহ, ডানে বৈশিষ্ট্য। এখানে যা হয় সরল মোডেও হয় – শুধু কম ক্লিকে।', pt:'Os mesmos dados, mais compactos: barra de menu em cima, coleções à esquerda, propriedades à direita. Tudo o que existe aqui existe no modo simples – só com menos cliques.', id:'Data yang sama, lebih padat: bilah menu di atas, koleksi di kiri, properti di kanan. Semua yang ada di sini juga ada di mode sederhana – hanya lebih sedikit klik.', ur:'وہی ڈیٹا، زیادہ گنجان: اوپر مینو، بائیں مجموعے، دائیں خصوصیات۔ جو کچھ یہاں ہے وہ سادہ موڈ میں بھی ہے – بس کم کلک میں۔' },
    'tour.p2.t': { de:'Datei', en:'File', zh:'文件', hi:'फ़ाइल', es:'Archivo', ar:'ملف', fr:'Fichier', bn:'ফাইল', pt:'Ficheiro', id:'Berkas', ur:'فائل' },
    'tour.p2.x': { de:'Projekte anlegen, öffnen und speichern. Dazu alles zum Einlesen und Ausgeben: Sicherungen, fremde Dateien (JSON, CSV, Markdown), das Exposé und der Projekt-Export als Ordner.', en:'Create, open and save projects. Plus everything for import and export: backups, foreign files (JSON, CSV, Markdown), the synopsis and the project export as a folder.', zh:'新建、打开和保存项目。以及所有导入导出功能：备份、外部文件（JSON、CSV、Markdown）、梗概，以及导出为文件夹。', hi:'परियोजनाएँ बनाएँ, खोलें और सहेजें। साथ ही आयात-निर्यात: बैकअप, बाहरी फ़ाइलें (JSON, CSV, Markdown), सारांश और फ़ोल्डर-निर्यात।', es:'Crear, abrir y guardar proyectos. Además todo lo de importar y exportar: copias de seguridad, archivos externos (JSON, CSV, Markdown), la sinopsis y la exportación como carpeta.', ar:'إنشاء المشاريع وفتحها وحفظها. وكذلك كل ما يخص الاستيراد والتصدير: النسخ الاحتياطية والملفات الخارجية (JSON وCSV وMarkdown) والملخّص وتصدير المشروع كمجلد.', fr:'Créer, ouvrir et enregistrer des projets. Et tout l’import/export : sauvegardes, fichiers externes (JSON, CSV, Markdown), le synopsis et l’export du projet en dossier.', bn:'প্রকল্প তৈরি, খোলা ও সংরক্ষণ। সঙ্গে আমদানি-রপ্তানির সব: ব্যাকআপ, বাইরের ফাইল (JSON, CSV, Markdown), সারসংক্ষেপ ও ফোল্ডার-রপ্তানি।', pt:'Criar, abrir e guardar projetos. E tudo para importar e exportar: cópias de segurança, ficheiros externos (JSON, CSV, Markdown), a sinopse e a exportação como pasta.', id:'Membuat, membuka, dan menyimpan proyek. Plus semua impor-ekspor: cadangan, berkas luar (JSON, CSV, Markdown), sinopsis, dan ekspor proyek sebagai folder.', ur:'منصوبے بنائیں، کھولیں اور محفوظ کریں۔ اور درآمد و برآمد کا سب کچھ: بیک اپ، بیرونی فائلیں (JSON، CSV، Markdown)، خلاصہ اور فولڈر برآمد۔' },
    'tour.p3.t': { de:'Bearbeiten', en:'Edit', zh:'编辑', hi:'संपादन', es:'Editar', ar:'تحرير', fr:'Édition', bn:'সম্পাদনা', pt:'Editar', id:'Sunting', ur:'ترمیم' },
    'tour.p3.x': { de:'Rückgängig und Wiederherstellen für jeden Schritt, dazu die Befehle für die Auswahl in der Tabelle. Nichts geht endgültig verloren – auch Gelöschtes kommt zurück.', en:'Undo and redo for every step, plus the commands for the selection in the table. Nothing is lost for good – even deleted entries come back.', zh:'每一步都可撤销和重做，还有表格中选中项的操作。没有什么会永久丢失——删除的也能恢复。', hi:'हर चरण के लिए पूर्ववत और फिर से, साथ ही तालिका में चयन के आदेश। कुछ भी हमेशा के लिए नहीं खोता – हटाया गया भी लौट आता है।', es:'Deshacer y rehacer en cada paso, más los comandos para la selección en la tabla. Nada se pierde para siempre: lo borrado también vuelve.', ar:'التراجع والإعادة لكل خطوة، مع أوامر التحديد في الجدول. ولا شيء يضيع نهائياً – حتى المحذوف يعود.', fr:'Annuler et rétablir à chaque étape, plus les commandes pour la sélection dans le tableau. Rien n’est perdu définitivement – même le supprimé revient.', bn:'প্রতিটি ধাপে পূর্বাবস্থা ও পুনরায়, সঙ্গে সারণিতে নির্বাচনের কমান্ড। কিছুই স্থায়ীভাবে হারায় না – মোছা জিনিসও ফিরে আসে।', pt:'Desfazer e refazer em cada passo, mais os comandos para a seleção na tabela. Nada se perde definitivamente – até o apagado volta.', id:'Urungkan dan ulangi untuk tiap langkah, plus perintah untuk pilihan di tabel. Tidak ada yang hilang selamanya – yang dihapus pun kembali.', ur:'ہر مرحلے کے لیے واپس اور دوبارہ، اور جدول میں انتخاب کے احکام۔ کچھ بھی ہمیشہ کے لیے ضائع نہیں ہوتا – حذف شدہ بھی واپس آتا ہے۔' },
    'tour.p4.t': { de:'Ansicht', en:'View', zh:'视图', hi:'दृश्य', es:'Ver', ar:'عرض', fr:'Affichage', bn:'দৃশ্য', pt:'Ver', id:'Tampilan', ur:'منظر' },
    'tour.p4.x': { de:'Wechselt zwischen den sechs Arbeitsflächen – dieselben, die Sie gleich als Reiter sehen. Die Ziffern 1 bis 6 tun dasselbe. Hier geht es auch zurück in den einfachen Modus.', en:'Switches between the six workspaces – the same ones you will see as tabs in a moment. The digits 1 to 6 do the same. This is also the way back to simple mode.', zh:'在六个工作区之间切换——就是接下来会看到的那些标签页。数字键 1 到 6 效果相同。这里也可以切回简易模式。', hi:'छह कार्यक्षेत्रों के बीच बदलें – वही जो अभी टैब के रूप में दिखेंगे। अंक 1 से 6 भी यही करते हैं। यहीं से सरल मोड में वापसी भी।', es:'Cambia entre los seis espacios de trabajo, los mismos que verás como pestañas. Las cifras 1 a 6 hacen lo mismo. Aquí también se vuelve al modo sencillo.', ar:'ينقلك بين مساحات العمل الست – وهي نفسها التي ستراها كعلامات تبويب. والأرقام 1 إلى 6 تفعل الشيء نفسه. ومن هنا أيضاً تعود إلى الوضع البسيط.', fr:'Bascule entre les six espaces de travail – les mêmes que vous verrez en onglets. Les chiffres 1 à 6 font pareil. C’est aussi le retour au mode simple.', bn:'ছয়টি কর্মক্ষেত্রের মধ্যে বদলায় – একটু পরে ট্যাব হিসেবে যেগুলো দেখবেন। ১ থেকে ৬ সংখ্যাও একই কাজ করে। এখান থেকেই সরল মোডে ফেরা যায়।', pt:'Alterna entre os seis espaços de trabalho – os mesmos que verá como separadores. Os algarismos 1 a 6 fazem o mesmo. Aqui também se volta ao modo simples.', id:'Beralih antara enam ruang kerja – yang sebentar lagi Anda lihat sebagai tab. Angka 1 sampai 6 melakukan hal sama. Di sini juga jalan kembali ke mode sederhana.', ur:'چھ کام کی جگہوں کے درمیان بدلتا ہے – وہی جو ابھی ٹیب کے طور پر نظر آئیں گی۔ ہندسے 1 تا 6 بھی یہی کرتے ہیں۔ یہیں سے سادہ موڈ میں واپسی بھی۔' },
    'tour.p5.t': { de:'Hilfe', en:'Help', zh:'帮助', hi:'सहायता', es:'Ayuda', ar:'مساعدة', fr:'Aide', bn:'সহায়তা', pt:'Ajuda', id:'Bantuan', ur:'مدد' },
    'tour.p5.x': { de:'Alle Tastenkürzel auf einen Blick, Angaben zum Programm – und dieser Rundgang, falls Sie ihn noch einmal sehen wollen.', en:'All keyboard shortcuts at a glance, details about the program – and this tour, in case you want to see it again.', zh:'所有键盘快捷键一览、程序信息——以及这个导览，方便你再看一遍。', hi:'सभी कुंजी-संक्षेप एक नज़र में, प्रोग्राम की जानकारी – और यह परिचय, अगर दोबारा देखना हो।', es:'Todos los atajos de teclado de un vistazo, datos del programa y este recorrido, por si quieres verlo otra vez.', ar:'كل اختصارات لوحة المفاتيح في لمحة، ومعلومات البرنامج – وهذه الجولة إن أردت مشاهدتها ثانية.', fr:'Tous les raccourcis clavier d’un coup d’œil, les informations sur le programme – et cette visite, si vous voulez la revoir.', bn:'সব কীবোর্ড শর্টকাট এক নজরে, প্রোগ্রামের তথ্য – আর এই পরিচিতি, আবার দেখতে চাইলে।', pt:'Todos os atalhos de teclado num relance, informações do programa – e esta visita, caso a queira rever.', id:'Semua pintasan papan ketik sekilas, info program – dan tur ini, kalau ingin melihatnya lagi.', ur:'تمام کی بورڈ شارٹ کٹ ایک نظر میں، پروگرام کی معلومات – اور یہ دورہ، اگر دوبارہ دیکھنا ہو۔' },
    'tour.p6.t': { de:'Tabelle', en:'Table', zh:'表格', hi:'तालिका', es:'Tabla', ar:'الجدول', fr:'Tableau', bn:'সারণি', pt:'Tabela', id:'Tabel', ur:'جدول' },
    'tour.p6.x': { de:'Alles auf einmal, sortierbar nach jeder Spalte. Mehrere Zeilen lassen sich mit Strg auswählen und gemeinsam löschen; ein Doppelklick öffnet das Formular.', en:'Everything at once, sortable by any column. Select several rows with Ctrl and delete them together; a double-click opens the form.', zh:'一次看到全部，可按任意列排序。按住 Ctrl 可多选并一起删除；双击打开表单。', hi:'सब कुछ एक साथ, किसी भी स्तंभ से क्रमबद्ध। Ctrl से कई पंक्तियाँ चुनकर एक साथ हटाएँ; डबल-क्लिक फ़ॉर्म खोलता है।', es:'Todo de una vez, ordenable por cualquier columna. Con Ctrl seleccionas varias filas y las borras juntas; el doble clic abre el formulario.', ar:'كل شيء دفعة واحدة، ويمكن الفرز بأي عمود. حدّد عدة صفوف بـ Ctrl واحذفها معاً؛ والنقر المزدوج يفتح النموذج.', fr:'Tout d’un coup, triable par n’importe quelle colonne. Sélectionnez plusieurs lignes avec Ctrl et supprimez-les ensemble ; le double-clic ouvre le formulaire.', bn:'সবকিছু একসঙ্গে, যেকোনো কলাম অনুসারে সাজানো যায়। Ctrl দিয়ে একাধিক সারি বেছে একসঙ্গে মুছুন; ডাবল-ক্লিকে ফর্ম খোলে।', pt:'Tudo de uma vez, ordenável por qualquer coluna. Com Ctrl seleciona várias linhas e apaga-as juntas; o duplo clique abre o formulário.', id:'Semuanya sekaligus, bisa diurutkan per kolom. Pilih beberapa baris dengan Ctrl lalu hapus bersama; klik ganda membuka formulir.', ur:'سب کچھ ایک ساتھ، کسی بھی کالم سے ترتیب دیں۔ Ctrl سے کئی قطاریں منتخب کر کے اکٹھی حذف کریں؛ ڈبل کلک فارم کھولتا ہے۔' },
    'tour.p7.t': { de:'Ordner', en:'Folders', zh:'文件夹', hi:'फ़ोल्डर', es:'Carpetas', ar:'المجلدات', fr:'Dossiers', bn:'ফোল্ডার', pt:'Pastas', id:'Folder', ur:'فولڈرز' },
    'tour.p7.x': { de:'Ihre eigene Ordnung neben den Sammlungen: „Teil 1“, „Nebenhandlung“, was immer Sie brauchen. Einträge und ganze Ordner lassen sich hineinziehen, Unterordner gehen sechs Ebenen tief.', en:'Your own order alongside the collections: “Part 1”, “Subplot”, whatever you need. Drag entries and whole folders in; subfolders go six levels deep.', zh:'在集合之外建立你自己的秩序：「第一部」「支线」，随你需要。可把条目和整个文件夹拖进去，子文件夹最多六层。', hi:'संग्रहों के अलावा अपनी व्यवस्था: „भाग 1“, „उप-कथा“ – जो आपको चाहिए। प्रविष्टियाँ और पूरे फ़ोल्डर खींचकर डालें; उप-फ़ोल्डर छह स्तर तक।', es:'Tu propio orden junto a las colecciones: «Parte 1», «Subtrama», lo que necesites. Arrastra entradas y carpetas enteras; las subcarpetas llegan a seis niveles.', ar:'ترتيبك الخاص إلى جانب المجموعات: «الجزء 1»، «حبكة فرعية»، وما تشاء. اسحب المداخل والمجلدات كاملةً؛ وتصل المجلدات الفرعية إلى ستة مستويات.', fr:'Votre propre classement à côté des collections : « Partie 1 », « Intrigue secondaire », ce que vous voulez. Glissez-y des entrées et des dossiers entiers ; six niveaux de sous-dossiers.', bn:'সংগ্রহের পাশাপাশি নিজস্ব বিন্যাস: „পর্ব ১“, „উপকাহিনি“ – যা দরকার। এন্ট্রি ও পুরো ফোল্ডার টেনে আনুন; সাব-ফোল্ডার ছয় স্তর পর্যন্ত।', pt:'A sua própria ordem, além das coleções: «Parte 1», «Subenredo», o que precisar. Arraste entradas e pastas inteiras; as subpastas vão a seis níveis.', id:'Tatanan Anda sendiri di samping koleksi: “Bagian 1”, “Subplot”, apa pun. Seret entri dan seluruh folder ke dalamnya; subfolder sampai enam tingkat.', ur:'مجموعوں کے ساتھ اپنی ترتیب: «حصہ 1»، «ذیلی کہانی»، جو چاہیں۔ اندراجات اور پورے فولڈر گھسیٹ کر ڈالیں؛ ذیلی فولڈر چھ درجے تک۔' },
    'tour.p8.t': { de:'Handlungs-Board', en:'Plot board', zh:'情节看板', hi:'कथा-बोर्ड', es:'Tablero de trama', ar:'لوحة الحبكة', fr:'Tableau d’intrigue', bn:'কাহিনি-বোর্ড', pt:'Quadro da trama', id:'Papan plot', ur:'کہانی بورڈ' },
    'tour.p8.x': { de:'Die drei Akte nebeneinander. Plot-Punkte lassen sich zwischen den Spalten ziehen; die Farbe links zeigt den Handlungsstrang. Zeitleiste, Mindmap und Statistik liegen auf den Reitern daneben.', en:'The three acts side by side. Drag plot points between the columns; the colour on the left shows the storyline. Timeline, mind map and statistics sit on the tabs next to it.', zh:'三幕并排显示。情节点可在各列之间拖动；左侧颜色表示所属故事线。时间线、思维导图和统计在旁边的标签页。', hi:'तीनों अंक साथ-साथ। कथा-बिंदु स्तंभों के बीच खींचे जा सकते हैं; बाईं ओर का रंग कथा-सूत्र दिखाता है। समयरेखा, माइंड मैप और आँकड़े बगल के टैब में।', es:'Los tres actos uno al lado del otro. Arrastra los puntos de trama entre columnas; el color de la izquierda indica la línea argumental. Línea de tiempo, mapa mental y estadísticas están en las pestañas contiguas.', ar:'الفصول الثلاثة جنباً إلى جنب. اسحب نقاط الحبكة بين الأعمدة؛ واللون على اليسار يبيّن خيط الحبكة. أما الخط الزمني والخريطة الذهنية والإحصاءات فعلى علامات التبويب المجاورة.', fr:'Les trois actes côte à côte. Faites glisser les points d’intrigue entre les colonnes ; la couleur à gauche indique le fil narratif. Chronologie, carte mentale et statistiques sont sur les onglets voisins.', bn:'তিনটি অঙ্ক পাশাপাশি। কাহিনি-বিন্দু কলামের মধ্যে টেনে সরানো যায়; বাঁয়ের রং কাহিনি-সূত্র দেখায়। সময়রেখা, মাইন্ড ম্যাপ ও পরিসংখ্যান পাশের ট্যাবে।', pt:'Os três atos lado a lado. Arraste os pontos de trama entre colunas; a cor à esquerda mostra a linha narrativa. Linha do tempo, mapa mental e estatísticas estão nos separadores ao lado.', id:'Tiga babak berdampingan. Seret titik plot antar kolom; warna di kiri menunjukkan alur cerita. Linimasa, peta pikiran, dan statistik ada di tab sebelahnya.', ur:'تینوں ایکٹ ساتھ ساتھ۔ کہانی کے نکات کالموں کے درمیان گھسیٹے جا سکتے ہیں؛ بائیں رنگ لڑی بتاتا ہے۔ ٹائم لائن، ذہنی نقشہ اور اعداد و شمار ساتھ کے ٹیبز میں۔' },
    'tour.p9.t': { de:'Sammlungen und Eigenschaften', en:'Collections and properties', zh:'集合与属性', hi:'संग्रह और गुण', es:'Colecciones y propiedades', ar:'المجموعات والخصائص', fr:'Collections et propriétés', bn:'সংগ্রহ ও বৈশিষ্ট্য', pt:'Coleções e propriedades', id:'Koleksi dan properti', ur:'مجموعے اور خصوصیات' },
    'tour.p9.x': { de:'Links filtern Sie nach Art oder Tag. Rechts stehen die Buchdaten – und sobald Sie eine Zeile anklicken, deren Felder: dort lässt sich alles ändern, ohne ein Fenster zu öffnen.', en:'On the left you filter by kind or tag. On the right are the book details – and as soon as you click a row, its fields: everything can be changed there without opening a window.', zh:'左侧按类型或标签筛选。右侧是书籍信息——点击某一行后会显示其字段，可直接修改，无需打开窗口。', hi:'बाईं ओर प्रकार या टैग से छाँटें। दाईं ओर पुस्तक-जानकारी – और किसी पंक्ति पर क्लिक करते ही उसके फ़ील्ड: वहीं सब बदला जा सकता है, बिना कोई विंडो खोले।', es:'A la izquierda filtras por tipo o etiqueta. A la derecha están los datos del libro y, al hacer clic en una fila, sus campos: todo se cambia ahí sin abrir ninguna ventana.', ar:'على اليسار تُرشّح حسب النوع أو الوسم. وعلى اليمين بيانات الكتاب – وبمجرد النقر على صف تظهر حقوله: ويمكن تغيير كل شيء هناك دون فتح نافذة.', fr:'À gauche, vous filtrez par type ou étiquette. À droite, les données du livre – et dès que vous cliquez une ligne, ses champs : tout se modifie là, sans ouvrir de fenêtre.', bn:'বাঁয়ে ধরন বা ট্যাগ অনুসারে ছাঁকুন। ডানে বইয়ের তথ্য – আর কোনো সারিতে ক্লিক করলেই তার ফিল্ড: সেখানেই সব বদলানো যায়, জানালা না খুলে।', pt:'À esquerda filtra por tipo ou etiqueta. À direita estão os dados do livro – e assim que clica numa linha, os seus campos: tudo se altera ali, sem abrir janelas.', id:'Di kiri Anda menyaring menurut jenis atau tag. Di kanan ada data buku – dan begitu Anda mengklik satu baris, kolomnya muncul: semua bisa diubah di sana tanpa membuka jendela.', ur:'بائیں طرف قسم یا ٹیگ سے چھانٹیں۔ دائیں طرف کتاب کی معلومات – اور کسی قطار پر کلک کرتے ہی اس کے فیلڈ: وہیں سب کچھ بدلا جا سکتا ہے، بغیر کوئی ونڈو کھولے۔' },

    /* --- Freie Akte --- */
    'ak.verwalten':     { de:'Akte verwalten', en:'Manage acts', zh:'管理幕', hi:'अंक प्रबंधित करें', es:'Gestionar actos', ar:'إدارة الفصول', fr:'Gérer les actes', bn:'অঙ্ক পরিচালনা', pt:'Gerir atos', id:'Kelola babak', ur:'ایکٹ منظم کریں' },
    'ak.neuerAkt':      { de:'Neuer Akt', en:'New act', zh:'新建幕', hi:'नया अंक', es:'Nuevo acto', ar:'فصل جديد', fr:'Nouvel acte', bn:'নতুন অঙ্ক', pt:'Novo ato', id:'Babak baru', ur:'نیا ایکٹ' },
    'ak.name':          { de:'Name des Akts', en:'Name of the act', zh:'幕的名称', hi:'अंक का नाम', es:'Nombre del acto', ar:'اسم الفصل', fr:'Nom de l’acte', bn:'অঙ্কের নাম', pt:'Nome do ato', id:'Nama babak', ur:'ایکٹ کا نام' },
    'ak.unter':         { de:'Untertitel (was hier passiert)', en:'Subtitle (what happens here)', zh:'副标题（这里发生什么）', hi:'उपशीर्षक (यहाँ क्या होता है)', es:'Subtítulo (qué ocurre aquí)', ar:'عنوان فرعي (ما يحدث هنا)', fr:'Sous-titre (ce qui s’y passe)', bn:'উপশিরোনাম (এখানে কী ঘটে)', pt:'Subtítulo (o que acontece aqui)', id:'Subjudul (apa yang terjadi)', ur:'ذیلی عنوان (یہاں کیا ہوتا ہے)' },

/* Beschriftungen sind Schlüssel, keine fertigen Texte. textObjekt() und
   uebersetzbar() hängen Eigenschaften an, die bei jedem Zugriff in der
   gerade eingestellten Sprache nachschlagen. Dadurch wechselt jede
   Beschriftung mit, ohne dass irgendwo ein Text zwischengespeichert
   wird – und ohne dass die 40 Stellen, die KINDS lesen, davon wissen. */
function textObjekt(paare){
  const o={};
  Object.entries(paare).forEach(([k,schluessel])=>
    Object.defineProperty(o, k, {get:()=>tx(schluessel), enumerable:true, configurable:true}));
  return o;
}
function uebersetzbar(o, paare){
  Object.entries(paare).forEach(([ziel, quelle])=>{
    if(!o[quelle]) return;
    const schluessel=o[quelle];
    Object.defineProperty(o, ziel, {get:()=>tx(schluessel), enumerable:true, configurable:true});
  });
  return o;
}

/* Für die Ausgabe an eine KI: feste, sprachunabhängige Schlüssel. Würden
   sie mit der Sprache wechseln, verstünde der Wiedereinlesen-Schritt eine
   Datei nicht mehr, die in einer anderen Sprache erzeugt wurde. */
const KI_SCHLUESSEL = {kapitel:"kapitel", folge:"folgen", figur:"figuren", ort:"orte",
  welt:"welt", beat:"handlung", ereignis:"zeitleiste", notiz:"ideen"};

/* ================= EIGENE AUSWAHLOPTIONEN =================
   Erweiterbar sind nur Felder ohne Rechenlogik. Bewusst NICHT erweiterbar:
   CH_STATUS – Fortschritt und Statistik gruppieren über feste Schlüssel, CSS nutzt .st-<key>
   ACTS      – nur noch die Vorgabe; die tatsächlichen Akte stehen in state.akte
   Ein eigener Wert würde dort still falsch weitergerechnet statt zu scheitern. */
const BASE_OPTS = {ROLES, ORT_TYPES, WCATS};
const EXT_LABEL = {ROLES:"op.rolleFigur", ORT_TYPES:"op.artOrt", WCATS:"op.katWelt"};
function optsOf(name){ return Object.assign({}, BASE_OPTS[name], (state.custom&&state.custom[name])||{}); }
function customKey(name, label){
  let k="c_"+String(label).toLowerCase().replace(/[^a-z0-9äöüß]+/g,"_").replace(/^_+|_+$/g,"").slice(0,28);
  if(k==="c_") k="c_"+uid();
  const all=optsOf(name);
  while(all[k]) k+=Math.random().toString(36).slice(2,4);
  return k;
}
/* Legt eine Option an und gibt ihren Schlüssel zurück – null bei Abbruch. */
async function newCustomOpt(name){

  if(!label) return null;

  const dup=Object.keys(all).find(k=>String(all[k]).toLowerCase()===label.toLowerCase());
  if(dup){ toast(tx("op.gibtsSchon", label)); return dup; }
  const k=customKey(name,label);
  state.custom[name]=state.custom[name]||{};
  state.custom[name][k]=label;

/* Baut die Optionsliste eines Selects neu auf, inkl. „Neue Option“-Eintrag. */
function fillSelect(sel, name, selKey){

/* Welche Felder benutzen diese Optionsliste? Wird aus KINDS abgeleitet. */
function extFields(name){
  const out=[];
  Object.entries(KINDS).forEach(([kind,K])=>K.fields.forEach(f=>{ if(f.ext===name) out.push([kind,f.k]); }));

async function renameOpt(name,k){

  if(!v||v===cur) return;
  state.custom[name][k]=v; save(); renderOpts(); renderAll(); toast(tx("op.umbenanntOk"));
}
async function delOpt(name,k){
  if(!state.custom[name]||!state.custom[name][k]) return;
  const label=state.custom[name][k], n=optUsage(name,k);
  const fbKey=Object.keys(BASE_OPTS[name])[0], fbLabel=BASE_OPTS[name][fbKey];
  if(n>0 && !await dlgFrage(tx("op.loeschen"), tx("op.wirdVerwendet", n, label, fbLabel), tx("btn.loeschen"), true)) return;
  if(n>0) extFields(name).forEach(([kind,fk])=>byKind(kind).forEach(i=>{ if(i[fk]===k) i[fk]=fbKey; }));
  delete state.custom[name][k];
  save(); renderOpts(); renderAll(); toast(tx("op.geloescht", label));
}

let state = {book:{title:"",genre:"",premise:"",theme:"",audience:"",targetWords:0,deadline:""}, items:[], plotlines:[], links:[], ordner:[], akte:[], karten:[], bezLage:{}, custom:{},
  minds:[{id:"default", name:"Haupt-Mindmap", nodes:[], edges:[]}], activeMind:"default",
  timelines:[{id:"default", name:""}], activeTl:"default", theme:"dark", pro:false,
  /* Tagesstände des Gesamtwortzahl – Grundlage für den 28-Tage-Verlauf auf der Übersicht */
  history:{}};
function curMind(){
  if(!Array.isArray(state.minds)||!state.minds.length) state.minds=[{id:"default",name:"Haupt-Mindmap",nodes:[],edges:[]}];
  let m=state.minds.find(x=>x.id===state.activeMind)||state.minds[0];
  state.activeMind=m.id; m.nodes=m.nodes||[]; m.edges=m.edges||[];
  return m;
}
/* Kompatibilität: state.mind zeigt immer auf die aktive Mindmap (alte Speicherstände werden beim Laden hineinmigriert) */
Object.defineProperty(state, "mind", {
  enumerable:false, configurable:true,
  get(){ return curMind(); },
  set(v){ const m=curMind(); m.nodes=(v&&v.nodes)||[]; m.edges=(v&&v.edges)||[]; }
});
function ensureTl(){
  if(!Array.isArray(state.timelines)||!state.timelines.length) state.timelines=[{id:"default",name:""}];
  if(!state.timelines.find(t=>t.id===state.activeTl)) state.activeTl=state.timelines[0].id;
}
/* Die erste Zeitleiste trägt keinen eigenen Namen, solange niemand sie
   umbenannt hat – sonst stünde in einer französischen Oberfläche für immer
   „Haupt-Zeitleiste“, weil der Name mit dem Projekt gespeichert wird. */
function tlName(t){ return (t&&t.name)||tx("tl.hauptleiste"); }
function tlOpts(){ ensureTl(); const o={}; state.timelines.forEach(t=>o[t.id]=tlName(t)); return o; }
let view="dash", ws="table", selection=new Set(), editId=null, formKind="kapitel";
let sortKey="added", sortDir=-1, sideFilter=null, subFilter={figur:"",welt:"",ort:""};
/* ---------- SPEICHERN MIT HARTEM FEHLERZUSTAND ----------
   Früher wurde ein Fehlschlag nur getoastet und die App lief weiter – der Nutzer
   arbeitete stundenlang weiter und verlor beim Reload alles. Jetzt bleibt ein
   Banner stehen, bis wieder gespeichert werden kann. */
const SCHEMA = 7;                 /* Datenschema; siehe migriere() */
const ORDNER_TIEFE = 6;           /* mehr Ebenen werden unübersichtlich, nicht technisch verboten */
const STORE_BUDGET = 4800000;     /* nur noch für den Notbetrieb ohne Dateizugriff */
let saveFailed=false, storeWarned=false;
function stateBytes(){ try{ return JSON.stringify(state).length; }catch(e){ return 0; } }

/* ------------------------------------------------------------
   SCHEMA UND MIGRATIONEN
   Jede Datei trägt ihre Schemanummer. Die Kette läuft immer von
   unten nach oben durch, damit auch sehr alte Stände ankommen.
   ------------------------------------------------------------ */
function migriere(d){
  if(!d||typeof d!=="object") return d;
  let v = Number.isFinite(+d.schema) ? +d.schema : 1;
  if(v>SCHEMA) throw new Error(tx("sp.neuereVersion", v));
  if(v<2){
    /* 1 → 2: Welt-Elemente der Kategorie „Ort" wurden eigenständige Orte,
       Einzelbilder wurden zu Bildlisten, Ereignisse brauchen eine Zeitleiste,
       und jeder Eintrag bekommt einen Änderungszeitpunkt. */
    (d.items||[]).forEach(it=>{
      if(it.kind==="welt"&&it.category==="ort"){
        it.kind="ort"; it.orttyp=it.orttyp||"sonstiges";
        if(it.rules&&!it.secrets){ it.secrets=it.rules; delete it.rules; }
        delete it.category;
      }
      if(it.image){ it.images=[it.image].concat(it.images||[]); delete it.image; }
      if(it.kind==="ereignis"&&!it.tl) it.tl="default";
      if(!it.touched&&it.added) it.touched=it.added+"T12:00:00.000Z";
    });
    if(!d.history||typeof d.history!=="object") d.history={};
    v=2;
  }
  if(v<3){
    /* 2 → 3: Beziehungen waren bisher nur Fließtext im Feld „relations".
       Der bleibt unangetastet – niemand soll Geschriebenes verlieren.
       Daneben tritt eine Liste echter Verknüpfungen zwischen Einträgen. */
    if(!Array.isArray(d.links)) d.links=[];
    v=3;
  }
  if(v<4){
    /* 3 → 4: Jede Art hat jetzt eine Zusatzbeschreibung und einen eigenen
       Textplatz. Ältere Dateien haben die Felder schlicht nicht – sie
       bleiben leer, es gibt nichts umzurechnen. Die Nummer steigt
       trotzdem, damit erkennbar bleibt, woher ein Stand kommt. */
    v=4;
  }
  if(v<5){
    /* 4 → 5: Einträge lassen sich in Ordner legen. Ohne Ordner liegt
       alles weiterhin auf der obersten Ebene – genau wie bisher. */
    if(!Array.isArray(d.ordner)) d.ordner=[];
    v=5;
  }
  if(v<6){
    /* 5 → 6: Die Drei-Akt-Struktur war fest eingebaut, jetzt ist sie
       eine Liste im Projekt. Die Kennungen "1", "2", "3" bleiben, damit
       vorhandene Plot-Punkte ohne Umrechnen weiter passen. */
    if(!Array.isArray(d.akte) || !d.akte.length){
      d.akte=[1,2,3].map(n=>({id:String(n), name:tx("akt."+n), sub:tx("akt."+n+".sub"), order:n}));
    }
    v=6;
  }
  if(v<7){
    /* 6 → 7: Karten mit Markierungen. Wer keine anlegt, merkt nichts. */
    if(!Array.isArray(d.karten)) d.karten=[];
    v=7;
  }
  d.schema=SCHEMA;
  return d;
}
/* Hält den Gesamtwortstand je Tag fest. Ein Wert pro Tag genügt: der Verlauf
   zeigt Tagesleistungen, keine Minutenauflösung. Alles älter als ein Jahr fliegt raus. */
function trackWords(){
  if(!state.history||typeof state.history!=="object") state.history={};
  state.history[todayStr()]=totalWords();
  const keys=Object.keys(state.history);
  if(keys.length>400){
    const cut=keys.sort().slice(0, keys.length-400);
    cut.forEach(k=>delete state.history[k]);
  }
}
/* ============================================================
   SPEICHERUNG
   Ein Projekt ist eine Datei auf der Platte. Der Browserspeicher
   dient nur noch als Notbetrieb, wenn die App ohne Electron
   geöffnet wird – dort gilt weiter der alte Größendeckel.

   save() wird an hundert Stellen aufgerufen und darf deshalb
   nichts Teures tun: es merkt sich nur, dass sich etwas geändert
   hat, und stößt das eigentliche Schreiben verzögert an.
   ============================================================ */
const DATEI = (window.sluuw && window.sluuw.datei) || null;
let projektDatei=null;         /* Pfad der offenen Datei, null = noch nie gespeichert */
let ungesichert=false;         /* seit dem letzten Schreiben geändert? */
let schreibtGerade=false, erneutSchreiben=false, autoTimer=null;
let anhangCache=null;          /* eingebettete Anhänge; wird nur bei Bedarf neu gelesen */

function anhangCacheVerwerfen(){ anhangCache=null; }

/* Baut den Datenstand, der in die Datei geht – inklusive der Anhänge,
   damit eine .story-Datei auf einem anderen Rechner vollständig ist. */
async function projektNutzlast(mitAnhaengen){
  const daten=JSON.parse(JSON.stringify(state));
  daten.schema=SCHEMA;
  if(mitAnhaengen===false) return daten;
  if(anhangCache===null){
    const blobs={};
    for(const it of state.items){
      for(const f of (it.files||[])){
        if(f.type!=="file") continue;
        try{ const b=await idbGet(f.id); if(b) blobs[f.id]=await blobToDataURL(b); }catch(e){}
      }
    }
    anhangCache=blobs;
  }
  if(Object.keys(anhangCache).length) daten._files=anhangCache;
  return daten;
}

function markiereGeaendert(){
  ungesichert=true;
  if(typeof renderTitlebar==="function") renderTitlebar();
}

/* Der übliche Aufruf aus der Oberfläche: merken und verzögert schreiben. */
function save(){
  try{ trackWords(); }catch(e){}
  merkeSchritt();
  markiereGeaendert();
  clearTimeout(autoTimer);
  autoTimer=setTimeout(()=>{ schreibeStill(); }, 1500);
}
const speichern=save;   /* Name, den das Rückgängig-Modul benutzt */

/* Automatisches Schreiben im Hintergrund – ohne Dialog, ohne Toast. */
async function schreibeStill(){
  if(!ungesichert) return;
  if(schreibtGerade){ erneutSchreiben=true; return; }
  schreibtGerade=true;
  try{
    if(DATEI){
      const daten=await projektNutzlast(true);
      const r = projektDatei
        ? await DATEI.speichern(daten, false, state.book.title)
        : await DATEI.entwurfSchreiben(daten);     /* noch keine Datei: Entwurf sichern */
      if(r&&r.ok&&r.datei) bibDaten.geladen=false;
      if(r&&r.ok){ nachErfolg(r); }
      else if(r&&!r.abgebrochen){ nachFehler(r.fehler); }
    } else {
      speichereImBrowser();
    }
  }catch(e){ nachFehler(e&&e.message); }
  finally{
    schreibtGerade=false;
    if(erneutSchreiben){ erneutSchreiben=false; schreibeStill(); }
  }
}

function nachErfolg(r){
  if(r&&r.datei) projektDatei=r.datei;
  ungesichert=false; lastSavedAt=new Date();
  if(saveFailed){ saveFailed=false; renderSaveBanner(); toast(tx("sp.wiederOk")); }
  if(typeof renderTitlebar==="function") renderTitlebar();
}
function nachFehler(msg){
  if(!saveFailed){
    saveFailed=true; renderSaveBanner();
    if(window.sluuw&&window.sluuw.app) window.sluuw.app.protokolliere("Speichern fehlgeschlagen: "+msg);
  }
  if(typeof renderTitlebar==="function") renderTitlebar();
}

/* Notbetrieb ohne Dateizugriff (App im Browser geöffnet) */
function speichereImBrowser(){
  let s;
  try{ s=JSON.stringify(Object.assign({schema:SCHEMA}, state)); }catch(e){ return; }
  try{
    localStorage.setItem("sluuw", s);
    nachErfolg(null);
    if(s.length>STORE_BUDGET*0.8){
      if(!storeWarned){ storeWarned=true; toast("⚠️ "+tx("sp.speicherVoll", Math.round(s.length/STORE_BUDGET*100))); }
    } else if(s.length<STORE_BUDGET*0.7) storeWarned=false;
  }catch(e){ nachFehler("Browserspeicher voll"); }
}

/* Ausdrücklich speichern – Strg+S beziehungsweise Menü.
   Ein noch nie gespeichertes Projekt wandert ohne Dialog in den
   Geschichten-Ordner: „in der App speichern" soll nicht bedeuten,
   dass man erst einen Ort aussuchen muss. Wer einen anderen Ort
   will, nimmt „Speichern unter". */
async function speichereJetzt(speichernUnter){
  clearTimeout(autoTimer);
  if(!DATEI){ speichereImBrowser(); toast(tx("sp.imBrowser")); return true; }
  const daten=await projektNutzlast(true);
  const r = (!projektDatei && !speichernUnter && BIB)
    ? await BIB.speichern(daten, state.book.title)
    : await DATEI.speichern(daten, !!speichernUnter, state.book.title);
  if(r&&r.ok){
    nachErfolg(r); zuletztListe=r.zuletzt||zuletztListe;
    bibDaten.geladen=false;                    // die Übersicht ist jetzt veraltet
    toast("Gespeichert: "+dateiName(r.datei)+" 💾");
    renderAll();
    return true;
  }
  if(r&&r.abgebrochen) return false;
  nachFehler(r&&r.fehler);
  await dlgInfo(tx("sp.fehlge"), (r&&r.fehler)||tx("ki.unbekannt"));
  return false;
}

function dateiName(p){ return String(p||"").split(/[\\/]/).pop()||"Unbenannt.story"; }

function renderSaveBanner(){
  const b=$("saveBanner"); if(!b) return;
  b.classList.toggle("show", saveFailed);
  if(saveFailed) b.innerHTML=`<div class="grow"><b>${esc(tx("sp.bannerTitel"))}</b> ${esc(tx("sp.bannerText"))}</div>
    <button onclick="speichereJetzt(true)">${esc(tx("pm.speichernUnter"))}</button>
    <button onclick="schreibeStill()">${esc(tx("sp.erneut"))}</button>`;
}

/* ------------------------------------------------------------
   PROJEKT ÖFFNEN, ANLEGEN, ÜBERNEHMEN
   ------------------------------------------------------------ */
let zuletztListe=[];

function zustandUebernehmen(roh, datei){
  const sauber=sauberProjekt(migriere(roh));
  const anhaenge=sauber._files; delete sauber._files;
  undoGesperrt=true;
  try{
    Object.keys(sauber).forEach(k=>{ if(k!=="mind") state[k]=sauber[k]; });
    ensureTl(); curMind(); suchIndexLeeren();
  } finally { undoGesperrt=false; }
  anhangCache = anhaenge || {};
  if(anhaenge) Object.entries(anhaenge).forEach(([k,v])=>{ try{ idbPut(k, dataURLToBlob(v)); }catch(e){} });

}

async function projektOeffnen(pfad){

/* ------------------------------------------------------------
   START
   Reihenfolge: zuletzt geöffnete Datei → liegengebliebener
   Entwurf → Altbestand aus dem Browserspeicher → leeres Projekt.
   ------------------------------------------------------------ */
async function load(){
  if(!DATEI){ ladeAusBrowser(); return; }

  try{ const r=await DATEI.zuletzt(); zuletztListe=(r&&r.zuletzt)||[]; }catch(e){}

  // 1) Entwurf, der beim letzten Mal nicht in eine Datei gewandert ist
  try{
    const r=await DATEI.entwurfLesen();
    if(r&&r.ok&&r.daten&&Array.isArray(r.daten.items)&&r.daten.items.length){
      zustandUebernehmen(r.daten, null);
      ungesichert=true;
      setTimeout(()=>toast(tx("sp.wiederher")), 500);
      return;
    }
  }catch(e){}

  // 2) Zuletzt geöffnete Datei
  if(zuletztListe.length){
    const r=await DATEI.oeffnen(zuletztListe[0].file);
    if(r&&r.ok){
      try{ zustandUebernehmen(r.daten, r.datei); return; }catch(e){}
    }
  }

  // 3) Altbestand aus dem Browserspeicher übernehmen (Umzug von der Vorgängerfassung)
  if(ladeAusBrowser(true)){
    setTimeout(async ()=>{
      await dlgInfo(tx("sp.uebernommen"), tx("sp.uebernommenT"));
      ungesichert=true; renderTitlebar();
    }, 700);
    return;
  }

  // 4) Leer starten – dann ist die Bibliothek der sinnvollste erste Blick
  ensureTl(); curMind(); merkeSchritt();
  if(BIB){ view="bibliothek"; renderAll(); }
}

function ladeAusBrowser(nurWennVorhanden){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem("sluuw")||localStorage.getItem("storyplaner")); }catch(e){}
  if(!d||!Array.isArray(d.items)||(nurWennVorhanden&&!d.items.length&&!(d.book&&d.book.title))){
    ensureTl(); curMind(); merkeSchritt();
    return false;
  }
  try{ zustandUebernehmen(d, null); }
  catch(e){ ensureTl(); curMind(); merkeSchritt(); return false; }
  return true;
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Für Werte, die in einem Ereignis-Attribut INNERHALB einer
   JavaScript-Zeichenkette landen, etwa onclick="f('HIER')".
   esc() allein genügt dort nicht: es macht aus ' ein &#39;, und der
   HTML-Parser wandelt das wieder in ein ' zurück, BEVOR der Browser
   den JavaScript-Ausdruck übersetzt. Ein Anführungszeichen im Wert
   beendet also die Zeichenkette, und was dahinter steht, wird
   ausgeführt. Ein Merkmal oder ein Optionsschlüssel aus einer fremden
   .story-Datei reichte dafür aus.
   Deshalb erst für JavaScript maskieren, dann für HTML. */
function attrJs(v){
  return esc(String(v??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/[\r\n\u2028\u2029]/g," "));
}

/* Ein Klick auf den Hintergrund schließt das Fenster – aber nur, wenn er
   dort auch begonnen hat. Wer in einem Textfeld zu markieren anfängt und
   die Maus dabei über den Rand zieht, erzeugt beim Loslassen ein "click"
   auf dem gemeinsamen Elternelement, also auf dem Hintergrund. Genau das
   ließ die Bearbeitungsansicht mitten im Markieren verschwinden. */
function hintergrundKlick(ov, fn){
  let start=null;
  ov.addEventListener("mousedown", e=>{ start=e.target; });
  ov.addEventListener("click", e=>{
    const begonnenAuf=start; start=null;
    if(e.target===ov && begonnenAuf===ov) fn(e);
  });
}
/* Freitext in Absätze zerlegen: Leerzeilen trennen, einfache Umbrüche
   bleiben Umbrüche. Der Text wird vorher maskiert – hier entsteht das
   einzige HTML, das aus einem Eingabefeld stammt. */
function absaetze(text){
  return String(text??"").split(/\n\s*\n/).map(a=>a.trim()).filter(Boolean)
    .map(a=>`<p>${esc(a).split("\n").join("<br>")}</p>`).join("") || "";
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>new Date().toISOString().slice(0,10);
const nowIso=()=>new Date().toISOString();
const byKind=k=>state.items.filter(i=>i.kind===k);
/* Zeitstempel der letzten Änderung – speist die Liste „Letzte Änderungen“ */
function touch(id){ const it=state.items.find(x=>x.id===id); if(it) it.touched=nowIso(); }
function touchTime(it){
  const t=Date.parse(it.touched||"");
  if(!isNaN(t)) return t;
  const a=Date.parse((it.added||"")+"T12:00:00");
  return isNaN(a)?0:a;
}
/* Zahlen und Datumsangaben folgen der gewählten Sprache, nicht fest de-DE */
const gebiet = () => (typeof sprache!=="undefined"?sprache:"en");
const zahl = n => Number(n||0).toLocaleString(gebiet());

/* „vor 12 Min.“, „gestern“, „vor 3 Tagen“ – knapp und ohne Bibliothek */
function agoStr(ms){
  if(!ms) return "";
  const diff=Date.now()-ms, min=Math.round(diff/60000);
  if(min<1) return tx("zeit.geradeEben");
  if(min<60) return tx("zeit.vorMin", min);
  const startToday=new Date(); startToday.setHours(0,0,0,0);
  const dayDiff=Math.floor((startToday-new Date(ms).setHours(0,0,0,0))/86400000);
  if(dayDiff<=0) return tx("zeit.vorStd", Math.round(min/60));
  if(dayDiff===1) return tx("zeit.gestern");
  if(dayDiff<7) return tx("zeit.vorTagen", dayDiff);
  return new Date(ms).toLocaleDateString(gebiet(),{day:"2-digit",month:"2-digit",year:"2-digit"});
}
/* ============================================================
   SICHERHEIT
   Alles, was aus einer importierten Datei stammen kann, wird
   hier gefiltert, bevor es in HTML landet. Escapen allein
   genügt bei Adressen und Farben nicht – dort wird nicht
   maskiert, sondern gegen eine erlaubte Form geprüft.
   ============================================================ */
const BILD_MUSTER = /^data:image\/(png|jpeg|jpg|gif|webp|avif);base64,[A-Za-z0-9+/=]*$/i;
function safeSrc(u){
  const s=String(u||"").replace(/\s+/g,"");
  if(BILD_MUSTER.test(s)) return s;
  if(/^blob:[a-z0-9+.\-]+:\/\/[^"'<>\\\s]+$/i.test(s)) return s;
  return "";
}
const MEDIEN_MUSTER=/^data:(audio|video)\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]*$/i;
function safeMedia(u){
  const s=String(u||"").replace(/\s+/g,"");
  if(MEDIEN_MUSTER.test(s)||/^blob:[a-z0-9+.\-]+:\/\/[^"'<>\\\s]+$/i.test(s)) return s;
  return "";
}
/* Farben kommen aus Handlungssträngen und Mindmap-Knoten und landen in style-Attributen */
function safeColor(c){
  const s=String(c||"").trim();
  if(/^#[0-9a-f]{3,8}$/i.test(s)) return s;
  if(/^var\(--[a-z0-9-]+\)$/i.test(s)) return s;
  if(/^rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(,\s*[\d.]+\s*)?\)$/i.test(s)) return s;
  return "var(--accent)";
}
const GRENZE_TEXT=200000, GRENZE_KURZ=500, GRENZE_TAGS=60;
function sauberText(v, max){
  /* Zahlen und Wahrheitswerte werden zu Text statt verworfen zu werden.
     Der Akt eines Plot-Punktes wird zum Beispiel als Zahl gespeichert
     (das Board schreibt beim Ziehen einer Karte +act hinein). Wurden
     die hier weggeworfen, stand danach ein leerer Akt im Eintrag – und
     das Board zeigt nur die Akte 1 bis 3, also verschwand die Karte
     beim nächsten Öffnen des Projekts spurlos. */
  if(typeof v==="number") v=Number.isFinite(v)?String(v):"";
  else if(typeof v==="boolean") v=String(v);
  if(typeof v!=="string") return "";
  // Steuerzeichen raus, Länge deckeln – schützt Anzeige und Dateigröße
  return v.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,"").slice(0, max||GRENZE_KURZ);
}
/* Ein importierter Eintrag wird neu aufgebaut statt übernommen: nur bekannte
   Felder der jeweiligen Art überleben, alles andere fällt weg. */
function sauberEintrag(roh){
  if(!roh||typeof roh!=="object") return null;
  const art=KINDS[roh.kind]; if(!art) return null;
  const neu={kind:roh.kind};
  art.fields.forEach(f=>{
    const v=roh[f.k];
    if(f.t==="number") neu[f.k]=Number.isFinite(+v)?Math.max(-1e9,Math.min(1e9,+v)):0;
    else if(f.t==="tags") neu[f.k]=Array.isArray(v)?v.map(t=>sauberText(t,GRENZE_TAGS)).filter(Boolean).slice(0,40):[];
    else if(f.t==="image") neu[f.k]=Array.isArray(v)?v.map(safeSrc).filter(Boolean).slice(0,30):[];
    else if(f.t==="textarea") neu[f.k]=sauberText(v, GRENZE_TEXT);
    else neu[f.k]=sauberText(v, GRENZE_KURZ);
  });
  neu.id=sauberText(roh.id,40)||uid();
  /* Ordnerzugehörigkeit ist kein Formularfeld, gehört aber zum Eintrag.
     Ein Verweis auf einen gelöschten Ordner wird beim Laden geräumt. */
  neu.folder=sauberText(roh.folder,40);
  neu.added=/^\d{4}-\d{2}-\d{2}$/.test(roh.added)?roh.added:todayStr();
  neu.touched=/^\d{4}-\d{2}-\d{2}T[\d:.]+Z?$/.test(roh.touched)?roh.touched:undefined;
  neu.order=Number.isFinite(+roh.order)?+roh.order:0;
  // Freie Felder, die kein Formularfeld sind, aber gebraucht werden
  if(Array.isArray(roh.steps)) neu.steps=roh.steps.slice(0,300).map(s=>({
    id:sauberText(s&&s.id,40)||uid(), text:sauberText(s&&s.text,GRENZE_KURZ), done:!!(s&&s.done)}));
  if(Array.isArray(roh.files)) neu.files=roh.files.slice(0,200).map(f=>({
    id:sauberText(f&&f.id,60), name:sauberText(f&&f.name,GRENZE_KURZ),
    mime:sauberText(f&&f.mime,120), size:Number.isFinite(+(f&&f.size))?+f.size:0,
    type:(f&&f.type)==="file"?"file":"bild", img:f&&f.img?safeSrc(f.img):undefined
  })).filter(f=>f.id);
  return neu;
}
function sauberProjekt(roh){
  if(!roh||typeof roh!=="object"||!Array.isArray(roh.items)) throw new Error(tx("sp.keinProjekt"));
  const b=roh.book&&typeof roh.book==="object"?roh.book:{};
  const out={
    schema:SCHEMA,
    book:{
      title:sauberText(b.title,GRENZE_KURZ), genre:sauberText(b.genre,GRENZE_KURZ),
      premise:sauberText(b.premise,GRENZE_TEXT), theme:sauberText(b.theme,GRENZE_KURZ),
      audience:sauberText(b.audience,GRENZE_KURZ), deadline:sauberText(b.deadline,40),
      targetWords:Number.isFinite(+b.targetWords)?Math.max(0,+b.targetWords):0
    },
    items:roh.items.slice(0,20000).map(sauberEintrag).filter(Boolean),
    /* Verknüpfungen zwischen Einträgen. Auf Ziele, die es nicht mehr gibt,
       wird weiter unten geprüft – hier wird erst einmal nur gesäubert. */
    links:(Array.isArray(roh.links)?roh.links:[]).slice(0,20000).map(l=>({
      id:sauberText(l&&l.id,40)||uid(),
      von:sauberText(l&&l.von,40),
      zu:sauberText(l&&l.zu,40),
      text:sauberText(l&&l.text,GRENZE_KURZ),
      beidseitig:!!(l&&l.beidseitig)
    })).filter(l=>l.von&&l.zu&&l.von!==l.zu),
    plotlines:(Array.isArray(roh.plotlines)?roh.plotlines:[]).slice(0,100).map(p=>({
      id:sauberText(p&&p.id,40)||uid(), name:sauberText(p&&p.name,GRENZE_KURZ), color:safeColor(p&&p.color)})),
    /* Die Bildquelle wird wie überall durch safeSrc geführt: eine
       fremde Datei darf keine beliebige Adresse einschleusen. */
    karten:(Array.isArray(roh.karten)?roh.karten:[]).slice(0,200).map(k=>({
      id:sauberText(k&&k.id,40)||uid(), name:sauberText(k&&k.name,GRENZE_KURZ),
      bild:k&&k.bild?safeSrc(k.bild):undefined,
      pins:(Array.isArray(k&&k.pins)?k.pins:[]).slice(0,500).map(p=>({
        id:sauberText(p&&p.id,40)||uid(), text:sauberText(p&&p.text,GRENZE_KURZ),
        x:Math.max(0,Math.min(100,+((p&&p.x)||0)||0)), y:Math.max(0,Math.min(100,+((p&&p.y)||0)||0)),
        ziel:p&&p.ziel?sauberText(p.ziel,40):undefined,
        karte:p&&p.karte?sauberText(p.karte,40):undefined,
        farbe:safeColor(p&&p.farbe)}))
    })),
    /* Wo die Punkte im Netz und im Stammbaum liegen. Wer sein Netz
       einmal geordnet hat, findet es beim nächsten Öffnen wieder. */
    bezLage:(function(b){
      if(!b||typeof b!=="object") return {};
      const aus={};
      ["netz","stamm"].forEach(k=>{
        if(!b[k]||typeof b[k]!=="object") return;
        aus[k]={};
        Object.entries(b[k]).slice(0,2000).forEach(([id,p])=>{
          if(!p||typeof p!=="object") return;
          aus[k][sauberText(id,40)]={x:+p.x||0, y:+p.y||0};
        });
      });
      return aus;
    })(roh.bezLage),
    akte:(Array.isArray(roh.akte)?roh.akte:[]).slice(0,60).map((a,i)=>({
      id:sauberText(a&&a.id,40)||uid(), name:sauberText(a&&a.name,GRENZE_KURZ),
      sub:sauberText(a&&a.sub,GRENZE_KURZ), order:Number.isFinite(+(a&&a.order))?+a.order:i+1})),
    ordner:(Array.isArray(roh.ordner)?roh.ordner:[]).slice(0,2000).map(o=>({
      id:sauberText(o&&o.id,40)||uid(), name:sauberText(o&&o.name,GRENZE_KURZ),
      parent:sauberText(o&&o.parent,40), order:Number.isFinite(+(o&&o.order))?+o.order:0})),
    timelines:(Array.isArray(roh.timelines)?roh.timelines:[]).slice(0,100).map(t=>({
      id:sauberText(t&&t.id,40)||uid(), name:sauberText(t&&t.name,GRENZE_KURZ), scope:t&&t.scope?sauberText(t.scope,40):undefined})),
    minds:(Array.isArray(roh.minds)?roh.minds:[]).slice(0,100).map(m=>({
      id:sauberText(m&&m.id,40)||uid(), name:sauberText(m&&m.name,GRENZE_KURZ), scope:m&&m.scope?sauberText(m.scope,40):undefined,
      /* link und video standen bisher nicht in dieser Liste – beim
         Speichern und Wiederöffnen gingen die Verknüpfung eines Knotens
         zu seinem Eintrag und das angehängte Video also verloren. */
      nodes:(Array.isArray(m&&m.nodes)?m.nodes:[]).slice(0,3000).map(n=>({
        id:sauberText(n&&n.id,40)||uid(), text:sauberText(n&&n.text,GRENZE_KURZ),
        x:+((n&&n.x)||0)||0, y:+((n&&n.y)||0)||0, color:safeColor(n&&n.color),
        typ:MM_ARTEN.includes(n&&n.typ)&&n.typ!=="knoten"?n.typ:undefined,
        link:n&&n.link?sauberText(n.link,40):undefined,
        video:n&&n.video?sauberText(n.video,60):undefined,
        ref:n&&n.ref?sauberText(n.ref,40):undefined,
        img:n&&n.img?safeSrc(n.img):undefined, vid:n&&n.vid?sauberText(n.vid,60):undefined})),
      edges:(Array.isArray(m&&m.edges)?m.edges:[]).slice(0,6000).map(e=>({
        a:sauberText(e&&e.a,40), b:sauberText(e&&e.b,40)})).filter(e=>e.a&&e.b)
    })),
    activeMind:sauberText(roh.activeMind,40)||"default",
    activeTl:sauberText(roh.activeTl,40)||"default",
    custom:{}, history:{},
    theme:roh.theme==="light"?"light":"dark",
    pro:!!roh.pro
  };
  if(roh.custom&&typeof roh.custom==="object") Object.keys(BASE_OPTS).forEach(nm=>{
    const q=roh.custom[nm];
    if(q&&typeof q==="object"){ out.custom[nm]={};
      Object.keys(q).slice(0,200).forEach(k=>{ out.custom[nm][sauberText(k,60)]=sauberText(q[k],GRENZE_KURZ); }); }
  });
  if(roh.history&&typeof roh.history==="object") Object.keys(roh.history).slice(-400).forEach(k=>{
    if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isFinite(+roh.history[k])) out.history[k]=Math.max(0,+roh.history[k]);
  });
  /* Eine Verknüpfung auf einen gelöschten Eintrag zeigt ins Leere und
     würde auf der Detailseite als Karte ohne Namen erscheinen. */
  const vorhanden=new Set(out.items.map(i=>i.id));
  out.links=out.links.filter(l=>vorhanden.has(l.von)&&vorhanden.has(l.zu));

  if(!out.minds.length) out.minds=[{id:"default",name:"Haupt-Mindmap",nodes:[],edges:[]}];
  if(!out.timelines.length) out.timelines=[{id:"default",name:""}];
  if(roh._files&&typeof roh._files==="object") out._files=roh._files;
  return out;
}

/* ============================================================
   EIGENE DIALOGE
   Ersetzen alert/confirm/prompt. Die Systemdialoge blockieren
   den ganzen Prozess, lassen sich nicht gestalten und sehen in
   einem rahmenlosen Fenster fremd aus.
   ============================================================ */
let dlgOffen=null;
function dlg({titel, text, felder, knoepfe}){
  return new Promise(res=>{
    const ov=document.createElement("div");
    ov.className="overlay show dlgOverlay";
    const feldHtml=(felder||[]).map((f,i)=>{
      /* Auswahlfelder brauchen ein <select>; ein Textfeld täte es zwar auch,
         aber dann müsste man Namen abtippen und könnte sich vertippen. */
      const inner = f.auswahl
        ? `<select class="dlgInput" data-i="${i}">${f.auswahl.map(o=>
            `<option value="${esc(o.wert)}"${String(o.wert)===String(f.value||"")?" selected":""}>${esc(o.text)}</option>`).join("")}</select>`
        : `<input class="dlgInput" data-i="${i}" type="text" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}">`;
      return `<label class="dlgLabel">${esc(f.label||"")}${inner}</label>`;
    }).join("");
    ov.innerHTML=`<div class="modal dlgModal" role="dialog" aria-modal="true">
      <h2>${esc(titel||"")}</h2>
      ${text?`<p class="dlgText">${esc(text)}</p>`:""}
      ${feldHtml}
      <div class="modalBtns">${(knoepfe||[{t:"OK",w:true}]).map((b,i)=>
        `<button class="btn ${b.gefahr?"danger":(b.w?"primary":"")}" data-b="${i}">${esc(b.t)}</button>`).join("")}</div>
    </div>`;
    const fertig=wert=>{ ov.remove(); dlgOffen=null; document.removeEventListener("keydown",tasten,true); res(wert); };
    const werte=()=>[...ov.querySelectorAll(".dlgInput")].map(i=>i.value);
    const tasten=e=>{
      if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); fertig(null); }
      if(e.key==="Enter"&&!e.shiftKey&&(felder||[]).length){ e.preventDefault(); e.stopPropagation();
        const w=(knoepfe||[]).findIndex(b=>b.w); fertig({knopf:w<0?0:w, werte:werte()}); }
      if(e.key==="Tab"){ // Fokus bleibt im Dialog
        const f=[...ov.querySelectorAll("input,button")];
        if(!f.length) return;
        const erst=f[0], letzt=f[f.length-1];
        if(e.shiftKey&&document.activeElement===erst){ e.preventDefault(); letzt.focus(); }

/* ============================================================
   RÜCKGÄNGIG UND WIEDERHERSTELLEN
   Es wird der ganze Datenstand gesichert, nicht einzelne
   Aktionen. Das ist speicherhungriger, aber unmöglich
   inkonsistent – bei einem Manuskript ist das die richtige
   Abwägung. Bilder werden dabei ausgespart.
   ============================================================ */
const UNDO_TIEFE=60;
let undoStapel=[], redoStapel=[], undoGesperrt=false;
function zustandAbbild(){
  return JSON.stringify(state, (k,v)=> k==="images"&&Array.isArray(v) ? {__b:v.length?v:0} : v);
}
function merkeSchritt(){
  if(undoGesperrt) return;
  try{
    const a=zustandAbbild();
    if(undoStapel.length && undoStapel[undoStapel.length-1].a===a) return;
    undoStapel.push({a, bilder:bilderSammeln()});
    if(undoStapel.length>UNDO_TIEFE) undoStapel.shift();
    redoStapel.length=0;
  }catch(e){}
}
function bilderSammeln(){
  const m={}; state.items.forEach(it=>{ if(Array.isArray(it.images)&&it.images.length) m[it.id]=it.images.slice(); });
  return m;
}
function abbildAnwenden(eintrag){
  const roh=JSON.parse(eintrag.a);
  roh.items.forEach(it=>{ it.images = eintrag.bilder[it.id] ? eintrag.bilder[it.id].slice() : []; });
  undoGesperrt=true;
  try{
    Object.keys(roh).forEach(k=>{ if(k!=="mind") state[k]=roh[k]; });
    ensureTl(); curMind(); suchIndexLeeren();
    speichern(); renderAll();
  } finally { undoGesperrt=false; }
}
function rueckgaengig(){
  if(undoStapel.length<2){ toast(tx("sp.nichtsRueck")); return; }
  redoStapel.push(undoStapel.pop());
  abbildAnwenden(undoStapel[undoStapel.length-1]);
  toast(tx("sp.rueckgemacht"));
}
function wiederherstellen(){
  if(!redoStapel.length){ toast("Nichts wiederherzustellen."); return; }
  const e=redoStapel.pop();
  undoStapel.push(e);
  abbildAnwenden(e);
  toast("Wiederhergestellt ↷");
}

/* Gesamtwortstand der letzten n Tage, Lücken werden mit dem letzten bekannten Wert gefüllt */
function wordSeries(days){
  const h=state.history||{}, keys=Object.keys(h).sort();
  const out=[], today=new Date(); today.setHours(12,0,0,0);
  let carry=null;
  for(let i=days-1;i>=0;i--){
    const d=new Date(today.getTime()-i*86400000).toISOString().slice(0,10);
    if(h[d]!==undefined) carry=h[d];
    else if(carry===null){ const prev=keys.filter(k=>k<d).pop(); if(prev!==undefined) carry=h[prev]; }
    out.push({date:d, total:carry===null?null:carry});
  }
  return out;
}

function shrinkImage(file, cb, MAX){
  if(!file) return;
  MAX=MAX||640;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const sc=Math.min(1, MAX/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        cb(cv.toDataURL("image/jpeg",0.78));
      }catch(e){ cb(r.result); }
    };
    img.onerror=()=>toast(tx("fm.bildFehler"));
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

/* ---------- SUCHE ----------
   Früher wurde bei jedem Tastendruck jedes Feld jedes Eintrags neu zu einem
   String zusammengesetzt. Jetzt liegt dieser Text je Eintrag im Zwischen-
   speicher und wird erst neu gebaut, wenn sich der Eintrag geändert hat. */
const suchIndex=new Map();
function suchIndexLeeren(){ suchIndex.clear(); }
function suchText(it){
  const c=suchIndex.get(it.id);
  if(c && c.t===it.touched) return c.s;
  const s=Object.entries(it).map(([k,v])=>
    ["image","images","files","id","kind","order","added","touched"].includes(k) ? ""
    : (Array.isArray(v) ? v.map(x=>typeof x==="string"?x:(x&&x.text)||"").join(" ")
    : (typeof v==="string" ? v : ""))
  ).join(" ").toLowerCase();
  suchIndex.set(it.id,{t:it.touched, s});
  return s;
}
function matches(it, q){
  if(!q) return true;
  return suchText(it).includes(String(q).toLowerCase());
