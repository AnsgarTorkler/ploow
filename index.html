async function download(name, content, mime){
  if(DATEI){
    const endung="."+((name.split(".").pop())||"txt");
    const r=await DATEI.exportieren(content, name.replace(/\.[^.]*$/,""), endung, mime);
    if(r&&r.ok) toast("Gespeichert: "+dateiName(r.datei));
    else if(r&&!r.abgebrochen) toast("Export fehlgeschlagen.");
    return;
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:mime})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
/* ---------- VOLLSTÄNDIGES BACKUP ----------
   Angehängte Dateien liegen als Blob in IndexedDB und fehlten früher im JSON-Export.
   Sie werden jetzt als Data-URL eingebettet; exportJSON(false) liefert die schlanke
   Variante ohne Anhänge (für den Notfall bei vollem Speicher). */
const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
function dataURLToBlob(d){
  const i=String(d).indexOf(",");
  const mime=(String(d).slice(0,i).match(/:(.*?);/)||[])[1]||"application/octet-stream";
  const bin=atob(String(d).slice(i+1)), u=new Uint8Array(bin.length);
  for(let j=0;j<bin.length;j++) u[j]=bin.charCodeAt(j);
  return new Blob([u],{type:mime});
}
async function exportJSON(withFiles){
  const data=JSON.parse(JSON.stringify(state));
  let n=0;
  if(withFiles!==false){
    const blobs={};
    for(const it of state.items){
      for(const f of (it.files||[])){
        if(f.type!=="file") continue;
        try{ const b=await idbGet(f.id); if(b){ blobs[f.id]=await blobToDataURL(b); n++; } }catch(e){}
      }
    }
    if(n) data._files=blobs;
  }
  const txt=JSON.stringify(data,null,2), mb=txt.length/1048576;
  if(mb>60 && !await dlgFrage(tx("ex.grosseSicherung"),
      tx("ex.grosseSicherungT", Math.round(mb), n), tx("ex.trotzdem"))) return;
  await download((state.book.title||PRODUKT.toLowerCase())+"-sicherung.json", txt, "application/json");
  toast(tx("ex.backupFertig")+(n?" · "+tx("ex.mitDateien", n):(withFiles===false?" · "+tx("ex.ohneAnhaenge"):"")));
}
/* ---------- EXPOSÉ ALS MARKDOWN ----------
   Die Überschriften kommen aus KINDS, nicht aus einer zweiten Liste im
   Code: dadurch stehen sie in der eingestellten Sprache, und ein neues
   Feld taucht ohne Zutun im Exposé auf. */
function exportMarkdown(){
  const b=state.book, L=[];
  const zeile=(k,v)=>{ if(v) L.push("**"+k+":** "+v); };

  L.push("# "+(b.title||tx("ki.buchprojekt")));
  zeile(tx("feld.genre"), b.genre);
  zeile(tx("feld.zielgruppe"), b.audience);
  zeile(tx("bf.thema"), b.theme);
  if(b.premise) L.push("\n> "+String(b.premise).replace(/\n/g,"\n> "));
  L.push("\n**"+tx("ls.woerter")+":** "+zahl(totalWords())+
         (b.targetWords?" / "+tx("feld.wortziel")+": "+zahl(+b.targetWords):""));

  /* Ein Eintrag: Name als Überschrift, das erste lange Feld als Fließtext,
     alles Übrige als beschriftete Zeile. Leere Felder fallen weg. */
  const eintrag=(it, ueberschrift)=>{
    const K=KINDS[it.kind];
    L.push("\n"+ueberschrift);
    K.fields.forEach(f=>{
      if(f.k===K.nameField || f.t==="image") return;
      let v=it[f.k];
      if(v===undefined||v===null||v==="") return;
      if(f.t==="tags"){ if(!v.length) return; L.push(v.map(t=>"#"+t).join(" ")); return; }
      if(f.t==="select"||f.t==="selectDyn"){ v=f.opts()[v]||v; if(!v) return; }
      if(f.t==="number"){ if(!+v) return; v=zahl(+v); }
      if(f.k==="langtext"){ L.push("\n_"+f.l+"_\n"); L.push(String(v)); return; }
      L.push("**"+f.l.replace(" *","")+":** "+String(v).replace(/\n/g, " "));
    });
    (it.steps||[]).forEach(s=>L.push("- ["+(s.done?"x":" ")+"] "+s.text));
  };

  Object.entries(KINDS).forEach(([art,K])=>{
    const liste=byKind(art).sort((x,y)=>(x.order||0)-(y.order||0));
    if(!liste.length) return;
    L.push("\n## "+K.icon+" "+K.plural);
    if(art==="beat"){
      akteListe().forEach(akt=>{
        const bs=beatsVonAkt(akt.id, liste); if(!bs.length) return;
        L.push("\n### "+akt.name);
        bs.forEach(it=>eintrag(it, "#### "+itemName(it)));
      });
      return;
    }
    if(art==="ereignis"){
      ensureTl();
      state.timelines.forEach(t=>{
        const list=liste.filter(e=>(e.tl||"default")===t.id); if(!list.length) return;
        L.push("\n### "+tlName(t));
        list.forEach(it=>eintrag(it, "#### "+(it.date||"?")+" – "+itemName(it)));
      });
      return;
    }
    liste.forEach((it,i)=>eintrag(it, "### "+(K.nameField==="title"&&(art==="kapitel"||art==="folge")?(it.nummer||i+1)+". ":"")+itemName(it)));
  });

  if(state.plotlines.length){
    L.push("\n## "+tx("ki.straenge"));
    state.plotlines.forEach(p=>L.push("- "+p.name));
  }

  download((b.title||tx("ex.exposeHead")).replace(/[^\p{L}\p{N} -]/gu,"")+"-expose.md", L.join("\n"), "text/markdown");
  toast(tx("ex.exposeFertig"));
}
/* ============================================================
   PROJEKT ALS ORDNER AUSGEBEN
   Eine Datei je Eintrag, sortiert wie in der Ordner-Ansicht: was der
   Nutzer selbst einsortiert hat, findet er auf der Platte wieder.
   Innerhalb jedes Ordners wird nach Art gruppiert. Wer keine eigenen
   Ordner benutzt, bekommt genau das, was man erwartet – je Art einen
   Ordner auf der obersten Ebene.

   Der Sinn: die Arbeit von Jahren soll auch ohne Sluuw lesbar sein.
   ============================================================ */
function mdDateiname(it, belegt){
  let n=String(itemName(it)).replace(/[\r\n\t]+/g," ").trim().slice(0,70) || tx("fm.ohneTitel");
  let k=n, i=2;
  while(belegt.has(k.toLowerCase())) k=n+" "+(i++);
  belegt.add(k.toLowerCase());
  return k+".md";
}
/* Ein Eintrag als Markdown: Kopfzeile, dann jedes gefüllte Feld. Die
   Beschriftungen kommen aus KINDS, stehen also in der Sprache der
   Oberfläche und decken auch später ergänzte Felder ab. */
function mdEintrag(it){
  const K=KINDS[it.kind], L=[];
  L.push("# "+itemName(it));
  L.push("");
  L.push("*"+K.icon+" "+K.plural+"*");
  L.push("");
  K.fields.forEach(f=>{
    if(f.k===K.nameField || f.t==="image") return;
    let v=it[f.k];
    if(v===undefined||v===null||v==="") return;
    if(f.t==="tags"){ if(!v.length) return; L.push(v.map(t=>"#"+t).join(" ")); L.push(""); return; }
    if(f.t==="select"||f.t==="selectDyn"){ v=f.opts()[v]||v; if(!v) return; }
    if(f.t==="number"){ if(!+v) return; v=zahl(+v); }
    if(f.k==="langtext"||f.k==="summary"||f.k==="desc"||f.k==="text"){
      L.push("## "+f.l.replace(" *","")); L.push(""); L.push(String(v)); L.push("");
      return;
    }
    L.push("**"+f.l.replace(" *","")+":** "+String(v).replace(/\n/g, "  \n"));
  });
  const schritte=it.steps||[];
  if(schritte.length){
    L.push(""); L.push("## "+tx("wz.s4")); L.push("");
    schritte.forEach(s=>L.push("- ["+(s.done?"x":" ")+"] "+s.text));
  }
  const bez=linksVon(it.id);
  if(bez.length){
    L.push(""); L.push("## "+tx("bez.titel")); L.push("");
    bez.forEach(b=>L.push("- "+LINK_PFEIL[b.richtung]+" "+itemName(b.ziel)+(b.text?" – "+b.text:"")));
  }
  const anh=(it.files||[]);
  if(anh.length){
    L.push(""); L.push("## "+tx("btn.dateiAnhaengen")); L.push("");
    anh.forEach(f=>L.push("- "+(f.name||"?")));
  }
  L.push("");
  return L.join("\n");
}
/* Baut die vollständige Dateiliste: Übersicht plus je Eintrag eine
   Datei unter dem Weg, an dem der Eintrag auch in der App liegt. */
function projektDateien(){
  const dateien=[];
  const uebersicht=[];
  const b=state.book;
  uebersicht.push("# "+(b.title||tx("ki.buchprojekt")));
  uebersicht.push("");
  [[tx("feld.genre"),b.genre],[tx("bf.thema"),b.theme],[tx("feld.zielgruppe"),b.audience]]
    .forEach(([k,v])=>{ if(v) uebersicht.push("**"+k+":** "+v); });
  if(b.premise){ uebersicht.push(""); uebersicht.push("> "+String(b.premise).replace(/\n/g,"\n> ")); }
  uebersicht.push("");
  uebersicht.push("**"+tx("ls.woerter")+":** "+zahl(totalWords())+
    (b.targetWords?" / "+zahl(+b.targetWords):""));
  uebersicht.push("");
  Object.entries(KINDS).forEach(([art,K])=>{
    const n=byKind(art).length;
    if(n) uebersicht.push("- "+K.icon+" "+K.plural+": "+n);
  });
  uebersicht.push("");
  dateien.push({pfad:tx("ex.uebersicht")+".md", inhalt:uebersicht.join("\n")});

  const belegt=new Map();     /* Ordnerweg -> vergebene Dateinamen */
  state.items.forEach(it=>{
    const weg=ordnerPfad(it.folder).map(o=>o.name);
    weg.push(KINDS[it.kind].plural);
    const ordner=weg.join("/");
    if(!belegt.has(ordner)) belegt.set(ordner, new Set());
    dateien.push({pfad:ordner+"/"+mdDateiname(it, belegt.get(ordner)), inhalt:mdEintrag(it)});
  });

  /* Leere Ordner gingen sonst verloren – eine kurze Datei hält sie fest. */
  ordnerListe().forEach(o=>{
    if(ordnerZahl(o.id)) return;
    const weg=ordnerPfad(o.id).map(x=>x.name).join("/");
    dateien.push({pfad:weg+"/"+tx("ex.uebersicht")+".md",
                  inhalt:"# "+o.name+"\n\n"+tx("or.leer")+"\n"});
  });
  return dateien;
}

async function projektExport(){
  const wahl=await dlg({titel:tx("ex.projektTitel"), text:tx("ex.projektText"),
    knoepfe:[{t:tx("btn.abbrechen")},{t:tx("ex.alsJson")},{t:tx("ex.alsOrdner"), w:true}]});
  if(!wahl||wahl.knopf===0) return;
  if(wahl.knopf===1){ await exportJSON(true); return; }

  if(!DATEI||!DATEI.ordnerExport){
    await dlgInfo(tx("an.nichtVerfueg"), tx("an.nurAnwendung"));
    return;
  }
  const dateien=projektDateien();
  const r=await DATEI.ordnerExport({ordnerName:state.book.title||tx("ki.buchprojekt"), dateien});
  if(!r||!r.ok){ if(r&&!r.abgebrochen) await dlgInfo(tx("sp.fehlge"),(r&&r.fehler)||tx("ki.unbekannt")); return; }
  toast(tx("ex.ordnerFertig", r.anzahl, dateiName(r.ordner)));
}

/* ---------- SICHERUNG EINLESEN ----------
   Fremde Dateien werden nie roh übernommen: sauberProjekt() baut jeden
   Eintrag aus bekannten Feldern neu auf. Damit sind manipulierte
   Sicherungsdateien kein Weg mehr, Code in die Oberfläche zu bekommen. */
async function importJSON(){
  if(DATEI){
    const r=await DATEI.importieren();
    if(!r||!r.ok){ if(r&&!r.abgebrochen) await dlgInfo(tx("sp.oeffnenFehl"), (r&&r.fehler)||tx("sp.nichtLesbar")); return; }
    await importiereDaten(r.daten, r.name);
    return;
  }
  $("fileInput").click();
}
$("fileInput").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ()=>{
    try{ await importiereDaten(JSON.parse(r.result), f.name); }
    catch(err){ await dlgInfo(tx("ex.importFehl"), tx("ex.keineSicherung")); }
  };
  r.readAsText(f); e.target.value="";
});

async function importiereDaten(roh, name){
  let d;
  try{ d=sauberProjekt(migriere(roh)); }
  catch(err){ await dlgInfo(tx("ex.importFehl"), err.message); return; }

  const wahl=await dlg({titel:tx("ex.importTitel"),
    text:tx("ex.importFrage", name?"„"+name+"“ ":"", d.items.length),
    knoepfe:[{t:tx("btn.abbrechen")},{t:tx("ex.ersetzen"), gefahr:true},{t:tx("ex.hinzufuegen"), w:true}]});
  if(!wahl||wahl.knopf===0) return;

  if(wahl.knopf===1){
    zustandUebernehmen(roh, projektDatei);
    markiereGeaendert();
    toast(tx("ex.gelesenErsetzt", d.items.length));
    return;
  }

  let n=0;
  d.items.forEach(it=>{
    if(!it.id||state.items.some(x=>x.id===it.id)) it.id=uid();
    state.items.push(it); n++;
  });
  d.plotlines.forEach(pl=>{ if(!state.plotlines.some(x=>x.id===pl.id)) state.plotlines.push(pl); });
  d.minds.forEach(m=>{ if(m.id!=="default"&&!state.minds.some(x=>x.id===m.id)) state.minds.push(m); });
  d.timelines.forEach(t=>{ if(t.id!=="default"&&!state.timelines.some(x=>x.id===t.id)) state.timelines.push(t); });
  if(d.book.title&&!state.book.title) state.book=d.book;
  Object.keys(d.custom).forEach(nm=>{ state.custom[nm]=Object.assign({}, d.custom[nm], state.custom[nm]||{}); });
  let nf=0;
  if(d._files&&typeof d._files==="object"){
    Object.entries(d._files).forEach(([k,v])=>{ try{ idbPut(k, dataURLToBlob(v)); nf++; }catch(e){} });
    anhangCacheVerwerfen();
  }
  suchIndexLeeren(); save(); renderAll();
  toast(tx("ex.gelesen", n)+(nf?" · "+tx("ex.dateienZurueck", nf):""));
}
async function wipeAll(){
  if(await dlgFrage(tx("ex.alleLoeschen"), tx("ex.alleLoeschenT"), tx("ex.allesLoeschenBtn"), true)){
    state.items=[]; state.plotlines=[]; idbClear();
    state.minds=[{id:"default",name:"Haupt-Mindmap",nodes:[],edges:[]}]; state.activeMind="default";
    state.timelines=[{id:"default",name:""}]; state.activeTl="default";
    state.book={title:"",genre:"",premise:"",theme:"",audience:"",targetWords:0,deadline:""};
    selection.clear(); save(); renderAll(); toast(tx("ex.alleGeloescht"));
  }
}
function addPlotline(){
  const name=$("plName").value.trim(); if(!name){ toast(tx("hs.nameEingeben")); return; }
  state.plotlines.push({id:uid(), name, color:PL_COLORS[state.plotlines.length%PL_COLORS.length]});
  save(); renderAll();
}
async function delPlotline(id){
  const p=state.plotlines.find(x=>x.id===id);
  if(p && !await loeschenBestaetigt(p.name)) return;
  state.plotlines=state.plotlines.filter(p=>p.id!==id);
  byKind("beat").forEach(b=>{ if(b.plotline===id) b.plotline=""; });
  save(); renderAll();
}

function emptyHTML(msg){
  return `<div class="emptyMsg"><span class="big">✒️</span>${msg}<br><br>
    <button class="btn primary" onclick="openForm()">＋ ${esc(tx("ls.eintragAnlegen"))}</button>
    <button class="btn" onclick="loadDemo()">✨ ${esc(tx("pm.demoLaden"))}</button></div>`;
}
function ringSVG(p){
  const r=36, c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 92 92"><circle class="bgC" cx="46" cy="46" r="${r}"/>
    <circle class="fgC" cx="46" cy="46" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}" transform="rotate(-90 46 46)"/>
    <text x="46" y="51" text-anchor="middle">${Math.round(p*100)}%</text></svg>`;
}

/* ---------- Werte aus einem offenen Formular übernehmen ----------
   Der Haken: "change" feuert erst, wenn ein Feld den Fokus verliert –
   also genau in dem Moment, in dem man das nächste anklickt. Wurde
   dabei die ganze Ansicht neu gezeichnet, verschwand das angeklickte
   Feld noch vor dem Loslassen der Maustaste, und der Klick lief ins
   Leere. Man musste zweimal klicken.

   Deshalb: solange ein Formular offen ist, wird nur nachgeführt, was
   außerhalb davon liegt. Neu gezeichnet wird erst beim Schließen. */
function formularOffen(){
  const a=document.activeElement;
  if(!a||!a.tagName) return false;
  return ["INPUT","TEXTAREA","SELECT"].includes(a.tagName);
}
function nachfuehrenStattNeuzeichnen(){
  renderTitlebar();
  renderProjCard();
  if(state.pro) renderStatusbar();
}
function setBook(k, v){
  state.book[k]=v; save();
  if(bookEdit || formularOffen()) nachfuehrenStattNeuzeichnen();
  else renderSimple();
}

  const chaps=byKind("kapitel");

  const pct=goal?Math.round(tw/goal*100):0;

  /* 28-Tage-Verlauf: aus den Tagesständen werden Tagesleistungen */
  const ser=wordSeries(29);
  const gains=[];
  for(let i=1;i<ser.length;i++){
    const a=ser[i-1].total, c=ser[i].total;
    gains.push(a===null||c===null?0:Math.max(0,c-a));
  }
  const maxGain=Math.max(1,...gains);
  const todayGain=gains[gains.length-1]||0;
  const spark=gains.map((g,i)=>`<i class="${i===gains.length-1?"today":""}" style="height:${Math.max(2,Math.round(g/maxGain*44))}px" title="${ser[i+1].date}: +${zahl(g)}"></i>`).join("");

  const recent=[...state.items].sort((a,c)=>touchTime(c)-touchTime(a)).slice(0,6);

  const row=(k,v,ph)=>`<div class="dataRow"><span class="k">${k}</span><span class="v${v?"":" empty"}">${v?esc(v):esc(ph)}</span></div>`;
  const bookRead=`

    ${row(tx("feld.praemisse"), b.premise, "—")}
    ${row(tx("feld.thema"), b.theme, "—")}
    ${row(tx("feld.zielgruppe"), b.audience, "—")}
    ${row(tx("feld.wortziel"), goal?zahl(goal):"", "—")}`;
  const bookForm=`<div class="bookForm">
    ${b.title?"":`<p class="bfWink">${esc(tx("np.hinweis"))}</p>`}

/* ---------- Folgen nach Staffeln ----------
   Eine Serie sortiert sich nach Staffel und Nummer, nicht nach der
   Reihenfolge des Anlegens. Beides steht am Eintrag; die Anzeige
   gruppiert danach und nummeriert beim Umsortieren neu durch. */
function folgeStaffel(f){ const n=+((f&&f.staffel)||0); return n>0?n:1; }
function folgeNummer(f){ const n=+((f&&f.nummer)||0); return n>0?n:0; }
function folgenSortiert(liste){
  return (liste||byKind("folge")).slice().sort((a,b)=>
    folgeStaffel(a)-folgeStaffel(b) || folgeNummer(a)-folgeNummer(b) ||
    (a.order||0)-(b.order||0));
}
/* Staffel und Nummer für die nächste neue Folge: dieselbe Staffel wie
   zuletzt, dahinter die erste freie Nummer. */
function folgeNaechste(){
  const alle=byKind("folge");
  if(!alle.length) return {staffel:1, nummer:1};
  const staffel=Math.max(...alle.map(folgeStaffel));
  const drin=alle.filter(f=>folgeStaffel(f)===staffel);
  return {staffel, nummer:Math.max(0,...drin.map(folgeNummer))+1};
}
/* Nach jedem Verschieben werden die Nummern einer Staffel wieder
   lückenlos durchgezählt – sonst hieße die dritte Folge irgendwann 7. */
function folgenNeuNummerieren(staffel){
  folgenSortiert(byKind("folge").filter(f=>folgeStaffel(f)===staffel))
    .forEach((f,i)=>{ f.nummer=i+1; f.staffel=staffel; });
}
/* Verschiebt eine Folge vor eine andere – oder ans Ende einer Staffel. */
function folgeVerschieben(id, vorId, zielStaffel){
  const f=state.items.find(x=>x.id===id);
  if(!f||f.kind!=="folge") return false;
  const alteStaffel=folgeStaffel(f);
  const ziel = zielStaffel!==undefined ? +zielStaffel
             : (vorId ? folgeStaffel(state.items.find(x=>x.id===vorId)) : alteStaffel);
  if(vorId===id) return false;

  const inStaffel=folgenSortiert(byKind("folge").filter(x=>folgeStaffel(x)===ziel && x.id!==id));
  const stelle = vorId ? inStaffel.findIndex(x=>x.id===vorId) : inStaffel.length;
  inStaffel.splice(stelle<0?inStaffel.length:stelle, 0, f);
  inStaffel.forEach((x,i)=>{ x.staffel=ziel; x.nummer=i+1; });
  if(alteStaffel!==ziel) folgenNeuNummerieren(alteStaffel);
  touch(id); save(); renderAll();
  toast(tx("ls.umsortiert"));
  return true;
}

/* Umsortieren mit gedrückter linker Maustaste. Bewusst ohne das
   Ziehen-und-Ablegen des Browsers: das braucht ein bewusstes Anfassen
   am Rand, hier genügt Festhalten irgendwo auf der Zeile. */
let folgeZieht=null;
/* Umsortieren mit gedrückter linker Maustaste.

   Der Fehler in der ersten Fassung: die Zuhörer hingen an der jeweiligen
   Zeile. Sobald der Zeiger sie verließ – also genau dann, wenn man
   umsortieren will – gingen die Ereignisse an die Zeile darunter, und
   die angefasste bekam nichts mehr mit. Nichts bewegte sich.

   setPointerCapture leitet alle weiteren Ereignisse an das angefasste
   Element, egal wo der Zeiger gerade steht. */
function folgenZiehenVerdrahten(el){
  const zeilen=[...el.querySelectorAll(".folgeRow")];
  if(!zeilen.length) return;
  const SCHWELLE=6;

  const marken=()=>zeilen.forEach(x=>x.classList.remove("davor","dahinter"));

  zeilen.forEach(z=>{
    const id=z.dataset.folge;

    z.addEventListener("pointerdown", e=>{
      if(e.button!==undefined && e.button!==0) return;   /* nur linke Taste */
      if(e.target.closest("button")) return;
      folgeZieht={id, sy:e.clientY, bewegt:false};
      if(z.setPointerCapture) try{ z.setPointerCapture(e.pointerId); }catch(err){}
    });

    z.addEventListener("pointermove", e=>{
      if(!folgeZieht || folgeZieht.id!==id) return;
      if(!folgeZieht.bewegt && Math.abs(e.clientY-folgeZieht.sy)<SCHWELLE) return;
      folgeZieht.bewegt=true;
      z.classList.add("zieht");

      /* Welche Zeile liegt unter dem Zeiger? Obere Hälfte heißt „davor",
         untere „dahinter". Gesucht wird über die Maße, nicht über das
         Ereignisziel – das ist wegen der Zeigerübernahme immer z. */
      const ueber=zeilen.find(x=>{
        if(x===z) return false;
        const r=x.getBoundingClientRect();
        return e.clientY>=r.top && e.clientY<=r.bottom;
      });
      marken();
      if(ueber){
        const r=ueber.getBoundingClientRect();
        const obenDrueber = e.clientY < r.top+r.height/2;
        ueber.classList.add(obenDrueber ? "davor" : "dahinter");
        folgeZieht.ziel=ueber.dataset.folge;
        folgeZieht.davor=obenDrueber;
        folgeZieht.staffel=+ueber.dataset.staffel;
      } else {
        /* Unterhalb der letzten Zeile einer Staffel: ans Ende hängen. */
        const abschnitt=z.closest("[data-staffelziel]");
        folgeZieht.ziel=null;
        folgeZieht.staffel=abschnitt?+abschnitt.dataset.staffelziel:folgeStaffel(state.items.find(x=>x.id===id));
      }
    });

    const loslassen=e=>{
      if(!folgeZieht || folgeZieht.id!==id) return;
      const zug=folgeZieht; folgeZieht=null;
      z.classList.remove("zieht"); marken();
      if(z.releasePointerCapture && e && e.pointerId!==undefined)
        try{ z.releasePointerCapture(e.pointerId); }catch(err){}

      if(!zug.bewegt) return;                  /* nur ein Klick */
      /* Nach dem Ziehen darf der folgende Klick nicht die Detailseite
         öffnen – er gehörte zur Bewegung, nicht zur Auswahl. */
      folgeGezogen=true;
      setTimeout(()=>{ folgeGezogen=false; }, 300);

      if(zug.davor && zug.ziel){ folgeVerschieben(zug.id, zug.ziel, zug.staffel); return; }
      if(zug.ziel){
        /* dahinter = vor die übernächste, sonst ans Ende */
        const liste=folgenSortiert(byKind("folge").filter(x=>folgeStaffel(x)===zug.staffel));
        const i=liste.findIndex(x=>x.id===zug.ziel);
        const danach=liste[i+1];
        folgeVerschieben(zug.id, danach&&danach.id!==zug.id?danach.id:null, zug.staffel);
        return;
      }
      folgeVerschieben(zug.id, null, zug.staffel);
    };

    z.addEventListener("pointerup", loslassen);
    z.addEventListener("pointercancel", ()=>{ folgeZieht=null; z.classList.remove("zieht"); marken(); });
    z.addEventListener("lostpointercapture", ()=>{ /* Freigabe genügt */ });
  });
}

function renderFiguren(){

  $("sContent").innerHTML = `<div class="filterBar">

/* ============================================================
   AKTE
   Drei Akte sind eine Gewohnheit, kein Gesetz. Die Liste steht im
   Projekt, lässt sich umbenennen, umsortieren, erweitern und über
   Vorlagen austauschen – drei, fünf oder was die Geschichte braucht.

   Plot-Punkte verweisen über die Kennung auf ihren Akt. Wird ein Akt
   gelöscht, wandern sie in den vorherigen; verschwinden würden sie
   nur, wenn man es ausdrücklich so bauen wollte.
   ============================================================ */
function akteListe(){
  if(!Array.isArray(state.akte) || !state.akte.length){
    state.akte=[1,2,3].map(n=>({id:String(n), name:tx("akt."+n), sub:tx("akt."+n+".sub"), order:n}));
  }
  return state.akte.slice().sort((a,b)=>(a.order||0)-(b.order||0));
}
function aktVon(id){ return akteListe().find(a=>String(a.id)===String(id))||null; }
function aktName(id){ const a=aktVon(id); return a?a.name:tx("akt.kurz", id); }
/* Plot-Punkte eines Akts. Verweise auf gelöschte Akte fallen in den
   ersten – sonst wären die Punkte auf dem Board unsichtbar. */
function beatsVonAkt(id, liste){
  const akte=akteListe(), erste=akte[0]&&akte[0].id;
  return (liste||byKind("beat")).filter(b=>{
    const a=String(b.act||"");
    return a===String(id) || (!aktVon(a) && String(id)===String(erste));
  });
}
function aktOpts(){
  const o={}; akteListe().forEach(a=>o[a.id]=a.name); return o;
}
async function aktNeu(){
  const name=await dlgEingabe(tx("ak.neuerAkt"), tx("ak.name"), "");
  if(!name||!name.trim()) return;
  const sub=await dlgEingabe(tx("ak.neuerAkt"), tx("ak.unter"), "");
  const liste=akteListe();
  state.akte.push({id:uid(), name:name.trim(), sub:(sub||"").trim(),
                   order:Math.max(0,...liste.map(a=>a.order||0))+1});
  save(); renderAll();
}
async function aktUmbenennen(id){
  const a=aktVon(id); if(!a) return;
  const name=await dlgEingabe(tx("ak.umbenennen"), tx("ak.name"), a.name);
  if(name===null) return;
  const sub=await dlgEingabe(tx("ak.umbenennen"), tx("ak.unter"), a.sub||"");
  if(name.trim()) a.name=name.trim();
  if(sub!==null) a.sub=sub.trim();
  save(); renderAll();
}
async function aktLoeschen(id){
  const liste=akteListe();
  if(liste.length<=1){ toast(tx("ak.letzter")); return; }
  const a=aktVon(id); if(!a) return;
  const drin=beatsVonAkt(id).length;
  if(!await dlgFrage(tx("ak.loeschen"), tx("ak.loeschenFrage", a.name, drin), tx("btn.loeschen"), true)) return;
  const i=liste.findIndex(x=>x.id===a.id);
  const ziel=(liste[i-1]||liste[i+1]).id;
  byKind("beat").forEach(b=>{ if(String(b.act)===String(id)) b.act=String(ziel); });
  state.akte=state.akte.filter(x=>x.id!==a.id);
  save(); renderAll();
}
function aktSchieben(id, richtung){
  const liste=akteListe();
  const i=liste.findIndex(a=>String(a.id)===String(id)), j=i+richtung;
  if(i<0||j<0||j>=liste.length) return;
  const o=liste[i].order, p=liste[j].order;
  liste[i].order=p; liste[j].order=o;
  /* Gleiche Werte würden die Reihenfolge dem Zufall überlassen. */
  akteListe().forEach((a,n)=>a.order=n+1);
  save(); renderAll();
}
async function akteVorlage(){
  const wahl=await dlg({titel:tx("ak.vorlage"), text:tx("ak.vorlageText"),
    knoepfe:[{t:tx("btn.abbrechen")},{t:tx("ak.vFrei")},{t:tx("ak.v5")},{t:tx("ak.v3"), w:true}]});
  if(!wahl||wahl.knopf===0) return;
  const name={1:"frei", 2:"fuenf", 3:"drei"}[wahl.knopf];
  akteSetzen(AKT_VORLAGEN[name]);
}
/* Setzt eine Vorlage. Vorhandene Akte behalten ihre Kennung, solange es
   sie in der neuen Liste noch gibt – nur so bleiben die Plot-Punkte an
   Ort und Stelle. Was übersteht, rutscht in den letzten Abschnitt. */
function akteSetzen(paare){
  const alt=akteListe();
  const neu=[];
  for(let i=0;i<paare.length;i+=2){
    const nr=i/2;
    neu.push({id:(alt[nr]&&alt[nr].id)||uid(),
              name:paare[i]?tx(paare[i]):tx("ak.aktN", nr+1),
              sub:paare[i+1]?tx(paare[i+1]):"", order:nr+1});
  }
  const bleiben=new Set(neu.map(a=>String(a.id)));
  const letzter=String(neu[neu.length-1].id);
  /* Immer als Zeichenkette ablegen: die Demodaten schreiben die Akte als
     Zahl, Auswahlfelder liefern Text. Ein Vergleich mit === ginge sonst
     je nach Herkunft schief. */
  byKind("beat").forEach(b=>{
    b.act = bleiben.has(String(b.act)) ? String(b.act) : letzter;
  });
  state.akte=neu;
  save(); renderAll();
}

/* ============================================================
   VERKNÜPFUNGEN ZWISCHEN EINTRÄGEN
   Eine Beziehung gehört keinem der beiden Einträge, sondern
   liegt dazwischen – deshalb steht sie im Projekt und nicht im
   Eintrag. So erscheint sie auf beiden Seiten, und beim Löschen
   eines Eintrags bleibt keine halbe Verbindung zurück.

   Die Richtung ist Teil der Aussage: „Tochter von" ist etwas
   anderes als „Mutter von". Wo beide dasselbe sagen würden
   („verheiratet mit"), gibt es die beidseitige Form.
   ============================================================ */
function linkListe(){ if(!Array.isArray(state.links)) state.links=[]; return state.links; }

/* Alle Verknüpfungen eines Eintrags, aus seiner Sicht beschrieben. */
function linksVon(id){
  return linkListe().filter(l=>l.von===id||l.zu===id).map(l=>{
    const ausgehend = l.von===id;
    return {
      link:l,
      ziel: state.items.find(x=>x.id===(ausgehend?l.zu:l.von)),
      richtung: l.beidseitig ? "beide" : (ausgehend ? "hin" : "her"),
      text: l.text
    };
  }).filter(x=>x.ziel);
}
const LINK_PFEIL = {beide:"↔", hin:"→", her:"←"};

function linkAnlegen(von, zu, text, beidseitig){
  if(!von||!zu||von===zu) return null;
  const l={id:uid(), von, zu, text:String(text||"").trim(), beidseitig:!!beidseitig};
  linkListe().push(l);
  touch(von); touch(zu);
  save();
  return l;
}
function linkLoeschen(linkId){
  const i=linkListe().findIndex(l=>l.id===linkId);
  if(i<0) return;
  const [weg]=state.links.splice(i,1);
  touch(weg.von); touch(weg.zu);
  save(); renderAll();
  const offen=$("detailOverlay");
  if(offen && offen.dataset.id) openDetail(offen.dataset.id);
}

/* Beim Löschen eines Eintrags müssen seine Verknüpfungen mitgehen. */
function linksAufraeumen(itemId){
  state.links = linkListe().filter(l=>l.von!==itemId && l.zu!==itemId);
}

async function linkHinzufuegen(vonId){

      {label:tx("bez.wie"), value:"", placeholder:tx("bez.wieBeispiel")},
      {label:tx("bez.richtung"), auswahl:[

/* ================= BEZIEHUNGEN =================
   Das Beziehungsfeld jeder Figur ist Fließtext. Hier wird daraus ein Netz:
   Wird der Name einer anderen Figur genannt, entsteht eine Verbindung – und
   die Gegenrichtung wird gleich mitgezeigt, damit einseitige Einträge auffallen. */
function figureLinks(){
  const figs=byKind("figur");
  const idx=figs.map(f=>({
    id:f.id,
    keys:[itemName(f), itemName(f).split(/[\s,]+/)[0]]
      .filter(s=>s&&s.length>=3).map(s=>s.toLowerCase())
  }));
  const out={}, inc={};
  figs.forEach(f=>{ out[f.id]=[]; inc[f.id]=[]; });
  figs.forEach(f=>{
    const t=(f.relations||"").toLowerCase();
    if(!t) return;
    idx.forEach(o=>{
      if(o.id===f.id) return;
      if(o.keys.some(k=>t.includes(k))){ out[f.id].push(o.id); inc[o.id].push(f.id); }
    });
  });
  return {out, inc};
}
/* ============================================================
   BEZIEHUNGEN
   Drei Blicke auf dieselben Verbindungen:
     Karten     – je Figur eine Kachel, wie bisher
     Netz       – alle Beteiligten auf einem Kreis, Linien dazwischen,
                  die Beschriftung sitzt auf der Linie
     Stammbaum  – nur die Abstammung, nach Generationen von oben nach
                  unten sortiert

   Das Netz ist bewusst kein Kräftemodell: eine Anordnung im Kreis ist
   vorhersagbar, springt nicht bei jedem Zeichnen und braucht keine
   Bibliothek. Wer freie Anordnung will, hat die Mindmap.
   ============================================================ */
let relAnsicht="karten";
function setRelAnsicht(a){ relAnsicht=a; renderSimple(); }

/* Welche Beschriftungen bedeuten Abstammung? Bewusst mehrsprachig und
   großzügig – lieber eine Verbindung zu viel im Stammbaum als eine
   fehlende, die niemand findet. */
const ELTERN_WORTE = /(tochter|sohn|kind|vater|mutter|eltern|nachkomme|daughter|son|child|father|mother|parent|offspring|descendant|père|mère|fils|fille|enfant|padre|madre|hijo|hija|pai|filho|filha|ayah|ibu|anak)/i;
const KIND_WORTE   = /(tochter|sohn|kind|nachkomme|daughter|son|child|offspring|descendant|fils|fille|enfant|hijo|hija|filho|filha|anak)/i;

/* Kanten des Stammbaums als [elternId, kindId]. „Mira – Tochter von
   Lena" heißt: Lena ist der Elternteil. Steht am Ausgangspunkt ein
   Kind-Wort, dreht sich die Richtung. */
function stammKanten(){
  const aus=[];
  linkListe().forEach(l=>{
    const t=String(l.text||"");
    if(!ELTERN_WORTE.test(t)) return;
    if(!state.items.some(x=>x.id===l.von) || !state.items.some(x=>x.id===l.zu)) return;
    if(KIND_WORTE.test(t)) aus.push([l.zu, l.von]);
    else aus.push([l.von, l.zu]);
  });
  return aus;
}
/* Ordnet die Beteiligten in Generationen: wer keine Eltern hat, oben. */
function stammEbenen(kanten){
  const kinder=new Map(), eltern=new Map();
  kanten.forEach(([e,k])=>{
    if(!kinder.has(e)) kinder.set(e,[]);
    kinder.get(e).push(k);
    if(!eltern.has(k)) eltern.set(k,[]);
    eltern.get(k).push(e);
  });
  const beteiligt=[...new Set([...kinder.keys(), ...eltern.keys()])];
  const ebene=new Map();
  const wurzeln=beteiligt.filter(id=>!eltern.has(id));
  (wurzeln.length?wurzeln:beteiligt.slice(0,1)).forEach(id=>ebene.set(id,0));
  /* Breitensuche mit Deckel: ein Kreis in den Daten (jemand ist sein
     eigener Vorfahr) darf die Anzeige nicht aufhängen. */
  let welle=[...ebene.keys()], tiefe=0;
  while(welle.length && tiefe++<40){
    const naechste=[];
    welle.forEach(id=>(kinder.get(id)||[]).forEach(k=>{
      const neu=(ebene.get(id)||0)+1;
      if(!ebene.has(k) || ebene.get(k)<neu){ ebene.set(k,neu); naechste.push(k); }
    }));
    welle=naechste;
  }
  beteiligt.forEach(id=>{ if(!ebene.has(id)) ebene.set(id,0); });
  const nach={};
  ebene.forEach((n,id)=>{ (nach[n]=nach[n]||[]).push(id); });
  return nach;
}

/* ============================================================
   KARTEN MIT MARKIERUNGEN
   Ein hochgeladenes Bild – Weltkarte, Grundriss, Handzeichnung – und
   darauf gesetzte Markierungen. Jede kann auf einen Eintrag zeigen
   oder auf eine andere Karte; ein Klick öffnet eine Vorschau, aus der
   heraus man zur Detailseite, in die Mindmap oder auf die Zeitleiste
   springt.

   Die Lage wird in Prozent gespeichert, nicht in Bildpunkten. Nur so
   sitzt eine Markierung auf jedem Bildschirm an derselben Stelle des
   Bildes – und bleibt richtig, wenn das Fenster die Größe wechselt.
   ============================================================ */
let karteAuf=null, kartePin=null, karteSetzen=false, karteZieht=null;
let bookEdit=false;          /* Buchformular auf der Übersicht aufgeklappt? */
let kartePinSuche="";        /* Suchtext im Streifen; überlebt das Neuzeichnen */
/* Ausschnitt der Karte: Maßstab und Verschiebung. Steht nicht im
   Projekt – wie weit jemand gerade hineingezoomt hat, gehört nicht in
   die Datei. Beim Öffnen einer Karte wird stets eingepasst. */
let karteSicht={z:1, x:0, y:0}, karteBreite=0, karteHoehe=0, karteSchiebt=null;

function kartenListe(){ if(!Array.isArray(state.karten)) state.karten=[]; return state.karten; }
function karteAktiv(){
  const l=kartenListe();

function kartenTrefferVerdrahten(){ /* onclick steht im Markup */ }
function karteWechseln(id){

  karteSicht={z:1,x:0,y:0}; karteBreite=0; karteHoehe=0;
  renderAll();
}

/* ---------- Ausschnitt der Karte ----------
   Die Fläche bekommt die Maße des Bildes in Bildpunkten; darüber liegt
   ein Sichtfenster fester Höhe. So lässt sich jede Karte ganz zeigen,
   auch eine sehr hohe – vorher lief sie einfach aus dem Bild heraus.
   Die Markierungen sitzen in Prozent auf der Fläche und wandern
   deshalb ohne Zutun mit. */
function karteBildGeladen(img){
  const f=$("ktFlaeche"); if(!f||!img) return;
  karteBreite=img.naturalWidth||img.width||1000;
  karteHoehe =img.naturalHeight||img.height||700;
  f.style.width=karteBreite+"px";
  f.style.height=karteHoehe+"px";
  karteEinpassen();
}
function karteSichtAnwenden(){
  const f=$("ktFlaeche"); if(!f) return;
  f.style.transform=`translate(${Math.round(karteSicht.x)}px,${Math.round(karteSicht.y)}px) scale(${karteSicht.z})`;
  /* Die Nadeln werden gegengerechnet: sonst wären sie beim Herauszoomen
     nur noch Punkte und beim Hineinzoomen riesig. Sie sollen immer
     gleich groß bleiben, nur an anderer Stelle sitzen. */
  f.style.setProperty("--kz", String(1/(karteSicht.z||1)));
}
/* Passt die ganze Karte ins Sichtfenster und rückt sie in die Mitte. */
function karteEinpassen(){
  const s=$("ktSicht"); if(!s||!karteBreite||!karteHoehe) return;
  const sw=s.clientWidth||s.offsetWidth||900, sh=s.clientHeight||s.offsetHeight||520;
  const z=Math.min(sw/karteBreite, sh/karteHoehe);
  karteSicht.z=Math.max(0.02, z);
  karteSicht.x=(sw-karteBreite*karteSicht.z)/2;
  karteSicht.y=(sh-karteHoehe*karteSicht.z)/2;
  karteSichtAnwenden();
}
/* Vergrößert um die Mitte des Sichtfensters – so bleibt das, was man
   gerade ansieht, auch in der Mitte. */
function karteZoomen(faktor, px, py){
  const s=$("ktSicht"); if(!s) return;
  const sw=s.clientWidth||900, sh=s.clientHeight||520;
  const mx=px===undefined?sw/2:px, my=py===undefined?sh/2:py;
  const alt=karteSicht.z;
  const neu=Math.max(0.05, Math.min(8, alt*faktor));
  if(neu===alt) return;
  karteSicht.x = mx-(mx-karteSicht.x)*(neu/alt);
  karteSicht.y = my-(my-karteSicht.y)*(neu/alt);
  karteSicht.z = neu;
  karteSichtAnwenden();
}

/* Die Vorschau: ein Streifen am Rand mit dem, was hinter der
   Markierung steckt – und den Wegen, die von dort weiterführen. */

  const p=(k.pins||[]).find(x=>x.id===kartePin);

    ${it?`<div class="ktArt">${KINDS[it.kind].icon} ${esc(KINDS[it.kind].label)}</div>
         <div class="ktName">${esc(itemName(it))}</div>`:""}
    ${kurz?`<p class="ktText">${esc(kurz)}</p>`:""}
    ${andere?`<div class="ktArt">${esc(tx("kt.andereKarte", andere.name))}</div>`:""}

    <label class="ktLabel">${esc(tx("kt.pinZiel"))}</label>
    <select onchange="kartePinZiel('${p.id}', this.value)">
      <option value="">${esc(tx("kt.ohneZiel"))}</option>
      ${Object.entries(KINDS).map(([art,K])=>{
        const liste=byKind(art);
        return liste.length?`<optgroup label="${esc(K.icon+" "+K.plural)}">${liste.map(i=>
          `<option value="${i.id}" ${p.ziel===i.id?"selected":""}>${esc(itemName(i))}</option>`).join("")}</optgroup>`:"";
      }).join("")}
      ${ziele.length?`<optgroup label="${esc(tx("nav.karten"))}">${ziele.map(x=>
        `<option value="k:${x.id}" ${p.karte===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</optgroup>`:""}
    </select>

    <div class="ktWege">
      ${it?`<button class="btn small primary" onclick="openDetail('${it.id}')">${esc(tx("ov.detailseite"))}</button>
            <button class="btn small" onclick="elementMind('${it.id}')">${esc(tx("kt.zurMindmap"))}</button>
            <button class="btn small" onclick="elementTl('${it.id}')">${esc(tx("kt.zurZeit"))}</button>`:""}
      ${andere?`<button class="btn small primary" onclick="karteWechseln('${andere.id}')">${esc(tx("kt.zurKarte"))}</button>`:""}
      <button class="btn small" onclick="kartePinWeg('${p.id}')">${esc(tx("kt.pinLoeschen"))}</button>
    </div>

    <div class="ktSuche">
      <label class="ktLabel" for="ktSuchfeld">${esc(tx("kt.alleMarker"))}</label>
      <input id="ktSuchfeld" type="search" value="${esc(kartePinSuche)}"
             placeholder="${esc(tx("kt.suchen"))}" aria-label="${esc(tx("kt.suchen"))}">
      <div id="ktTreffer" class="ktTreffer">${kartePinListe()}</div>
    </div>
  </aside>`;
}

/* Alle Markierungen des Projekts, gefiltert nach dem Suchtext. Bewusst
   über alle Karten hinweg: wer „Schmiede" sucht, will sie finden – auch
   wenn sie auf einer anderen Karte steckt. */
function kartePinTreffer(){
  const q=String(kartePinSuche||"").trim().toLowerCase();
  const aus=[];
  kartenListe().forEach(k=>(k.pins||[]).forEach(p=>{
    const it=p.ziel?state.items.find(x=>x.id===p.ziel):null;
    const heu=[p.text, k.name, it?itemName(it):""].join(" ").toLowerCase();
    if(!q || heu.includes(q)) aus.push({k, p, it});
  }));
  return aus;
}
function kartePinListe(){
  const treffer=kartePinTreffer();
  if(!treffer.length) return `<div class="ktLeer">${esc(tx("kt.keinTreffer"))}</div>`;
  const hier=karteAktiv();
  return treffer.slice(0,120).map(({k,p,it})=>`
    <button class="ktTreffer1 ${p.id===kartePin?"an":""}" onclick="kartePinSpringen('${k.id}','${p.id}')">
      <span class="ktPunkt" style="background:${esc(safeColor(p.farbe))}"></span>
      <span class="tt">${esc(p.text)}</span>
      <span class="tw">${esc(k.id===(hier&&hier.id) ? tx("kt.hierher") : tx("kt.aufKarte", k.name))}</span>
    </button>`).join("");
}
/* Springt zur Markierung – bei Bedarf über die Karte, auf der sie liegt. */
function kartePinSpringen(karteId, pinId){
  if(karteAuf!==karteId){ karteAuf=karteId; karteSetzen=false; }
  kartePin=pinId;
  renderAll();
}

function renderKartenInto(el){
  const liste=kartenListe();
  const k=karteAktiv();
  const kopf=`<div class="filterBar">
    ${liste.length?`<select onchange="karteWechseln(this.value)" aria-label="${esc(tx("nav.karten"))}">
      ${liste.map(x=>`<option value="${x.id}" ${k&&x.id===k.id?"selected":""}>◎ ${esc(x.name)}</option>`).join("")}
    </select>`:""}
    <button class="btn primary small" onclick="karteNeu()">＋ ${esc(tx("kt.neue"))}</button>
    ${k?`<button class="btn small" onclick="karteUmbenennen()">✏️</button>
        <button class="btn small" onclick="karteLoeschen()">🗑️</button>
        <button class="btn small" onclick="karteBildWaehlen()">🖼️ ${esc(tx("kt.bildWaehlen"))}</button>
        ${k.bild?`<button class="btn small ${karteSetzen?"primary":""}" onclick="karteSetzModus()"
          aria-pressed="${karteSetzen}">📍 ${esc(karteSetzen?tx("kt.setzenAn"):tx("kt.setzen"))}</button>`:""}
        <span style="color:var(--text2);font-size:12.5px;margin-left:auto">${esc(tx("kt.pinZahl", (k.pins||[]).length))}</span>`:""}
    <input type="file" id="kartenDatei" accept="image/*" style="display:none">
  </div>`;

  if(!k){ el.innerHTML=kopf+emptyHTML(tx("kt.leer")); kartenVerdrahten(el); return; }
  if(!k.bild){ el.innerHTML=kopf+emptyHTML(tx("kt.keinBild")); kartenVerdrahten(el); return; }

  el.innerHTML=kopf+`<div class="ktWrap ${karteSetzen?"setzt":""}">
    <div class="ktSicht" id="ktSicht">
    <div class="ktFlaeche" id="ktFlaeche">
      <img src="${esc(safeSrc(k.bild))}" class="ktGrund" alt="${esc(k.name)}" draggable="false"
           onload="karteBildGeladen(this)">
      ${(k.pins||[]).map(p=>`<button class="ktPin ${kartePin===p.id?"an":""}" data-pin="${p.id}"
          style="left:${p.x}%; top:${p.y}%; --pf:${esc(safeColor(p.farbe))}"
          title="${esc(p.text)}" aria-label="${esc(p.text)}">
          <span class="ktNadel"></span><span class="ktSchild">${esc(p.text)}</span>
        </button>`).join("")}
    </div>
    <div class="ktZoom">
      <button class="btn small" onclick="karteEinpassen()" title="${esc(tx("kt.einpassen"))}"
        aria-label="${esc(tx("kt.einpassen"))}">⛶</button>
      <button class="btn small" onclick="karteZoomen(1.25)" title="${esc(tx("kt.groesser"))}"
        aria-label="${esc(tx("kt.groesser"))}">＋</button>
      <button class="btn small" onclick="karteZoomen(1/1.25)" title="${esc(tx("kt.kleiner"))}"
        aria-label="${esc(tx("kt.kleiner"))}">－</button>
    </div>
    </div>
    ${kartePinKarte(k)}
  </div>
  <div class="ktHinweis">${esc(tx("kt.hinweis"))} · ${esc(tx("kt.zoomHinweis"))}</div>`;
  kartenVerdrahten(el);
}

/* Klicken, Setzen und Ziehen. Die Lage wird aus dem Kasten des Bildes
   in Prozent umgerechnet – nicht aus Bildpunkten, sonst wandert die
   Markierung, sobald das Fenster seine Größe ändert. */
function kartenVerdrahten(el){
  const datei=el.querySelector("#kartenDatei");
  if(datei) datei.addEventListener("change", ()=>karteBildSetzen(datei.files&&datei.files[0]));

  /* Das Suchfeld schreibt nur die Trefferliste neu, nicht den ganzen
     Streifen – sonst verlöre es bei jedem Tastendruck den Fokus. */
  const suchfeld=el.querySelector("#ktSuchfeld");
  if(suchfeld){
    suchfeld.addEventListener("input", ()=>{
      kartePinSuche=suchfeld.value;
      const liste=el.querySelector("#ktTreffer");
      if(liste){ liste.innerHTML=kartePinListe(); kartenTrefferVerdrahten(liste); }
    });
  }

  /* Rad zoomt am Zeiger, Ziehen auf leerer Fläche verschiebt den
     Ausschnitt. Beides am Sichtfenster, nicht an der Fläche – die
     bewegt sich ja mit. */
  const sicht=el.querySelector("#ktSicht");
  if(sicht){
    sicht.addEventListener("wheel", e=>{
      e.preventDefault();
      const r=sicht.getBoundingClientRect();
      karteZoomen(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top);
    }, {passive:false});
    sicht.addEventListener("pointerdown", e=>{
      if(e.target.closest(".ktPin")||e.target.closest(".ktZoom")) return;
      if(karteSetzen) return;
      karteSchiebt={sx:e.clientX, sy:e.clientY, ax:karteSicht.x, ay:karteSicht.y, bewegt:false};
    });
    sicht.addEventListener("pointermove", e=>{
      if(!karteSchiebt) return;
      const dx=e.clientX-karteSchiebt.sx, dy=e.clientY-karteSchiebt.sy;
      if(!karteSchiebt.bewegt && Math.abs(dx)+Math.abs(dy)<4) return;
      karteSchiebt.bewegt=true;
      karteSicht.x=karteSchiebt.ax+dx; karteSicht.y=karteSchiebt.ay+dy;
      karteSichtAnwenden();
    });
    const ende=()=>{ karteSchiebt=null; };
    sicht.addEventListener("pointerup", ende);
    sicht.addEventListener("pointerleave", ende);
    sicht.addEventListener("pointercancel", ende);
  }

  const f=el.querySelector("#ktFlaeche");
  if(!f) return;
  /* Ein Bild aus dem Zwischenspeicher löst kein onload mehr aus – dann
     bliebe die Karte ohne Maße und damit ohne Einpassung. */
  const grund=f.querySelector(".ktGrund");
  if(grund && grund.complete && !karteBreite) karteBildGeladen(grund);
  const anteil=e=>{
    const r=f.getBoundingClientRect();
    if(!r.width||!r.height) return null;
    return {x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),
            y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))};
  };
  f.addEventListener("click", e=>{
    if(e.target.closest(".ktPin")) return;
    if(karteSchiebt&&karteSchiebt.bewegt) return;
    if(!karteSetzen) return;
    const a=anteil(e); if(a) kartePinNeu(+a.x.toFixed(2), +a.y.toFixed(2));
  });
  /* Anfassen, Ziehen, Loslassen – in einem Zug behandelt.

     Zwei Fehler steckten in der ersten Fassung:
     Die Markierung sprang beim Anfassen an die Zeigerstelle, weil die
     neue Lage aus dem Zeiger statt aus der Bewegung berechnet wurde.
     Und der Streifen ging nicht auf, weil der Klick noch als Ende einer
     Bewegung galt. Jetzt entscheidet allein die zurückgelegte Strecke:
     unter vier Bildpunkten ist es ein Klick, darüber ein Ziehen. */
  const SCHWELLE=4;
  f.querySelectorAll(".ktPin").forEach(b=>{
    const pinId=b.dataset.pin;
    b.addEventListener("click", e=>{ e.stopPropagation(); e.preventDefault(); });
    b.addEventListener("pointerdown", e=>{
      e.stopPropagation(); e.preventDefault();
      const k=karteAktiv(), p=k&&(k.pins||[]).find(x=>x.id===pinId);
      if(!p) return;
      karteZieht={id:pinId, sx:e.clientX, sy:e.clientY, px:p.x, py:p.y, bewegt:false};
      if(b.setPointerCapture) try{ b.setPointerCapture(e.pointerId); }catch(err){}
    });
    b.addEventListener("pointermove", e=>{
      if(!karteZieht || karteZieht.id!==pinId) return;
      const dx=e.clientX-karteZieht.sx, dy=e.clientY-karteZieht.sy;
      if(!karteZieht.bewegt && Math.abs(dx)+Math.abs(dy)<SCHWELLE) return;
      karteZieht.bewegt=true;
      const r=f.getBoundingClientRect();
      if(!r.width||!r.height) return;
      /* Aus der Bewegung, nicht aus der Zeigerstelle: so bleibt der
         Griffpunkt erhalten und nichts springt. */
      const nx=Math.max(0,Math.min(100, karteZieht.px + dx/r.width*100));
      const ny=Math.max(0,Math.min(100, karteZieht.py + dy/r.height*100));
      karteZieht.nx=nx; karteZieht.ny=ny;
      b.style.left=nx+"%"; b.style.top=ny+"%";
    });
    const loslassen=()=>{
      if(!karteZieht || karteZieht.id!==pinId) return;
      const z=karteZieht;
      karteZieht=null;
      const k=karteAktiv(), p=k&&(k.pins||[]).find(x=>x.id===pinId);
      if(!p) return;
      if(z.bewegt && z.nx!==undefined){
        p.x=+z.nx.toFixed(2); p.y=+z.ny.toFixed(2);
        save(); renderAll();
      } else {
        kartePinKlick(pinId);      /* keine Strecke zurückgelegt: ein Klick */
      }
    };
    b.addEventListener("pointerup", loslassen);
    b.addEventListener("pointercancel", ()=>{ karteZieht=null; renderAll(); });
  });
}

/* ============================================================
   BEZIEHUNGSFLÄCHE
   Netz und Stammbaum sind jetzt bewegliche Flächen wie die Mindmap:
   Punkte lassen sich ziehen, der Ausschnitt verschieben, das Mausrad
   zoomt. Die Lage der Punkte steht im Projekt – wer sein Netz einmal
   geordnet hat, findet es beim nächsten Öffnen wieder.

   Beide Ansichten benutzen dieselbe Fläche und unterscheiden sich nur
   darin, wie die Punkte beim ersten Mal angeordnet werden: das Netz
   legt sie auf einen Kreis, der Stammbaum in Generationsreihen.
   ============================================================ */
let bezSicht={z:1, x:0, y:0}, bezZieht=null, bezSchiebt=null;

/* Die Lage je Figur und Ansicht. Getrennt gespeichert, weil ein
   Stammbaum anders aussieht als ein Netz. */
function bezLagen(){
  if(!state.bezLage || typeof state.bezLage!=="object") state.bezLage={};
  const k = relAnsicht==="stamm" ? "stamm" : "netz";
  if(!state.bezLage[k]) state.bezLage[k]={};
  return state.bezLage[k];
}
function bezLageSetzen(id, x, y){
  bezLagen()[id]={x:Math.round(x), y:Math.round(y)};
  save();
}

/* Erstanordnung Netz: alle auf einem Kreis. */
function bezKreis(ids){
  const n=Math.max(1, ids.length);
  const R=Math.max(150, Math.min(340, 48*n/Math.PI+90));
  const pos={};
  ids.forEach((id,i)=>{
    const w=(i/n)*Math.PI*2-Math.PI/2;
    pos[id]={x:Math.round(460+Math.cos(w)*R*1.25), y:Math.round(340+Math.sin(w)*R)};
  });
  return pos;
}
/* Erstanordnung Stammbaum: Generationen von oben nach unten. */
function bezReihen(ebenen){
  const pos={};
  Object.keys(ebenen).map(Number).sort((a,b)=>a-b).forEach(nr=>{
    const reihe=ebenen[nr];
    reihe.forEach((id,i)=>{
      const breite=Math.max(1, reihe.length);
      pos[id]={x:Math.round(460 + (i-(breite-1)/2)*230), y:Math.round(120+nr*180)};
    });
  });
  return pos;
}
/* Vorhandene Lagen behalten, fehlende ergänzen. */
function bezLageFuer(ids, vorgabe){
  const lagen=bezLagen();
  let neu=false;
  ids.forEach(id=>{ if(!lagen[id]){ lagen[id]=vorgabe[id]||{x:460,y:340}; neu=true; } });
  if(neu) save();
  return lagen;
}
function bezNeuAnordnen(){
  const k = relAnsicht==="stamm" ? "stamm" : "netz";
  if(state.bezLage) delete state.bezLage[k];
  bezSicht={z:1,x:0,y:0};
  save(); renderSimple();
}
function bezSichtAnwenden(){
  const g=$("bezRoot"); if(!g) return;
  g.setAttribute("transform", `translate(${bezSicht.x},${bezSicht.y}) scale(${bezSicht.z})`);
}
function bezZoomen(faktor, px, py){
  const s=$("bezSvg"); if(!s) return;
  const r=s.getBoundingClientRect ? s.getBoundingClientRect() : {width:900,height:560,left:0,top:0};
  const mx=px===undefined?r.width/2:px, my=py===undefined?r.height/2:py;
  const alt=bezSicht.z, neu=Math.max(0.2, Math.min(3, alt*faktor));
  if(neu===alt) return;
  bezSicht.x = mx-(mx-bezSicht.x)*(neu/alt);
  bezSicht.y = my-(my-bezSicht.y)*(neu/alt);
  bezSicht.z = neu;
  bezSichtAnwenden();
}

/* Zeichnet die Fläche. kanten: [{von, zu, text, beidseitig}] */
function bezFlaeche(ids, kanten, lagen, gerichtet){
  const name=id=>{ const it=state.items.find(x=>x.id===id); return it?itemName(it):"?"; };
  const rolle=id=>{ const it=state.items.find(x=>x.id===id); return it&&it.role?String(ROLES[it.role]||"").split(" ")[0]:"●"; };

  const linien=kanten.map(l=>{
    const a=lagen[l.von], b=lagen[l.zu];
    if(!a||!b) return "";
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    return `<g class="nzKante">
      <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>
      ${l.text?`<text x="${mx}" y="${my-6}" text-anchor="middle">${esc(String(l.text).slice(0,26))}</text>`:""}
      ${(!gerichtet&&l.beidseitig)?"":`<circle cx="${(a.x+b.x*3)/4}" cy="${(a.y+b.y*3)/4}" r="4" class="nzSpitze"/>`}
    </g>`;
  }).join("");

  const punkte=ids.map(id=>{
    const p=lagen[id]; if(!p) return "";
    return `<g class="nzKnoten" data-bez="${id}" transform="translate(${p.x},${p.y})">
      <circle r="26"/>
      <text class="nzZeichen" text-anchor="middle" y="6">${esc(rolle(id))}</text>
      <text class="nzName" text-anchor="middle" y="44">${esc(name(id))}</text>
    </g>`;
  }).join("");

  return `<div class="bezWrap">
    <svg id="bezSvg" class="bezSvg" role="img" aria-label="${esc(tx(relAnsicht==="stamm"?"bn.stammbaum":"bn.netz"))}">
      <g id="bezRoot" transform="translate(${bezSicht.x},${bezSicht.y}) scale(${bezSicht.z})">
        ${linien}${punkte}
      </g>
    </svg>
    <div class="bezZoom">
      <button class="btn small" onclick="bezNeuAnordnen()">${esc(tx("bn.anordnen"))}</button>
      <button class="btn small" onclick="bezZoomen(1.25)" aria-label="${esc(tx("kt.groesser"))}">＋</button>
      <button class="btn small" onclick="bezZoomen(1/1.25)" aria-label="${esc(tx("kt.kleiner"))}">－</button>
    </div>
  </div>
  <div class="ktHinweis">${esc(tx("bn.hinweis"))}</div>`;
}

/* Zuhörer: Punkte ziehen, Fläche schieben, Rad zoomt. */
function bezVerdrahten(el){
  const svg=el.querySelector("#bezSvg");
  if(!svg) return;
  const stelle=e=>{
    const r=svg.getBoundingClientRect();
    return {x:(e.clientX-r.left-bezSicht.x)/bezSicht.z, y:(e.clientY-r.top-bezSicht.y)/bezSicht.z};
  };

  svg.addEventListener("wheel", e=>{
    e.preventDefault();
    const r=svg.getBoundingClientRect();
    bezZoomen(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top);
  }, {passive:false});

  svg.addEventListener("pointerdown", e=>{
    if(e.button!==undefined && e.button!==0) return;
    const kn=e.target.closest ? e.target.closest(".nzKnoten") : null;
    if(kn){
      const id=kn.dataset.bez, p=bezLagen()[id]||{x:0,y:0};
      const s=stelle(e);
      bezZieht={id, dx:p.x-s.x, dy:p.y-s.y, bewegt:false, el:kn};
    } else {
      bezSchiebt={sx:e.clientX, sy:e.clientY, ax:bezSicht.x, ay:bezSicht.y, bewegt:false};
    }
    if(svg.setPointerCapture) try{ svg.setPointerCapture(e.pointerId); }catch(err){}
  });

  svg.addEventListener("pointermove", e=>{
    if(bezZieht){
      const s=stelle(e);
      const nx=s.x+bezZieht.dx, ny=s.y+bezZieht.dy;
      bezZieht.bewegt=true; bezZieht.nx=nx; bezZieht.ny=ny;
      if(bezZieht.el.setAttribute) bezZieht.el.setAttribute("transform", `translate(${Math.round(nx)},${Math.round(ny)})`);
      return;
    }
    if(bezSchiebt){
      const dx=e.clientX-bezSchiebt.sx, dy=e.clientY-bezSchiebt.sy;
      if(!bezSchiebt.bewegt && Math.abs(dx)+Math.abs(dy)<4) return;
      bezSchiebt.bewegt=true;
      bezSicht.x=bezSchiebt.ax+dx; bezSicht.y=bezSchiebt.ay+dy;
      bezSichtAnwenden();
    }
  });

  const loslassen=()=>{
    if(bezZieht){
      const z=bezZieht; bezZieht=null;
      if(z.bewegt && z.nx!==undefined){ bezLageSetzen(z.id, z.nx, z.ny); renderSimple(); }
      else openDetail(z.id);      /* nicht bewegt = Klick */
      return;
    }
    bezSchiebt=null;
  };
  svg.addEventListener("pointerup", loslassen);
  svg.addEventListener("pointercancel", ()=>{ bezZieht=null; bezSchiebt=null; });
}

/* ---------- Netzansicht ---------- */
function relNetz(kanten){
  const ids=[];
  kanten.forEach(l=>{ [l.von,l.zu].forEach(id=>{ if(!ids.includes(id)) ids.push(id); }); });
  if(!ids.length) return emptyHTML(tx("bn.leer"));
  const lagen=bezLageFuer(ids, bezKreis(ids));
  return bezFlaeche(ids, kanten, lagen, false);
}

/* ---------- Stammbaum ---------- */
function relStammbaum(){
  const kanten=stammKanten();
  if(!kanten.length) return emptyHTML(tx("bn.stammLeer"));
  const ebenen=stammEbenen(kanten);
  const ids=[];
  Object.keys(ebenen).forEach(nr=>ebenen[nr].forEach(id=>{ if(!ids.includes(id)) ids.push(id); }));
  const lagen=bezLageFuer(ids, bezReihen(ebenen));
  const paare=kanten.map(([e,k])=>({von:e, zu:k, text:"", beidseitig:false}));
  return bezFlaeche(ids, paare, lagen, true);
}

/* ================= AKTE & SZENEN =================
   Die Drei-Akt-Struktur von oben nach unten, mit dem Kapitel, in dem der
   Plot-Punkt landet. Unten stehen Kapitel, für die es noch keinen gibt. */
function renderAkte(){
  const q=feldWert("sSearch");
  const beats=byKind("beat").filter(i=>matches(i,q)).sort((a,b)=>(a.order||0)-(b.order||0));
  const total=Math.max(1, byKind("beat").length);
  const chaps=byKind("kapitel").sort((a,b)=>(a.order||0)-(b.order||0));
  const used=new Set(byKind("beat").map(b=>b.chapter).filter(Boolean));
  const offen=chaps.filter(c=>!used.has(c.id));

  const acts=akteListe().map((akt,ai,alle)=>{
    const a=akt.id;
    const list=beatsVonAkt(a, beats);
    const share=Math.round(beatsVonAkt(a).length/total*100);
    return `<div class="actSec">
      <div class="actHead"><div><h2>${esc(akt.name)} ${aktKnoepfe(a, ai, alle.length)}</h2><div class="sub">${esc(akt.sub||"")}</div></div>
        <div class="num">${esc(tx("ak.plotpunkteZ", list.length))}<br>${esc(tx("ak.anteil", share))}</div></div>
      <div class="actShare"><div style="width:${share}%"></div></div>
      ${list.map((b,i)=>{
        const ch=state.items.find(x=>x.id===b.chapter);
        const pl=state.plotlines.find(p=>p.id===b.plotline);
        return `<div class="sceneRow" onclick="openDetail('${b.id}')" title="${esc(tx("ov.oeffnen"))}">
          <span class="idx">${i+1}</span>
          <span class="st" style="background:${esc(safeColor(plColor(b.plotline)))}"></span>
          <span class="grow"><span class="t">${esc(b.title)}</span>
            <span class="m">${pl?esc(pl.name):esc(tx("ak.haupthandlung"))}${ch?" · "+esc(itemName(ch))+(ch.status?" ("+esc(CH_STATUS[ch.status])+")":""):" · "+esc(tx("ak.ohneKapitel"))}</span></span>

/* ============================================================
   BIBLIOTHEK
   „In der App gespeichert" heißt hier: in einem Ordner, den die
   App kennt und selbst benennt – voreingestellt in den Dokumenten.
   Es gibt keinen verborgenen Speicher; die Dateien liegen sichtbar
   im Explorer, lassen sich mitnehmen und mitsichern.

   Geöffnet wird wahlweise aus dieser Übersicht oder über den
   Dateidialog des Betriebssystems. Projekte, die woanders liegen,
   erscheinen ebenfalls in der Liste – gekennzeichnet als auswärtig.
   ============================================================ */
const BIB = (window.sluuw && window.sluuw.bib) || null;
let bibDaten = {ordner:"", eintraege:[], geladen:false};

async function bibLaden(){
  if(!BIB) return;
  const r = await BIB.liste();
  if(r&&r.ok){ bibDaten={ordner:r.ordner, eintraege:r.eintraege, geladen:true}; }
  else bibDaten={ordner:"", eintraege:[], geladen:true};
}

function bibZeitText(ms){
  const d=new Date(ms);
  const heute=new Date(); heute.setHours(0,0,0,0);
  const tage=Math.floor((heute-new Date(ms).setHours(0,0,0,0))/86400000);
  if(tage<=0) return d.toLocaleTimeString(gebiet(),{hour:"2-digit",minute:"2-digit"});
  if(tage===1) return tx("zeit.gestern");
  if(tage<7) return tx("zeit.vorTagen", tage);
  return d.toLocaleDateString(gebiet(),{day:"2-digit",month:"2-digit",year:"numeric"});
}

function renderBibliothek(){
  const el=$("sContent");
  if(!BIB){
    el.innerHTML=emptyHTML(tx("bib.leer"));
    return;
  }
  if(!bibDaten.geladen){
    el.innerHTML=`<div class="emptyMsg">…</div>`;
    bibLaden().then(()=>{ if(view==="bibliothek") renderBibliothek(); });

  }

  const karten = bibDaten.eintraege.map(e=>{
    const m=e.meta||{};
    const offen = projektDatei && e.datei===projektDatei;
    const pct = m.zielWorte ? Math.round((m.worte||0)/m.zielWorte*100) : 0;
    const titel = m.titel || e.name || tx("bib.ohneTitel");
    return `<div class="bibKarte${offen?" offen":""}${e.fehler?" kaputt":""}">
      <button class="bibOeffnen" onclick="bibOeffnen(${JSON.stringify(e.datei).replace(/"/g,"&quot;")})"

                 :(!e.inBibliothek?`<span class="bibMarke">${esc(tx("bib.auswaerts"))}</span>`:"")}
        </span>
        ${e.fehler
          ? `<span class="bibFehler">${esc(tx("bib.nichtLesbar"))}</span>`
          : `<span class="bibZahlen">${esc(tx("bib.woerterKurz", zahl(m.worte||0), m.kapitel||0))}</span>
             ${m.zielWorte?`<span class="progressBar"><span style="width:${Math.min(100,pct)}%"></span></span>`:""}`}
        <span class="bibFuss">${esc(bibZeitText(e.geaendert))} · ${esc((e.groesse/1048576).toFixed(1))} MB</span>
      </button>
      <span class="bibKnoepfe">
        <button class="btn small" onclick="bibUmbenennen(${JSON.stringify(e.datei).replace(/"/g,"&quot;")})"
          ${e.inBibliothek?"":"disabled"}>${esc(tx("bib.umbenennen"))}</button>
        <button class="btn small" onclick="bibImOrdner(${JSON.stringify(e.datei).replace(/"/g,"&quot;")})">${esc(tx("bib.imOrdner"))}</button>
        <button class="btn small" onclick="bibEntfernen(${JSON.stringify(e.datei).replace(/"/g,"&quot;")})"
          ${e.inBibliothek?"":"disabled"}>${esc(tx("bib.entfernen"))}</button>
      </span>
    </div>`;
  }).join("");

  el.innerHTML=`<div class="filterBar">
      <button class="btn primary small" onclick="projektNeu()">＋ ${esc(tx("pm.neu"))}</button>
      <button class="btn small" onclick="projektOeffnen()">${esc(tx("bib.ausDatei"))}</button>
      <span class="bibOrdner" title="${esc(bibDaten.ordner)}">${esc(tx("bib.ordner"))}: <code>${esc(bibDaten.ordner)}</code></span>
      <button class="btn small" onclick="bibOrdnerOeffnen()">${esc(tx("bib.imOrdner"))}</button>
      <button class="btn small" onclick="bibOrdnerAendern()">${esc(tx("bib.ordnerAendern"))}</button>
    </div>
    ${bibDaten.eintraege.length ? `<div class="bibGitter">${karten}</div>` : emptyHTML(tx("bib.leer"))}`;

async function bibOeffnen(datei){
  if(projektDatei===datei){ go("dash"); return; }
  await projektOeffnen(datei);
}
async function bibOrdnerOeffnen(){ if(BIB) await BIB.ordnerOeffnen(); }
async function bibOrdnerAendern(){
  if(!BIB) return;
  const r=await BIB.ordnerWaehlen();
  if(r&&r.ok){ bibDaten.geladen=false; await bibLaden(); renderAll(); toast(tx("bib.ordner")+": "+r.ordner); }
}
async function bibImOrdner(datei){ if(BIB) await BIB.imOrdnerZeigen(datei); }

async function bibUmbenennen(datei){
  const e=bibDaten.eintraege.find(x=>x.datei===datei); if(!e) return;
  const alt=(e.meta&&e.meta.titel)||e.name;
  const neu=await dlgEingabe(tx("bib.umbenennen"), tx("bib.neuerTitel"), alt);
  if(!neu||neu===alt) return;
  const r=await BIB.umbenennen(datei, neu);
  if(!r||!r.ok){ await dlgInfo(tx("bib.umbenennen"), (r&&r.fehler)||"?"); return; }
  if(projektDatei===datei) projektDatei=r.datei;
  bibDaten.geladen=false; await bibLaden(); renderAll();
}

async function bibEntfernen(datei){
  const e=bibDaten.eintraege.find(x=>x.datei===datei); if(!e) return;
  const name=(e.meta&&e.meta.titel)||e.name;
  if(!await dlgFrage(tx("bib.entfernen"), tx("bib.entfernenFrage", name), tx("bib.entfernen"), true)) return;
  const r=await BIB.entfernen(datei);
  if(!r||!r.ok){ await dlgInfo(tx("bib.entfernen"), (r&&r.fehler)||"?"); return; }
  if(projektDatei===datei){ projektDatei=null; ungesichert=true; }
  bibDaten.geladen=false; await bibLaden(); renderAll();
}

/* Ein beliebiger Wert wird zu Text – verschachtelte Objekte und
   Listen gehen sonst als „[object Object]" verloren. */
function jsonWert(v){
  if(v===null||v===undefined) return "";
  if(typeof v==="string") return v;
  if(typeof v==="number"||typeof v==="boolean") return String(v);
  if(Array.isArray(v)) return v.map(jsonWert).filter(Boolean).join(", ");
  if(typeof v==="object") return Object.entries(v).map(([k,x])=>{
    const t=jsonWert(x); return t?k+": "+t:"";
  }).filter(Boolean).join(" · ");
  return "";
}

/* Durchsucht die Datei nach allem, was wie eine Liste von Einträgen aussieht.
   Erzeugte Dateien verschachteln gern („story.characters"), deshalb wird der
   ganze Baum abgelaufen und nicht nur die oberste Ebene. */
function jsonDatensaetze(daten, maxTiefe){
  const gefunden=[];
  const gesehen=new Set();
  (function lauf(wert, pfad, tiefe){
    if(!wert||typeof wert!=="object"||tiefe>(maxTiefe||6)) return;
    if(gesehen.has(wert)) return;          // gegen Ringe in den Daten
    gesehen.add(wert);

    if(Array.isArray(wert)){
      const objekte=wert.filter(x=>x&&typeof x==="object"&&!Array.isArray(x));
      if(objekte.length){
        const felder=[];
        objekte.slice(0,200).forEach(o=>Object.keys(o).forEach(k=>{ if(!felder.includes(k)) felder.push(k); }));
        gefunden.push({pfad:pfad||"(oberste Ebene)", eintraege:objekte, felder});
      }
      wert.forEach((x,i)=>lauf(x, `${pfad}[${i}]`, tiefe+1));
      return;
    }
    Object.entries(wert).forEach(([k,v])=>lauf(v, pfad?pfad+"."+k:k, tiefe+1));
  })(daten, "", 0);

  /* Ein einzelnes Objekt ohne jede Liste ist auch ein Datensatz – sonst
     ließe sich eine Datei mit genau einer Figur nicht einlesen. */
  if(!gefunden.length && daten && typeof daten==="object" && !Array.isArray(daten)){
    const flach=Object.entries(daten).filter(([,v])=>typeof v!=="object"||v===null);
    if(flach.length) gefunden.push({pfad:"(oberste Ebene)", eintraege:[daten], felder:Object.keys(daten)});
  }
  return gefunden;
}

function rateArt(pfad, felder){
  /* Von hinten nach vorn: der letzte Schlüssel im Pfad beschreibt den
     Inhalt am genauesten („story.welt.orte" → „orte"). */
  const teile=String(pfad||"").split(/[.\[\]]+/).map(feldSchluessel).filter(Boolean).reverse();
  for(const t of teile) for(const r of ART_RATEN) if(r.genau.test(t)) return r.art;
  for(const t of teile) for(const r of ART_RATEN) if(r.teil.test(t)) return r.art;

  // Kein Treffer im Pfad: aus den Feldnamen schließen
  const f=(felder||[]).map(feldSchluessel);
  const hat=n=>f.includes(n);
  if(hat("rolle")||hat("role")||hat("motivation")||hat("aussehen")||hat("appearance")) return "figur";
  if(hat("wortzahl")||hat("words")||hat("wordcount")||hat("kapitel")) return "kapitel";
  if(hat("atmosphaere")||hat("atmosphere")||hat("bewohner")||hat("inhabitants")) return "ort";
  if(hat("akt")||hat("act")) return "beat";
  if(hat("datum")||hat("date")||hat("zeitpunkt")) return "ereignis";
  if(hat("regeln")||hat("rules")||hat("kategorie")) return "welt";
  return "notiz";       // Auffangbecken: lieber als Idee anlegen als verwerfen
}

/* Schlägt für jedes Quellfeld ein Zielfeld vor. Nur Felder, die es
   bei dieser Art wirklich gibt – sonst landen Daten im Nichts. */
function rateZuordnung(art, felder){
  const erlaubt=KINDS[art].fields.filter(f=>f.t!=="image").map(f=>f.k);
  const namensfeld=KINDS[art].nameField;
  const zu={};
  const belegt=new Set();
  (felder||[]).forEach(q=>{
    const treffer=FELD_RATEN[feldSchluessel(q)];
    if(treffer && erlaubt.includes(treffer) && !belegt.has(treffer)){
      zu[q]=treffer; belegt.add(treffer);
    } else zu[q]="";
  });
  // Ohne Name/Titel wäre der Eintrag namenlos: erstes brauchbares Textfeld nehmen
  if(!Object.values(zu).includes(namensfeld)){
    const kandidat=(felder||[]).find(q=>!zu[q]&&/name|titel|title|bezeichn/i.test(q))
                 ||(felder||[]).find(q=>!zu[q]);
    if(kandidat) zu[kandidat]=namensfeld;
  }
  return zu;
}

/* Auswahlfelder speichern Schlüssel, keine Anzeigetexte. Steht in der
   Datei „Protagonistin", muss daraus „protagonist" werden – sonst zeigt
   die Karte ein Fragezeichen, obwohl die Angabe richtig war.
   Verglichen wird gegen Schlüssel und Beschriftung, ohne Emoji. */
function optionSchluessel(feld, wert){
  let optionen={};
  try{ optionen=feld.opts()||{}; }catch(e){ return ""; }
  const gesucht=feldSchluessel(jsonWert(wert));
  if(!gesucht) return "";
  for(const [k,label] of Object.entries(optionen)){
    if(!k) continue;
    if(feldSchluessel(k)===gesucht) return k;
  }
  for(const [k,label] of Object.entries(optionen)){
    if(!k) continue;
    const l=feldSchluessel(label);
    if(l===gesucht || (l.length>3 && (l.startsWith(gesucht)||gesucht.startsWith(l)))) return k;
  }

  /* Durchnummerierte Auswahlen (der Akt) werden selten als blanke Ziffer
     geschrieben. „Akt II", „erster Akt", „Act 3" – all das soll ankommen. */
  const nurZiffern=Object.keys(optionen).filter(Boolean).every(k=>/^\d+$/.test(k));
  if(nurZiffern){
    const roh=String(jsonWert(wert)).toLowerCase();
    const ziffer=(roh.match(/\d+/)||[])[0];
    if(ziffer && optionen[ziffer]!==undefined) return ziffer;
    const ROEMISCH={i:1, ii:2, iii:3, iv:4, v:5};
    const rm=(roh.match(/\b(i{1,3}|iv|v)\b/)||[])[1];
    if(rm && optionen[String(ROEMISCH[rm])]!==undefined) return String(ROEMISCH[rm]);
    const WORT={erste:1, erster:1, first:1, zweite:2, zweiter:2, second:2, dritte:3, dritter:3, third:3};
    for(const [w,n] of Object.entries(WORT))
      if(roh.includes(w) && optionen[String(n)]!==undefined) return String(n);
  }
  return "";
}

/* Baut aus Rohdaten und Zuordnung fertige Einträge. Läuft am Ende durch
   dieselbe Säuberung wie jeder Import, damit fremde Dateien keine
   Sonderrolle bekommen. */
function jsonZuEintraegen(rohe, art, zuordnung){
  const K=KINDS[art];
  const out=[];
  rohe.forEach(o=>{
    const roh={kind:art};
    Object.entries(zuordnung).forEach(([quelle, ziel])=>{
      if(!ziel || !(quelle in o)) return;
      const feld=K.fields.find(f=>f.k===ziel);
      const wert=o[quelle];
      if(!feld) return;
      if(feld.t==="tags") roh[ziel]=Array.isArray(wert)?wert.map(jsonWert):String(jsonWert(wert)).split(/[,;]/);
      else if(feld.t==="number") roh[ziel]=Number.isFinite(+wert)?+wert:0;
      else if(feld.t==="select"||feld.t==="selectDyn"){
        const k=optionSchluessel(feld, wert);
        /* Kein Treffer: bei festen Listen die erste Option, bei Verweisen
           auf andere Einträge lieber nichts als etwas Falsches. */
        if(k) roh[ziel]=k;
        else if(feld.t==="select") roh[ziel]=Object.keys(feld.opts()||{})[0]||"";
      }
      else roh[ziel]=jsonWert(wert);
    });
    /* Auswahlfelder, zu denen die Datei nichts sagt, bekommen den Standardwert –
       sonst steht auf der Karte ein leeres Statusfeld, und Fortschritt und
       Statistik rechnen mit einem Wert, den es in der Liste gar nicht gibt. */
    K.fields.forEach(f=>{
      if(f.t!=="select") return;
      if(roh[f.k]) return;
      const erste=Object.keys(f.opts()||{})[0];
      if(erste) roh[f.k]=erste;
    });
    if(!roh[K.nameField]) roh[K.nameField]=tx("fm.ohneTitel");
    const sauber=sauberEintrag(roh);
    if(sauber) out.push(sauber);
  });
  return out;
}

/* ============================================================
   FÜR EINE KI AUSGEBEN
   Die Gegenrichtung zum JSON-Import: die App schreibt eine Datei,
   die man einer KI vorlegen kann. Darin steht der Projektstand
   und – aus KINDS erzeugt, also nie veraltet – der genaue Aufbau,
   in dem die Antwort zurückkommen soll. Diese Antwort liest man
   dann mit „JSON-Datei einlesen" wieder ein.

   Bewusst über eine Datei und nicht über eine Netzverbindung:
   so bleibt die Zusage aus der Datenschutzerklärung gültig, dass
   die App nichts von sich aus verschickt. Du entscheidest bei
   jedem Schritt selbst, was das Gerät verlässt.
   ============================================================ */
function kiSchluessel(art){ return KI_SCHLUESSEL[art]||art; }

/* Ein gültiges JSON-Beispiel – ohne Kommentare, damit die KI es nicht
   nachahmt und dabei ungültiges JSON erzeugt. Die Einschränkungen
   stehen darunter im Klartext. Die Feldnamen sind fest, die Werte im
   Beispiel bleiben deutsch: sie zeigen nur die Form. */
function kiBeispiel(){
  /* Die Schlüssel sind fest (siehe KI_SCHLUESSEL), die Beispielwerte
     folgen der Sprache – sonst bittet eine englische Oberfläche um
     englische Werte und zeigt darunter ein deutsches Beispiel. */
  const j=v=>JSON.stringify(v);
  return [
    "```json",
    "{",
    '  "figuren": [',
    "    {",
    '      "name": '+j(dz("Mira von Aschfeld","Mira of Ashfield"))+",",
    '      "role": "protagonist",',
    '      "age": "17",',
    '      "motivation": '+j(dz("Den Thron zurückgewinnen, ohne zu werden wie ihr Vater",
                                "Reclaim the throne without becoming her father"))+",",
    '      "tags": '+j(dz(["stur","schmiedin"],["stubborn","blacksmith"])),
    "    }",
    "  ],",
    '  "kapitel": [',
    "    {",
    '      "title": '+j(dz("Der Ruf des Nordens","The Call of the North"))+",",
    '      "status": "geplant",',
    '      "summary": '+j(dz("Mira erfährt vom Tod des Königs und bricht auf.",
                             "Mira hears of the king\u2019s death and sets out."))
    ,"    }",
    "  ]",
    "}",
    "```"
  ].join("\n");
}

/* Feldliste je Art, erzeugt aus KINDS – kann also nicht veralten. */
function kiFeldliste(art){
  const K=KINDS[art], L=[];
  const felder=K.fields.filter(f=>f.t!=="image");
  L.push("**"+kiSchluessel(art)+"** – "+felder.map(f=>f.k+(f.k===K.nameField?" ("+tx("ki.pflicht")+")":"")).join(", "));
  felder.forEach(f=>{
    if(f.t==="select"){
      let opts={}; try{ opts=f.opts()||{}; }catch(e){}
      const keys=Object.keys(opts).filter(Boolean);
      if(keys.length) L.push("  - `"+f.k+"` "+tx("ki.mussWert")+": "+keys.join(" · "));
    }
    else if(f.t==="selectDyn") L.push("  - `"+f.k+"`: "+tx("ki.nameEintrag"));
    else if(f.t==="tags") L.push("  - `"+f.k+"`: "+tx("ki.listeWorte")+", "+JSON.stringify(dz(["mutig","jung"],["brave","young"])));
    else if(f.t==="number") L.push("  - `"+f.k+"`: "+tx("ki.zahl"));
  });
  return L.join("\n");
}
