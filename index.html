<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Inhaltssicherheit: die Oberfläche zeigt Daten an, die aus importierten Dateien
     stammen können. Selbst wenn dort etwas durchrutscht, kann es nichts nachladen
     und nichts nach außen schicken – connect-src und default-src stehen auf 'none',
     Bilder nur aus der App selbst oder als eingebettete Daten.
     'unsafe-inline' ist nötig, weil die Bedienelemente onclick-Attribute nutzen;
     entscheidend gegen Datenabfluss sind connect-src, img-src und form-action. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  media-src 'self' data: blob:;
  font-src 'self';
  connect-src 'none';
  form-action 'none';
  base-uri 'none';
  frame-src 'none';
  object-src 'none'">
<title>Sluuw – Plan your book: plot, characters &amp; world</title>
<style>
/* ============================================================
   FARBEN
   Dunkel ist der Standard und bildet die Vorlage ab: kühle,
   leicht violett gebrochene Graustufen, ein einziger warmer
   Akzent in Messing. Hell ist die gleiche Struktur auf Papier.
   ============================================================ */
:root{
  /* Flächen */
  --bg:#f7f5f0; --bg2:#efece4; --panel:#ffffff; --panel2:#f2efe8; --panel-hover:#faf8f4;
  --titlebar:#eceae3; --sidebar:#f2efe8;
  /* Schrift */
  --text:#1e1c1a; --text2:#6a6459; --text3:#9a9384;
  /* Akzente */
  --accent:#a9662f; --accent-light:#f4ebe1; --accent-ink:#ffffff; --accent2:#6f63c8;
  --link:#5b55c9;
  --ok:#3b7a57; --warn:#c2740b; --bad:#bc392b;
  /* Linien */
  --border:#e2ddd1; --border-subtle:#ebe7dd; --line-strong:#d6d0c2;
  /* Tiefe: drei Stufen statt einer, damit Hover echte Hierarchie bekommt */
  --shadow-sm:0 1px 2px rgba(46,34,20,.05), 0 2px 6px rgba(46,34,20,.04);
  --shadow:0 2px 4px rgba(46,34,20,.05), 0 8px 24px rgba(46,34,20,.07);
  --shadow-lg:0 4px 8px rgba(46,34,20,.06), 0 18px 44px rgba(46,34,20,.14);
  --ring:0 0 0 3px var(--accent-light);
  /* Radien */
  --radius-sm:7px; --radius:12px; --radius-lg:16px;
  --chip:#eae4d7;
  /* Marken der Eintragsarten */
  --kt-kapitel-bg:#f0e6d8; --kt-kapitel-fg:#8a5f28;
  --kt-folge-bg:#f5e3d5;   --kt-folge-fg:#9a5424;
  --kt-figur-bg:#e0e6f6;   --kt-figur-fg:#3f5591;
  --kt-ort-bg:#d9ece9;     --kt-ort-fg:#2f6f68;
  --kt-welt-bg:#e0eddd;    --kt-welt-fg:#3e6b45;
  --kt-beat-bg:#e9e2f4;    --kt-beat-fg:#5f4a8c;
  --kt-ereignis-bg:#f4ebd4;--kt-ereignis-fg:#8a6a1c;
  --kt-notiz-bg:#f6e0e0;   --kt-notiz-fg:#94413c;
  /* Maße der Hülle */
  --title-h:34px; --side-w:262px;
  /* Typografie */
  --font-main:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
[data-theme="dark"]{
  --bg:#121116; --bg2:#0e0d11; --panel:#1a191f; --panel2:#232128; --panel-hover:#201e26;
  --titlebar:#151419; --sidebar:#141317;
  --text:#eceaf0; --text2:#8e8899; --text3:#615c6d;
  --accent:#e2a163; --accent-light:#2a2119; --accent-ink:#20170e; --accent2:#8b83e0;
  --link:#7d7ae2;
  --ok:#5ea87a; --warn:#e0972f; --bad:#e0604f;
  --border:#282631; --border-subtle:#201f27; --line-strong:#353243;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 6px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.35);
  --shadow-lg:0 4px 10px rgba(0,0,0,.5), 0 22px 52px rgba(0,0,0,.55);
  --chip:#26242e;
  --kt-kapitel-bg:#2b2117; --kt-kapitel-fg:#d9a066;
  --kt-folge-bg:#2e1e15;   --kt-folge-fg:#dd9059;
  --kt-figur-bg:#1c2136;   --kt-figur-fg:#8ba3e4;
  --kt-ort-bg:#152a29;     --kt-ort-fg:#6dbdb2;
  --kt-welt-bg:#1a2a1c;    --kt-welt-fg:#7fbb87;
  --kt-beat-bg:#241f33;    --kt-beat-fg:#a695e0;
  --kt-ereignis-bg:#2b2413;--kt-ereignis-fg:#d5b158;
  --kt-notiz-bg:#2e1a1a;   --kt-notiz-fg:#dd8078;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:var(--font-main); background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  transition:background .2s ease,color .2s ease; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
h1,h2,h3,h4{line-height:1.3; letter-spacing:-.01em; font-weight:650;}
button{font-family:inherit; cursor:pointer; border:none; outline:none;}
input,select,textarea{font-family:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:9px 12px; font-size:13.5px; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;}
textarea{line-height:1.55; resize:vertical;}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:var(--ring);}
input::placeholder,textarea::placeholder{color:var(--text3);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px; border:2px solid transparent; background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:var(--text3); background-clip:content-box;}

/* ============================================================
   HÜLLE DES EINFACHEN MODUS
   Titelleiste, Seitenleiste, Inhaltsspalte. Die Navigation steht
   links und trägt Zähler, damit der Umfang des Projekts jederzeit
   sichtbar ist, ohne dass man eine Ansicht öffnen muss.
   ============================================================ */
#simpleUI{display:flex; flex-direction:column; height:100vh; background:var(--bg);}

/* ---------- TITELLEISTE ---------- */
.titlebar{height:var(--title-h); flex-shrink:0; display:flex; align-items:center; gap:10px;
  background:var(--titlebar); border-bottom:1px solid var(--border-subtle); padding:0 0 0 10px;
  -webkit-app-region:drag; user-select:none; position:relative; z-index:30;}
.tbDots{display:flex; gap:7px; -webkit-app-region:no-drag;}
.tbDot{width:11px; height:11px; border-radius:50%; border:none; padding:0; background:var(--line-strong);
  transition:background .15s ease, transform .12s ease;}
.tbDot:hover{transform:scale(1.12);}
.tbDot.c{background:#e05c52;} .tbDot.m{background:#e0a13c;} .tbDot.x{background:#4fb562;}
.tbTitle{flex:1; text-align:center; font-family:var(--font-mono); font-size:11.5px; color:var(--text2);
  letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 12px;}
.tbRight{font-size:11px; color:var(--text3); padding-right:14px; white-space:nowrap; -webkit-app-region:no-drag;}
.tbRight.dirty{color:var(--warn);}

/* ---------- GRUNDRISS ---------- */
.shell{flex:1; display:flex; min-height:0;}
.sidebar{width:var(--side-w); flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--border-subtle);
  display:flex; flex-direction:column; min-height:0;}
.sideScroll{flex:1; overflow-y:auto; padding:12px 10px 8px;}
.mainCol{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg);}
#sContent{flex:1; overflow-y:auto; padding:6px 26px 40px; scroll-behavior:smooth;}

/* ---------- PROJEKTKARTE ---------- */
.projCard{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--panel);
  border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 10px; margin-bottom:10px;
  transition:border-color .15s ease, background .15s ease;}
.projCard:hover{border-color:var(--line-strong); background:var(--panel-hover);}
.projAv{width:26px; height:26px; border-radius:6px; background:var(--accent-light); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
  border:1px solid var(--border);}
.projCard .pTxt{flex:1; min-width:0; display:block; overflow:hidden;}
.projCard .pT{display:block; font-size:13px; font-weight:650; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.projCard .pS{display:block; font-size:11px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
.projCard .pC{font-size:9px; color:var(--text3); flex-shrink:0;}

/* ---------- SUCHE IN DER SEITENLEISTE ---------- */
.sideSearch{position:relative; margin-bottom:14px;}
.sideSearch input{width:100%; background:var(--bg2); border:1px solid var(--border-subtle); border-radius:var(--radius-sm);
  padding:8px 46px 8px 30px; font-size:12.5px; color:var(--text);}
.sideSearch input:focus{border-color:var(--accent); box-shadow:none;}
.sideSearch .mag{position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--text3); pointer-events:none;}
.kbd{position:absolute; right:7px; top:50%; transform:translateY(-50%); font-family:var(--font-mono); font-size:10px;
  color:var(--text3); background:var(--panel2); border:1px solid var(--border-subtle); border-radius:4px;
  padding:2px 5px; pointer-events:none;}

/* ---------- NAVIGATION ---------- */
.navSec{font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--text3);
  padding:16px 10px 6px;}
.navItem{display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none;
  border-radius:var(--radius-sm); padding:7px 10px; font-size:13px; font-weight:550; color:var(--text2);
  margin-bottom:1px; transition:background .13s ease, color .13s ease;}
.navItem .ico{width:15px; text-align:center; font-size:12px; opacity:.75; flex-shrink:0;}
.navItem .lbl{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.navItem .cnt{font-family:var(--font-mono); font-size:10.5px; color:var(--text3); font-variant-numeric:tabular-nums; flex-shrink:0;}
.navItem:hover{background:var(--panel2); color:var(--text);}
.navItem.active{background:var(--panel2); color:var(--text); font-weight:650;}
.navItem.active .ico{color:var(--accent); opacity:1;}
.navItem.action .ico{opacity:.6;}

/* ---------- FUSSLEISTE DER SEITENLEISTE ---------- */
.sideFoot{flex-shrink:0; display:flex; align-items:center; gap:8px; padding:10px 14px;
  border-top:1px solid var(--border-subtle);}
.sideFoot .fl{flex:1; font-size:11.5px; color:var(--text2);}
.switch{width:34px; height:19px; border-radius:11px; background:var(--line-strong); border:none; padding:0;
  position:relative; flex-shrink:0; transition:background .18s ease;}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%;
  background:#fff; transition:transform .18s cubic-bezier(.4,0,.2,1); box-shadow:0 1px 3px rgba(0,0,0,.35);}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(15px);}
.iconBtn{width:24px; height:22px; border-radius:5px; background:none; border:1px solid var(--border-subtle);
  color:var(--text2); font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:background .13s ease, color .13s ease, border-color .13s ease;}
.iconBtn:hover{background:var(--panel2); color:var(--text); border-color:var(--border);}

/* ---------- KOPFZEILE DES INHALTS ---------- */
.mainHead{display:flex; align-items:center; gap:12px; padding:16px 26px 14px; flex-wrap:wrap;}
.mainHead h1{font-size:19px; font-weight:650; letter-spacing:-.015em;}
.crumb{font-size:11.5px; color:var(--text3); display:flex; align-items:center; gap:6px;}
.crumb b{font-weight:500;}
.headActions{margin-left:auto; display:flex; align-items:center; gap:8px;}
.btn{border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 13px; font-size:12.5px; font-weight:600;
  background:var(--panel); color:var(--text); display:inline-flex; align-items:center; justify-content:center; gap:6px;
  white-space:nowrap; transition:background .15s ease, border-color .15s ease, transform .12s ease, box-shadow .15s ease;}
.btn:hover{background:var(--panel2); border-color:var(--line-strong);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:650;}
.btn.primary:hover{background:var(--accent); filter:brightness(1.08);}
.btn.icon{padding:7px 10px;}
.btn.small{padding:4px 9px; font-size:12px; border-radius:6px;}
.btn .hk{font-family:var(--font-mono); font-size:10px; opacity:.6; margin-left:2px;}
.btn .pill{font-family:var(--font-mono); font-size:10.5px; color:var(--text3); font-variant-numeric:tabular-nums;}
.linkBtn{background:none; border:none; color:var(--link); font-size:12px; font-weight:600; padding:0;}
.linkBtn:hover{text-decoration:underline;}

/* ============================================================
   ÜBERSICHT
   Eine Kennzahlenleiste, darunter zwei Karten: die Buchdaten als
   ruhige Beschriftungs-Tabelle, daneben die letzten Änderungen.
   ============================================================ */
.ovWrap{display:flex; flex-direction:column; gap:16px;}
.statStrip{display:flex; align-items:center; gap:34px; background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px 22px; flex-wrap:wrap;}
.statCell{display:flex; flex-direction:column; gap:5px;}
.statBig{font-size:27px; font-weight:350; letter-spacing:-.02em; color:var(--accent); line-height:1;
  font-variant-numeric:tabular-nums;}
.statBig .u{font-size:14px; font-weight:500; margin-left:1px;}
.statBig .sm{font-size:15px; color:var(--text3);}
.statLab{font-size:9.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text3);}
.sparkWrap{margin-left:auto; display:flex; align-items:flex-end; gap:14px;}
.spark{display:flex; align-items:flex-end; gap:2px; height:44px;}
.spark i{width:5px; background:var(--line-strong); border-radius:1px; min-height:2px; display:block;
  transition:height .4s cubic-bezier(.4,0,.2,1);}
.spark i.today{background:var(--accent);}
.sparkMeta{text-align:right; padding-bottom:2px;}
.sparkMeta .d{font-size:12.5px; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums;}
.sparkMeta .l{font-size:10px; color:var(--text3); margin-top:2px;}

.ovCols{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;}
.panelCard{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px 18px;
  display:flex; flex-direction:column; min-height:0;}
.pcHead{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.pcHead h2{font-size:14px; font-weight:650; letter-spacing:-.01em;}
.pcHead .r{margin-left:auto;}
.dataRow{display:flex; gap:16px; padding:9px 0; border-bottom:1px solid var(--border-subtle); align-items:flex-start;}
.dataRow:last-of-type{border-bottom:none;}
.dataRow .k{width:88px; flex-shrink:0; font-size:9.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text3); padding-top:2px;}
.dataRow .v{flex:1; min-width:0; font-size:13px; line-height:1.5; color:var(--text); white-space:pre-wrap; word-break:break-word;}
.dataRow .v.empty{color:var(--text3); font-style:italic;}
.chRow{display:flex; align-items:center; gap:10px; padding:7px 0;}
.chRow .nm{flex:1; min-width:0; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chRow .ag{font-size:10.5px; color:var(--text3); font-family:var(--font-mono); white-space:nowrap;}
.chRow:hover .nm{color:var(--accent);}
.kTag{font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:.06em; padding:2px 5px;
  border-radius:3px; flex-shrink:0; width:34px; text-align:center;}
.pcFoot{margin-top:auto; padding-top:14px; display:flex; gap:8px;}
.pcFoot .btn{flex:1;}
@media(max-width:1000px){ .ovCols{grid-template-columns:1fr;} }

/* Kürzel-Marken der Eintragsarten (Übersicht, Beziehungen, Akte).
   Die Farben stehen als Variablen bei den übrigen Themenfarben, damit
   das Thema an einer Stelle gepflegt wird und nicht hier verstreut. */
.kTag{background:var(--kt-bg); color:var(--kt-fg);}
.kt-kapitel {--kt-bg:var(--kt-kapitel-bg);  --kt-fg:var(--kt-kapitel-fg);}
.kt-folge   {--kt-bg:var(--kt-folge-bg);    --kt-fg:var(--kt-folge-fg);}
.kt-figur   {--kt-bg:var(--kt-figur-bg);    --kt-fg:var(--kt-figur-fg);}
.kt-ort     {--kt-bg:var(--kt-ort-bg);      --kt-fg:var(--kt-ort-fg);}
.kt-welt    {--kt-bg:var(--kt-welt-bg);     --kt-fg:var(--kt-welt-fg);}
.kt-beat    {--kt-bg:var(--kt-beat-bg);     --kt-fg:var(--kt-beat-fg);}
.kt-ereignis{--kt-bg:var(--kt-ereignis-bg); --kt-fg:var(--kt-ereignis-fg);}
.kt-notiz   {--kt-bg:var(--kt-notiz-bg);    --kt-fg:var(--kt-notiz-fg);}

/* ============================================================
   BEZIEHUNGEN
   Liest die Beziehungsfelder der Figuren und macht daraus echte,
   klickbare Verbindungen – inklusive der Gegenrichtung.
   ============================================================ */
.relGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px;}
.relCard{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px;}
.relCard .rh{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.relCard .rh .av{width:30px; height:30px; border-radius:8px; background:var(--accent-light); display:flex;
  align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.relCard .rh h3{font-size:14px; font-weight:650;}
.relCard .rh .rl{font-size:11px; color:var(--text3);}
.relLine{display:flex; align-items:baseline; gap:8px; padding:5px 0; font-size:12.5px; flex-wrap:wrap;}
.relLine .dir{font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text3); width:52px; flex-shrink:0;}
.relNote{font-size:12.5px; color:var(--text2); line-height:1.5; margin-top:8px; padding-top:8px; border-top:1px solid var(--border-subtle);}
.relEmpty{font-size:12.5px; color:var(--text3); font-style:italic;}

/* ============================================================
   AKTE & SZENEN
   Die Drei-Akt-Struktur als durchgehende Leiste: Plot-Punkte in
   Reihenfolge, jeder mit seinem Kapitel und Handlungsstrang.
   ============================================================ */
.actSec{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px; overflow:hidden;}
.actHead{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border-subtle);}
.actHead h2{font-size:14.5px; font-weight:650;}
.actHead .sub{font-size:11.5px; color:var(--text3);}
.actHead .num{margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text3); text-align:right;}
.actShare{height:3px; background:var(--panel2);}
.actShare>div{height:100%; background:var(--accent);}
.sceneRow{display:flex; align-items:center; gap:11px; padding:9px 18px; border-bottom:1px solid var(--border-subtle);
  cursor:pointer; transition:background .13s ease;}
.sceneRow:last-child{border-bottom:none;}
.sceneRow:hover{background:var(--panel-hover);}
.sceneRow .idx{font-family:var(--font-mono); font-size:10.5px; color:var(--text3); width:22px; flex-shrink:0; font-variant-numeric:tabular-nums;}
.sceneRow .st{width:3px; height:26px; border-radius:2px; flex-shrink:0; background:var(--accent);}
.sceneRow .grow{flex:1; min-width:0; display:block; overflow:hidden;}
.sceneRow .t{display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sceneRow .m{display:block; font-size:11px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
.actEmpty{padding:16px 18px; font-size:12.5px; color:var(--text3); font-style:italic;}

/* ---------- SPEICHERWARNUNG ---------- */
#saveBanner{display:none; position:fixed; left:0; right:0; bottom:0; z-index:9999; background:var(--bad); color:#fff; padding:11px 16px; font-size:13.5px; line-height:1.45; align-items:center; gap:14px; flex-wrap:wrap; box-shadow:0 -4px 18px rgba(0,0,0,.25);}
#saveBanner.show{display:flex;}
#saveBanner .grow{flex:1; min-width:220px;}
#saveBanner b{display:block; font-size:14px;}
#saveBanner button{border:none; border-radius:8px; padding:7px 13px; font-size:13px; font-weight:700; background:#fff; color:var(--bad);}
.storBar{height:7px; background:var(--panel2); border-radius:4px; overflow:hidden; margin:6px 0 4px;}
.storBar>div{height:100%; border-radius:4px; transition:width .3s;}

/* ---------- EIGENE AUSWAHLOPTIONEN ---------- */
.optGrp{margin-bottom:18px;}
.optGrp h4{font-size:13.5px; color:var(--accent); margin-bottom:6px;}
.optRow{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border);}
.optRow:last-child{border-bottom:none;}
.optRow .grow{flex:1; min-width:0; font-size:13.5px;}
.optRow .base{font-size:12px; color:var(--text2);}

.cardGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(275px,1fr)); gap:18px;}
.mCard{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);
  padding:16px; display:flex; flex-direction:column; gap:9px; position:relative;
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
.mCard:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--border);}
.mCard .top{display:flex; align-items:flex-start; gap:10px;}
.typeIcon{font-size:21px; width:42px; height:42px; display:flex; align-items:center; justify-content:center;
  border-radius:11px; background:var(--accent-light); flex-shrink:0;}
.mCard h3{font-size:15px; line-height:1.3; word-break:break-word;}
.mCard .meta{font-size:12px; color:var(--text2);}
.mCard .desc{font-size:12.5px; color:var(--text2); line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
.statusBadge{font-size:11px; font-weight:650; padding:3px 10px 3px 8px; border-radius:20px; display:inline-flex;
  align-items:center; gap:5px; letter-spacing:.01em; border:1px solid transparent; vertical-align:middle;}
/* Der Punkt trägt die Farbe, die Fläche bleibt zurückhaltend – lesbar auch bei vielen Badges nebeneinander */
.statusBadge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; opacity:.9;}
.st-idee{background:#eef0fb; color:#4a4a8c; border-color:#dfe2f4;}
.st-geplant{background:#e9f0f8; color:#3a6489; border-color:#d8e4f0;}
.st-entwurf{background:#f8f0e2; color:#8a6520; border-color:#eee2ca;}
.st-ueberarbeitung{background:#f9ece1; color:#96552a; border-color:#efdcc9;}
.st-fertig{background:#e8f2ea; color:#3b7a57; border-color:#d6e8db;}
[data-theme="dark"] .st-idee{background:#22243a; color:#a8adde; border-color:#2e3150;}
[data-theme="dark"] .st-geplant{background:#1c2733; color:#8fb6da; border-color:#26343f;}
[data-theme="dark"] .st-entwurf{background:#2c2517; color:#d8b876; border-color:#3b3220;}
[data-theme="dark"] .st-ueberarbeitung{background:#2e2118; color:#d99a6b; border-color:#3d2c20;}
[data-theme="dark"] .st-fertig{background:#1b2a21; color:#7cbb95; border-color:#26382d;}
.roleBadge{font-size:11px; font-weight:650; padding:3px 10px; border-radius:20px; background:var(--chip); color:var(--text2);
  display:inline-block; border:1px solid var(--border-subtle);}
.progressBar{height:7px; background:var(--panel2); border-radius:6px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(46,34,20,.06);}
.progressBar>div{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:6px; transition:width .4s cubic-bezier(.4,0,.2,1);}
.progRow{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text2);}
.progRow .progressBar{flex:1;}
.tagChip{font-size:11px; background:var(--panel2); color:var(--text2); padding:3px 9px; border-radius:12px;
  margin:2px 3px 0 0; display:inline-block; border:1px solid var(--border-subtle);}
.cardBtns{display:flex; gap:6px; margin-top:auto; padding-top:6px; flex-wrap:wrap;}
.emptyMsg{text-align:center; color:var(--text2); padding:60px 20px; font-size:15px;}
.emptyMsg .big{font-size:48px; display:block; margin-bottom:12px;}
.filterBar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.chipToggle{border:1px solid var(--border); background:var(--panel); border-radius:20px; padding:6px 14px; font-size:12.5px;
  font-weight:600; color:var(--text2); transition:all .15s ease;}
.chipToggle:hover{border-color:var(--accent); color:var(--accent);}
.chipToggle.active{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 2px 6px rgba(158,98,49,.25);}

.dashGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:16px;}
.dashCard{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:20px;}
.dashCard h2{font-size:14px; font-weight:700; letter-spacing:.01em; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.statNums{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.statNum{background:var(--panel2); border-radius:11px; padding:14px 12px; text-align:center;}
.statNum b{font-size:23px; font-weight:700; display:block; color:var(--accent); letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.statNum span{font-size:11.5px; color:var(--text2); letter-spacing:.01em;}
.miniItem{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);}
.miniItem:last-child{border-bottom:none;}
.miniItem .grow{flex:1; min-width:0;}
.miniItem .t{display:block; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bookForm label{display:block; font-size:12px; font-weight:600; color:var(--text2); margin:10px 0 4px;}
.bookForm input,.bookForm textarea,.bookForm select{width:100%;}
.ring{width:92px; height:92px; flex-shrink:0;}
.ring circle{fill:none; stroke-width:9;}
.ring .bgC{stroke:var(--panel2);}
.ring .fgC{stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .5s;}
.ring text{fill:var(--text); font-size:16px; font-weight:700;}

/* Kapitel-Liste */
.chapRow{display:flex; align-items:center; gap:13px; background:var(--panel); border:1px solid var(--border);
  border-radius:12px; padding:13px 15px; margin-bottom:9px; box-shadow:var(--shadow-sm);
  transition:transform .18s ease, box-shadow .18s ease;}
.chapRow:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
.chapNum{width:38px; height:38px; border-radius:10px; background:var(--accent-light); display:flex; align-items:center;
  justify-content:center; font-weight:700; color:var(--accent); flex-shrink:0; font-variant-numeric:tabular-nums;}
.chapRow .grow{flex:1; min-width:0;}
.chapRow h3{font-size:14.5px;}
.chapRow .meta{font-size:12px; color:var(--text2); margin-top:2px;}
.moveBtns{display:flex; flex-direction:column; gap:2px;}
.moveBtns button{border:none; background:var(--panel2); border-radius:6px; font-size:10px; padding:2px 7px; color:var(--text2);}
.moveBtns button:hover{color:var(--accent);}

/* Plot-Board */
.kanban{display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:10px;}
.kCol{background:var(--panel2); border-radius:var(--radius); padding:10px; min-width:260px; width:260px; flex-shrink:0;}
.kCol h3{font-size:13px; font-weight:700; padding:4px 6px 2px; color:var(--text2); display:flex; justify-content:space-between;}
.kCol .sub{font-size:11px; color:var(--text2); padding:0 6px 10px;}
.kCard{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; cursor:grab; font-size:13px; box-shadow:var(--shadow); border-left:4px solid var(--accent);}
.kCard:active{cursor:grabbing;}
/* Ein ruhiges Pulsieren zeigt, wo es weitergeht. Bewusst kein hartes
   Blinken: das ist für empfindliche Augen unangenehm und wird von
   „prefers-reduced-motion" zu Recht abgeschaltet. */
@keyframes winken{
  0%,100%{ box-shadow:0 0 0 0 rgba(0,0,0,0); border-color:var(--border); }
  50%    { box-shadow:0 0 0 4px var(--bg-accent, rgba(120,120,255,.22)); border-color:var(--accent); }
}
.winkt{ animation:winken 1.4s ease-in-out 3; }
@media (prefers-reduced-motion:reduce){
  .winkt{ animation:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--bg-accent, rgba(120,120,255,.22)); }
}
.bfWink{grid-column:1/-1; margin:0 0 4px; font-size:12.5px; color:var(--text2); line-height:1.55;}
/* Folgenliste: Griff und Ziehmarken */
.folgeRow{position:relative; user-select:none; touch-action:pan-y;}
.fgGriff{color:var(--text3); font-size:14px; letter-spacing:-2px; cursor:grab; padding:0 2px; flex-shrink:0;}
.folgeRow.zieht{opacity:.55; cursor:grabbing;}
.folgeRow.davor::before, .folgeRow.dahinter::after{
  content:""; position:absolute; left:8px; right:8px; height:2px; background:var(--accent); border-radius:2px;}
.folgeRow.davor::before{top:-2px;}
.folgeRow.dahinter::after{bottom:-2px;}
.fgStaffel{margin-bottom:20px;}
.fgTitel{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text2);
  margin:0 0 8px; font-weight:600; letter-spacing:.02em;}
.fgZahl{font-size:11px; color:var(--text3); background:var(--panel2); border-radius:999px; padding:1px 8px;}
.fgHinweis{font-size:12px; color:var(--text3); margin:-4px 0 12px; line-height:1.5;}
/* ---------- Karten mit Markierungen ---------- */
.ktWrap{display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap;}
/* Sichtfenster fester Höhe; die Fläche darin trägt die Maße des Bildes
   und wird verschoben und skaliert. */
.ktSicht{position:relative; flex:1; min-width:min(100%,320px); overflow:hidden;
  height:clamp(280px, 62vh, 760px); border:1px solid var(--border);
  border-radius:var(--radius); background:var(--panel2); touch-action:none; cursor:grab;}
.ktSicht:active{cursor:grabbing;}
.ktWrap.setzt .ktSicht{cursor:crosshair; outline:2px dashed var(--accent); outline-offset:-2px;}
.ktFlaeche{position:absolute; left:0; top:0; transform-origin:0 0; line-height:0;
  transition:transform .12s ease-out;}
.ktGrund{display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none;}
.ktZoom{position:absolute; right:8px; bottom:8px; display:flex; gap:4px; z-index:2;}
.ktZoom .btn{background:var(--panel); border-color:var(--line-strong);}
/* Die Nadel ist der Anker: ihre Spitze sitzt genau auf der gespeicherten
   Stelle. Deshalb steht das Schild absolut darunter und zählt nicht zur
   Höhe des Knopfes – sonst läge der Anker am unteren Rand des Schildes,
   und die Markierung sprang beim Anfassen nach oben. */
.ktPin{position:absolute; transform:translate(-50%,-100%) scale(var(--kz,1));
  transform-origin:50% 100%; background:none; border:none;
  padding:0; cursor:pointer; width:16px; height:16px; touch-action:none;}
.ktNadel{display:block; width:16px; height:16px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
  background:var(--pf,#b0713a); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.45);}
.ktSchild{position:absolute; top:calc(100% + 5px); left:50%; transform:translateX(-50%);
  font-size:11px; line-height:1.3; color:var(--text);
  background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:1px 6px;
  max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;
  opacity:0; transition:opacity .12s; pointer-events:none;}
.ktPin:hover .ktSchild, .ktPin:focus-visible .ktSchild, .ktPin.an .ktSchild{opacity:1;}
.ktPin.an .ktNadel{outline:2px solid var(--accent); outline-offset:2px;}
.ktKarte{width:290px; flex-shrink:0; background:var(--panel); border:1px solid var(--line-strong);
  border-radius:var(--radius); padding:12px 13px; line-height:1.5;}
.ktKopf{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
.ktKopf b{flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; display:block;}
.ktPunkt{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.ktBild{width:100%; height:110px; object-fit:cover; border-radius:8px; cursor:zoom-in; margin-bottom:9px; display:block;}
.ktArt{font-size:11.5px; color:var(--text2);}
.ktName{font-size:14px; font-weight:600; color:var(--text); margin-bottom:6px;
  overflow-wrap:anywhere;}
.ktText{font-size:12.5px; color:var(--text2); margin:0 0 10px; overflow-wrap:anywhere;}
.ktLabel{display:block; font-size:11.5px; color:var(--text3); margin-bottom:4px;}
.ktKarte select{width:100%; margin-bottom:10px;}
.ktWege{display:flex; flex-wrap:wrap; gap:6px;}
.ktSuche{margin-top:12px; padding-top:11px; border-top:1px solid var(--border);}
.ktSuche input{width:100%; margin-bottom:7px;}
.ktTreffer{max-height:230px; overflow-y:auto; display:flex; flex-direction:column; gap:3px;}
.ktTreffer1{display:flex; align-items:center; gap:7px; width:100%; text-align:left;
  background:none; border:1px solid transparent; border-radius:var(--radius-sm);
  padding:5px 7px; cursor:pointer; font-size:12.5px; color:var(--text);}
.ktTreffer1:hover{background:var(--panel2); border-color:var(--border);}
.ktTreffer1.an{background:var(--panel2); border-color:var(--accent);}
.ktTreffer1 .tt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; display:block;}
.ktTreffer1 .tw{font-size:11px; color:var(--text3); flex-shrink:0; max-width:45%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
.ktLeer{font-size:12px; color:var(--text3); padding:6px 2px;}
.ktHinweis{font-size:12px; color:var(--text3); margin-top:10px;}
@media (max-width:760px){ .ktKarte{width:100%;} }
/* ---------- Beziehungsnetz und Stammbaum ---------- */
/* Bewegliche Fläche für Netz und Stammbaum – wie die Mindmap */
.bezWrap{position:relative; background:var(--panel2); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden; height:clamp(340px, 64vh, 780px);}
.bezSvg{width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
.bezSvg:active{cursor:grabbing;}
.bezZoom{position:absolute; right:10px; bottom:10px; display:flex; gap:5px;}
.bezZoom .btn{background:var(--panel); border-color:var(--line-strong);}
.nzKante line{stroke:var(--line-strong); stroke-width:1.6;}
.nzKante text{fill:var(--text2); font-size:11px;}
.nzSpitze{fill:var(--line-strong);}
.nzKnoten{cursor:pointer;}
.nzKnoten circle{fill:var(--panel); stroke:var(--accent); stroke-width:2.5;}
.nzKnoten:hover circle{stroke-width:3.5;}
.nzZeichen{font-size:17px;}
.nzName{fill:var(--text); font-size:12.5px; font-weight:600;}
.nzKnoten:hover .nzName{fill:var(--accent);}
/* Mindmap: freier Text ohne Rahmen, Notizzettel mit heller Fläche */
.mmNode text.mmTxt{font-weight:600;}
.mmNode text.mmTxt.text{font-weight:550; letter-spacing:.005em;}
.mmNode.n-text rect{display:none;}
.mmBild{cursor:zoom-in;}
.mmNode.sel .mmBild{opacity:.92;}
/* Tag-Vorschläge unter dem Eingabefeld */
.tagVor{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px;}
.tagVor:empty{display:none;}
.tvKopf{font-size:11.5px; color:var(--text3); flex-shrink:0;}
.tvChip{border:1px solid var(--border); background:var(--panel2); color:var(--text2);
  border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; line-height:1.5;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
.tvChip:hover{border-color:var(--line-strong); color:var(--text);}
.tvChip.an{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.tvHinweis{font-size:11.5px; color:var(--text3); flex-basis:100%; line-height:1.5;}
/* Werkzeuge am Akt: dezent, bis man mit der Maus hineinfährt */
.aktWerkzeug{display:inline-flex; gap:3px; margin-left:8px; opacity:.25; transition:opacity .12s; vertical-align:middle;}
.actHead:hover .aktWerkzeug, .kCol:hover .aktWerkzeug,
.actHead:focus-within .aktWerkzeug, .kCol:focus-within .aktWerkzeug{opacity:1;}
.aktWerkzeug .btn{padding:1px 6px; font-size:11px; line-height:1.5;}
.aktWerkzeug .btn[disabled]{opacity:.35; cursor:default;}
.kCol h3{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}

/* ---------- Rundgang ----------
   Der Scheinwerfer ist kein Loch in einer Fläche, sondern ein leerer
   Kasten mit einem sehr großen Schatten ringsum. Der Vorteil: die
   Mitte bleibt nicht nur sichtbar, sondern auch anklickbar – eine
   volle Überdeckung würde das erklärte Element sperren. */
.tourFolie{position:fixed; inset:0; z-index:1000; pointer-events:none;}
.tourLoch{position:absolute; border-radius:10px; pointer-events:none;
  box-shadow:0 0 0 9999px rgba(8,10,14,.62), 0 0 0 2px var(--accent) inset;
  outline:2px solid var(--accent); outline-offset:0;
  transition:left .22s ease, top .22s ease, width .22s ease, height .22s ease;}
.tourBlase{position:absolute; pointer-events:auto; background:var(--panel);
  border:1px solid var(--line-strong); border-radius:14px; padding:16px 16px 13px;
  box-shadow:0 18px 44px rgba(0,0,0,.45); max-width:calc(100vw - 24px);
  transition:left .22s ease, top .22s ease;}
.tourBlase:focus{outline:none;}
.tourBlase:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
.tbKopf{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.tbZaehler{font-size:11.5px; font-weight:650; letter-spacing:.03em; color:var(--accent);
  background:var(--panel2); border-radius:999px; padding:3px 10px; flex:1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
.tbX{border:none; background:none; color:var(--text2); font-size:13px; cursor:pointer;
  width:24px; height:24px; border-radius:6px; padding:0; flex-shrink:0;}
.tbX:hover{background:var(--panel2); color:var(--text);}
.tourBlase h3{margin:0 0 6px; font-size:15px; color:var(--text); line-height:1.35;}
.tourBlase p{margin:0 0 12px; font-size:13px; color:var(--text2); line-height:1.6;}
.tbBalken{height:3px; background:var(--panel2); border-radius:999px; overflow:hidden; margin-bottom:11px;}
.tbBalken>div{height:100%; background:var(--accent); border-radius:999px; transition:width .22s ease;}
.tbFuss{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
/* Nur für Vorlesesoftware: sichtbar leer, aber vorhanden */
.tourStill{position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;}
/* Ablegefläche beim Ziehen einer Datei über das Fenster */
.dropZone{position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center; pointer-events:none;}
.dzInner{background:var(--panel); border:2px dashed var(--accent); border-radius:16px;
  padding:34px 44px; text-align:center; max-width:min(420px,86vw); box-shadow:var(--shadow);}
.dzIcon{font-size:34px; line-height:1; margin-bottom:10px; color:var(--accent);}
.dzTitel{font-size:16px; font-weight:650; color:var(--text); margin-bottom:6px;}
.dzSub{font-size:12.5px; color:var(--text2); line-height:1.5;}

/* ---------- Ordner-Ansicht ----------
   Zwei Spalten wie im Explorer: links der Baum, rechts der Inhalt. Unter
   860 px stapeln sie sich, damit auf schmalen Fenstern nichts abgeschnitten
   wird. Farben kommen aus den Profi-Tokens, nicht aus festen Werten. */
.obWrap{display:grid; grid-template-columns:260px 1fr; height:100%; min-height:0;}
.obBaum{border-right:1px solid var(--p-line); overflow:auto; padding:6px 0; background:var(--p-bg2);}
.obZeile{display:flex; align-items:center; gap:6px; padding:5px 8px; font-size:12.5px;
  color:var(--p-txt2); cursor:pointer; user-select:none; border-radius:5px; margin:0 4px;}
.obZeile:hover{background:var(--p-bg3); color:var(--p-txt);}
.obZeile.aktiv{background:var(--p-bg4); color:var(--p-txt);}
.obZeile.obZiel{outline:2px dashed var(--p-acc); outline-offset:-2px;}
.obPfeil{border:none; background:none; color:var(--p-txt2); width:16px; padding:0;
  font-size:10px; cursor:pointer; flex-shrink:0;}
.obName{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
.obZahl{font-size:11px; color:var(--p-txt2); flex-shrink:0;}
.obListe{overflow:auto; min-width:0;}
.obKopf{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px; border-bottom:1px solid var(--p-line); background:var(--p-bg2);}
.obKrumen{display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex:1; min-width:0;}
.obKrume{border:none; background:none; color:var(--p-txt); font-size:13px; cursor:pointer;
  padding:2px 4px; border-radius:4px; max-width:220px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; display:block;}
.obKrume:hover{background:var(--p-bg3);}
.obTrenn{color:var(--p-txt2); font-size:12px;}
.obWerkzeug{display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;}
.obMeta{padding:8px 14px; font-size:12px; color:var(--p-txt2);}
.obEintrag{display:flex; align-items:center; gap:10px; padding:8px 14px; font-size:13px;
  color:var(--p-txt); border-bottom:1px solid var(--p-line); cursor:pointer;}
.obEintrag:hover{background:var(--p-bg2);}
.obEintrag.obZiel{outline:2px dashed var(--p-acc); outline-offset:-2px;}
.obEintrag .ic{flex-shrink:0; font-size:15px;}
.obEintrag .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
.obEintrag .tg{font-size:11.5px; color:var(--p-txt2); flex-shrink:0;
  max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
.ob-knoepfe{display:flex; gap:3px; flex-shrink:0; opacity:0; transition:opacity .12s;}
.obEintrag:hover .ob-knoepfe, .obEintrag:focus-within .ob-knoepfe{opacity:1;}
.obLeer{padding:26px 16px; font-size:12.5px; color:var(--p-txt2); line-height:1.6;}
@media (max-width:860px){
  .obWrap{grid-template-columns:1fr; grid-template-rows:auto 1fr;}
  .obBaum{border-right:none; border-bottom:1px solid var(--p-line); max-height:34vh;}
}
/* Bearbeiten und Löschen direkt auf der Karte. Sie erscheinen beim
   Überfahren, damit das Board ruhig bleibt – über die Tastatur sind sie
   trotzdem erreichbar, deshalb :focus-within. */
.kCard{position:relative;}
.kWeg{position:absolute; top:6px; right:6px; display:flex; gap:2px; opacity:0; transition:opacity .12s;}
.kCard:hover .kWeg, .kCard:focus-within .kWeg{opacity:1;}
.kWeg button{border:none; background:var(--panel-2, rgba(127,127,127,.18)); color:var(--text2);
  width:22px; height:22px; border-radius:6px; font-size:11px; line-height:1; cursor:pointer; padding:0;}
.kWeg button:hover{background:var(--line-strong); color:var(--text);}
.kWeg button:last-child:hover{background:var(--bad); color:#fff;}
.kCard b{display:block; padding-right:52px;}
.kCol.dragOver{outline:2px dashed var(--accent); outline-offset:-4px;}
.plotDot{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:5px;}

/* Zeitleiste */
.tlWrap{max-width:760px; margin:0 auto; position:relative; padding-left:26px;}
.tlWrap::before{content:""; position:absolute; left:7px; top:0; bottom:0; width:3px; background:var(--border); border-radius:2px;}
.tlItem{position:relative; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:12px; box-shadow:var(--shadow);}
.tlItem::before{content:""; position:absolute; left:-24px; top:18px; width:13px; height:13px; border-radius:50%; background:var(--accent); border:3px solid var(--bg);}
.tlItem .date{font-size:12px; font-weight:700; color:var(--accent);}
.tlItem h3{font-size:14.5px; margin:2px 0 4px;}
.tlItem p{font-size:13px; color:var(--text2); line-height:1.45;}
.tlBtns{position:absolute; top:10px; right:10px; display:flex; gap:4px;}

/* Statistiken */
.barRow{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px;}
.barRow .lbl{width:130px; text-align:right; color:var(--text2); flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.barRow .bar{flex:1; background:var(--panel2); border-radius:6px; height:20px; overflow:hidden;}
.barRow .bar>div{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:6px; min-width:2px; transition:width .4s;}
.barRow .val{width:46px; font-weight:700;}

/* ---------- PROFI-MODUS ----------
   Kompakte Werkzeugoberfläche: dichter, mit Menüleiste, Tabelle und
   Eigenschaftenspalte. Der Unterschied zum einfachen Modus liegt in
   Dichte und Anordnung – nicht in der Farbe.

   Deshalb sind die --p-*-Variablen nur noch Rollennamen, die auf
   dieselben Farben zeigen wie der einfache Modus. Ein Hell/Dunkel-
   Wechsel wirkt damit automatisch in beiden Oberflächen, und es gibt
   keine zweite Palette mehr, die man beim Nachbessern vergessen kann. */
body.pro{
  --p-bg:var(--bg);                 /* Hauptfläche              */
  --p-bg2:var(--sidebar);           /* Seitenspalten            */
  --p-bg3:var(--chip);              /* erhabene Flächen, Hover  */
  --p-bg4:var(--titlebar);          /* Menü- und Statusleiste   */
  --p-feld:var(--panel);            /* Eingabefelder            */
  --p-line:var(--border);
  --p-line2:var(--border-subtle);
  --p-hover:var(--line-strong);
  --p-txt:var(--text);
  --p-txt2:var(--text2);
  --p-txt3:var(--text3);
  --p-acc:var(--accent);
  --p-sel:var(--accent2);           /* Auswahl                  */
  --row:23px;
}
/* Die Auswahlfarbe braucht zusätzlich eine durchscheinende Fassung für
   markierte Tabellenzeilen – die lässt sich aus einer Variablen nicht
   ableiten, deshalb je Thema einmal ausgeschrieben. */
:root{ --p-sel-weak:rgba(111,99,200,.15); }
[data-theme="dark"]{ --p-sel-weak:rgba(139,131,224,.20); }
#proUI{display:none; flex-direction:column; height:100vh; background:var(--p-bg); color:var(--p-txt); font-size:12px; line-height:1.45;}
body.pro #proUI{display:flex;} body.pro #simpleUI{display:none;}
.pMenubar{display:flex; align-items:center; background:var(--p-bg4); border-bottom:1px solid var(--p-line); padding:0 0 0 6px; height:28px; user-select:none; -webkit-app-region:drag;}
.pMenubar .appIco{color:var(--p-acc); font-weight:700; padding:0 10px 0 4px; font-size:12px; letter-spacing:.02em;}
/* Ohne Fensterrahmen braucht auch der Profi-Modus eigene Fensterknöpfe */
.pWinBtns{margin-left:auto; display:flex; -webkit-app-region:no-drag;}
.pWinBtns button{background:none; border:none; color:var(--p-txt2); width:42px; height:28px; font-size:11px;
  display:flex; align-items:center; justify-content:center; border-radius:0;}
.pWinBtns button:hover{background:var(--p-bg3); color:var(--p-txt);}
.pWinBtns button.x:hover{background:var(--bad); color:#fff;}
.pMenu{position:relative; -webkit-app-region:no-drag;}
.pMenu>button{background:none; border:none; color:var(--p-txt2); padding:5px 10px; font-size:12px; border-radius:3px;}
.pMenu>button:hover,.pMenu.open>button{background:var(--p-bg3); color:var(--p-txt);}
.pDrop{display:none; position:absolute; top:27px; left:0; background:var(--panel); border:1px solid var(--p-line); border-radius:var(--radius-sm); min-width:250px; padding:4px; z-index:60; box-shadow:var(--shadow-lg);}
.pMenu.open .pDrop{display:block;}
.pDrop button{display:flex; justify-content:space-between; gap:20px; width:100%; background:none; border:none; color:var(--p-txt); padding:5px 11px; font-size:12px; text-align:left; border-radius:3px;}
.pDrop button:hover{background:var(--p-sel); color:#fff;}
.pDrop button:hover .kb{color:rgba(255,255,255,.72);}
.pDrop .sep{height:1px; background:var(--p-line2); margin:4px 6px;}
.pDrop .kb{color:var(--p-txt3); font-size:11px; font-family:var(--font-mono);}
.pWsBar{display:flex; align-items:center; background:var(--p-bg2); border-bottom:1px solid var(--p-line); padding:0 6px; height:30px; gap:1px;}
.pWs{background:none; border:none; color:var(--p-txt2); padding:6px 13px; font-size:12px; border-radius:4px 4px 0 0;}
.pWs:hover{color:var(--p-txt); background:var(--p-bg3);}
.pWs.active{background:var(--p-bg); color:var(--p-txt); box-shadow:inset 0 -2px 0 var(--p-acc);}
.pWsBar input{margin-left:auto; background:var(--p-feld); border:1px solid var(--p-line); color:var(--p-txt); font-size:11.5px; padding:4px 9px; border-radius:var(--radius-sm); width:210px;}
.pWsBar input:focus{border-color:var(--p-acc); box-shadow:none;}
.pBody{flex:1; display:flex; overflow:hidden;}
/* Die linke Spalte trägt oben die Liste und unten den Moduswechsel */
.pSideWrap{width:218px; flex-shrink:0; display:flex; flex-direction:column; min-height:0;
  background:var(--p-bg2); border-right:1px solid var(--p-line);}
.pSide{flex:1; overflow-y:auto; padding:6px; min-height:0;}
body.pro .sideFoot{border-top:1px solid var(--p-line); padding:8px 10px; gap:7px;}
body.pro .sideFoot .fl{color:var(--p-txt2); font-size:11px;}
body.pro .switch{background:var(--p-line2);}
body.pro .switch.on{background:var(--p-acc);}
body.pro .iconBtn{border-color:var(--p-line); color:var(--p-txt2); background:var(--p-bg3);}
body.pro .iconBtn:hover{background:var(--p-hover); color:var(--p-txt); border-color:var(--line-strong);}
.pSide h4{font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--p-txt3); padding:9px 6px 4px; font-weight:700;}
.pSideItem{display:flex; justify-content:space-between; align-items:center; padding:3px 8px; min-height:var(--row); border-radius:3px; cursor:pointer; color:var(--p-txt2);}
.pSideItem:hover{background:var(--p-bg3); color:var(--p-txt);}
.pSideItem.active{background:var(--p-sel); color:#fff;}
.pSideItem .n{color:var(--p-txt3); font-size:11px; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.pSideItem.active .n{color:rgba(255,255,255,.72);}
.pMain{flex:1; overflow:auto; background:var(--p-bg); position:relative;}
.pProps{width:288px; background:var(--p-bg2); border-left:1px solid var(--p-line); overflow-y:auto; padding:10px; flex-shrink:0;}
.pProps h4{font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--p-txt3); margin:12px 0 6px; font-weight:700;}
.pProps h4:first-child{margin-top:2px;}
.pProps label{display:block; font-size:11px; color:var(--p-txt2); margin:8px 0 3px;}
.pProps input,.pProps select,.pProps textarea{width:100%; background:var(--p-feld); border:1px solid var(--p-line); color:var(--p-txt); font-size:11.5px; padding:5px 8px; border-radius:var(--radius-sm);}
.pProps input:focus,.pProps select:focus,.pProps textarea:focus{border-color:var(--p-acc); box-shadow:none;}
.pStatusbar{display:flex; align-items:center; gap:18px; background:var(--p-bg4); border-top:1px solid var(--p-line); padding:4px 14px; font-size:11px; color:var(--p-txt2); height:24px; white-space:nowrap; overflow-x:auto;}
.pStatusbar::-webkit-scrollbar{height:0;}
.pTable{width:100%; border-collapse:collapse; font-size:12px;}
.pTable th{position:sticky; top:0; background:var(--p-bg3); color:var(--p-txt2); text-align:left; padding:6px 10px; border-bottom:1px solid var(--p-line); cursor:pointer; user-select:none; white-space:nowrap; z-index:5; font-weight:650; font-size:11px; text-transform:uppercase; letter-spacing:.4px;}
.pTable th:hover{color:var(--p-txt);}
.pTable td{padding:4px 10px; height:var(--row); border-bottom:1px solid var(--p-line2); color:var(--p-txt); white-space:nowrap; max-width:300px; overflow:hidden; text-overflow:ellipsis;}
.pTable tbody tr:hover{background:var(--p-bg3);}
.pTable tr.sel{background:var(--p-sel-weak);} .pTable tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--p-acc);}
.pBtn{background:var(--p-bg3); border:1px solid var(--p-line); color:var(--p-txt); padding:5px 12px; font-size:11.5px; border-radius:4px;}
.pBtn:hover{background:var(--p-hover);} .pBtn.accent{background:var(--p-acc); border-color:transparent; color:var(--accent-ink); font-weight:650;} .pBtn.accent:hover{filter:brightness(1.08);}
body.pro .kCol{background:var(--p-bg2);} body.pro .kCard{background:var(--panel); border-color:var(--p-line); color:var(--p-txt); box-shadow:none;}
body.pro .kCol h3{color:var(--p-txt2);} body.pro .kCol .sub{color:var(--p-txt3);}
body.pro .tlWrap::before{background:var(--border);}
body.pro .tlItem{background:var(--panel); border-color:var(--p-line); box-shadow:none;} body.pro .tlItem::before{border-color:var(--p-bg); background:var(--p-acc);}
body.pro .tlItem .date{color:var(--p-acc);} body.pro .tlItem p{color:var(--p-txt2);}
body.pro .barRow .bar{background:var(--p-bg3);} body.pro .barRow .bar>div{background:var(--p-acc);}
body.pro .barRow .lbl{color:var(--p-txt2);}
body.pro .moveBtns button{background:var(--p-bg3); color:var(--p-txt2);}
body.pro .btn{background:var(--p-bg3); border-color:var(--p-line); color:var(--p-txt);}
body.pro .btn:hover{background:var(--p-hover);}
body.pro .btn.primary{background:var(--p-acc); color:var(--accent-ink); border-color:transparent;}
body.pro .progressBar{background:var(--p-bg3); box-shadow:none;}

/* Bilder */
.cardImg{width:100%; height:150px; object-fit:cover; border-radius:10px; background:var(--panel2); cursor:zoom-in;}
.formImgPrev{max-width:100%; max-height:170px; border-radius:10px; display:block; cursor:zoom-in;}
.mCard[onclick],.chapRow[onclick]{cursor:pointer;}

/* Lightbox */
.lightbox{position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:400; display:flex; align-items:center; justify-content:center; cursor:zoom-out;}
.lightbox img{max-width:94vw; max-height:92vh; border-radius:8px; box-shadow:0 20px 80px rgba(0,0,0,.6);}

/* ============================================================
   DETAILSEITE
   Zuerst die Zusammenfassung als Fließtext, darunter die kurzen
   Angaben als Beschriftung/Wert-Zeilen, zuletzt die Beziehungen
   als eigene Karten. Wenig Rahmen, viel Ruhe – man liest hier,
   man bedient nicht.
   ============================================================ */
.detailModal{width:640px; max-width:100%;}
.dKopf{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.dKopf h2{font-size:19px; margin:0; min-width:0; overflow-wrap:anywhere;}
.dArt{font-size:12px; color:var(--text2); font-weight:600;}
.dKnoepfe{display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;}

.dBilder{margin-bottom:16px;}
.dBildGross{width:100%; max-height:280px; object-fit:cover; border-radius:var(--radius); cursor:zoom-in; display:block;}
.dBildReihe{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.dBildReihe img{width:84px; height:84px; object-fit:cover; border-radius:10px; cursor:zoom-in;}

.dBlock{margin-bottom:22px;}
.dBlock h3{font-size:14.5px; font-weight:650; margin-bottom:8px;}
.dBlockKopf{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.dBlockKopf h3{margin:0; flex:1; min-width:0;}
.dBlockKnoepfe{display:flex; gap:6px; flex-shrink:0;}
.dFliess{font-size:14px; line-height:1.65; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere;}
.dLeer{font-size:13px; color:var(--text3); line-height:1.55;}
/* Der eigene Textplatz: echte Absätze statt einer Textwand. Die Breite
   wird begrenzt, weil sich lange Zeilen schlecht lesen. */
.dLangtext{font-size:14px; line-height:1.72; color:var(--text); max-width:68ch; overflow-wrap:anywhere;}
.dLangtext p{margin:0 0 0.95em 0;}
.dLangtext p:last-child{margin-bottom:0;}

/* Kurze Angaben: Beschriftung links, Wert rechts, dünne Linie dazwischen */
.dTabelle{margin-bottom:22px;}
.dRow{display:flex; gap:18px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border-subtle);}
.dRow:last-child{border-bottom:none;}
.dK{width:36%; max-width:190px; flex-shrink:0; font-size:13.5px; font-weight:650; color:var(--text);
  overflow-wrap:anywhere;}
.dV{flex:1; min-width:0; font-size:13.5px; line-height:1.55; color:var(--text2); white-space:pre-wrap; overflow-wrap:anywhere;}
.dTags{margin-bottom:18px;}

/* Beziehungen als Karten mit Richtung, Namensmarke und Beschreibung */
.bezListe{display:flex; flex-direction:column; gap:8px;}
.bezKarte{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  border:1px solid var(--border); border-radius:var(--radius); padding:10px 11px; background:var(--bg2);}
.bezPfeil{flex-shrink:0; width:26px; height:26px; border-radius:7px; background:var(--panel);
  border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center;
  font-size:13px; color:var(--text2);}
.bezChip{flex:1; min-width:0; text-align:left; background:var(--kt-kapitel-bg); color:var(--kt-kapitel-fg);
  border:none; border-radius:6px; padding:3px 9px; font-size:12.5px; font-weight:650;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}
.bezChip:hover{filter:brightness(1.06);}
.bezWeg{flex-shrink:0; width:22px; height:22px; border-radius:50%; border:1px solid var(--border);
  background:var(--panel); color:var(--text3); font-size:11px; display:flex; align-items:center; justify-content:center;}
.bezWeg:hover{border-color:var(--bad); color:var(--bad);}
.bezText{flex-basis:100%; font-size:13.5px; color:var(--text); line-height:1.5; overflow-wrap:anywhere;}
.bezNotiz{margin-top:10px; padding-top:10px; border-top:1px solid var(--border-subtle);
  font-size:12.5px; color:var(--text2); line-height:1.55; overflow-wrap:anywhere;}
body.pro .bezKarte{background:var(--p-bg3); border-color:var(--p-line);}
body.pro .bezPfeil{background:var(--p-bg2); border-color:var(--p-line); color:var(--p-txt2);}
body.pro .bezWeg{background:var(--p-bg2); border-color:var(--p-line); color:var(--p-txt2);}
@media(max-width:520px){ .dRow{flex-direction:column; gap:3px;} .dK{width:100%; max-width:none;} }

/* Detailseite */
.dField{margin-bottom:10px;}
.dField .lb{font-size:11.5px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.4px;}
.dField .vl{font-size:14px; line-height:1.5; white-space:pre-wrap;}
body.pro .dField .lb{color:var(--p-txt2);}
.dSection{margin-top:16px; padding-top:12px; border-top:1px solid var(--border);}
body.pro .dSection{border-color:var(--p-line2);}
.dSection h4{font-size:13px; margin-bottom:8px; color:var(--text2);}
.linkChip{display:inline-flex; align-items:center; gap:5px; background:var(--chip); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:13px; font-weight:600; margin:0 6px 6px 0; cursor:pointer; color:var(--text);}
.linkChip:hover{border-color:var(--accent); color:var(--accent);}
body.pro .linkChip{background:var(--p-bg3); border-color:var(--p-line); color:var(--p-txt);}
.dTl{border-left:3px solid var(--accent); padding-left:12px; margin:4px 0 4px 4px;}
.dTl .dt{font-size:12px; font-weight:700; color:var(--accent);}
.dTl .tt{font-size:13.5px; cursor:pointer;}
.dTl .tt:hover{color:var(--accent);}
.stepRow{display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.stepRow:last-of-type{border-bottom:none;}
.stepRow input[type=checkbox]{width:17px; height:17px; accent-color:var(--accent); cursor:pointer; flex-shrink:0;}
.stepDone{text-decoration:line-through; color:var(--text2);}
body.pro .stepRow{border-color:var(--p-line2);}

/* Mindmap */
.mmToolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center;}
.mmToolbar select{font-size:13px; padding:6px 9px; max-width:190px;}
.mmWrap{position:relative; background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden; height:calc(100vh - 250px); min-height:420px; box-shadow:var(--shadow);}
body.pro .mmWrap{background:var(--p-bg4); border-color:var(--p-line); border-radius:var(--radius);}
.mmWrap svg{width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
.mmWrap svg.panning{cursor:grabbing;}
.mmNode{cursor:pointer;}
.mmNode rect{stroke:rgba(0,0,0,.15); stroke-width:1.5; filter:drop-shadow(0 2px 4px rgba(0,0,0,.18));}
.mmNode.sel rect{stroke:var(--accent); stroke-width:3;}
body.pro .mmNode.sel rect{stroke:var(--p-acc);}
.mmNode text{fill:#fff; font-size:14px; font-weight:600; pointer-events:none; user-select:none;}
.mmEdge{stroke:var(--border); stroke-width:2.5; fill:none;}
body.pro .mmEdge{stroke:var(--line-strong);}
.mmHint{position:absolute; bottom:10px; left:12px; font-size:11.5px; color:var(--text2); pointer-events:none; background:var(--panel); padding:4px 10px; border-radius:8px; opacity:.9;}
body.pro .mmHint{background:var(--p-bg2); color:var(--p-txt2);}
.colorDot{width:22px; height:22px; border-radius:50%; border:2px solid var(--border); cursor:pointer; padding:0;}
.colorDot:hover{transform:scale(1.15);}
.mmNode image{pointer-events:none;}
.mmPlay{cursor:pointer;}
.mmPlay circle{fill:rgba(0,0,0,.55);}
.mmPlay:hover circle{fill:rgba(0,0,0,.8);}
.mmPlay text{fill:#fff; font-size:13px; pointer-events:none;}
.videoOverlay{position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:300; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:20px;}
.videoOverlay video{max-width:92vw; max-height:80vh; border-radius:12px; background:#000;}
.videoOverlay button{border:none; background:#fff; color:#222; font-weight:700; padding:9px 22px; border-radius:10px; font-size:14px;}

/* ---------- Modal & Toast ---------- */
.overlay{position:fixed; inset:0; background:rgba(28,20,10,.5); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  display:none; align-items:flex-start; justify-content:center; z-index:100; padding:34px 14px; overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:680px; max-width:100%; padding:26px; animation:modalIn .18s cubic-bezier(.4,0,.2,1);}
@keyframes modalIn{from{opacity:0; transform:translateY(-8px) scale(.99);} to{opacity:1; transform:none;}}
body.pro .modal{background:var(--panel); color:var(--p-txt); border:1px solid var(--p-line);}
body.pro .modal input,body.pro .modal select,body.pro .modal textarea{background:var(--p-feld); border-color:var(--p-line); color:var(--p-txt);}
body.pro .modal .btn{background:var(--p-bg3); color:var(--p-txt);} body.pro .modal .btn.primary{background:var(--p-acc); color:var(--accent-ink);}
.modal h2{font-size:18px; margin-bottom:16px;}
.formGrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.formGrid .full{grid-column:1/-1;}
.formGrid label{display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:4px;}
body.pro .formGrid label{color:var(--p-txt2);}
.formGrid input,.formGrid select,.formGrid textarea{width:100%;}
.modalBtns{display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center;}
#toasts{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:#2a211a; color:#f6f1ea; padding:12px 20px; border-radius:12px; font-size:13.5px; line-height:1.45;
  box-shadow:var(--shadow-lg); display:flex; gap:14px; align-items:center; animation:tin .25s cubic-bezier(.4,0,.2,1);
  max-width:90vw; border:1px solid rgba(255,255,255,.07);}
.toast button{background:none; border:none; color:#e8a76a; font-weight:700; font-size:13.5px;}
.toast button:hover{color:#f5c08a;}
@keyframes tin{from{opacity:0; transform:translateY(12px);} to{opacity:1;}}
@media(max-width:900px){ .pSideWrap,.pProps{display:none;} .formGrid{grid-template-columns:1fr;}
  :root{--side-w:210px;} .mainHead{padding:14px 16px 12px;} #sContent{padding:6px 16px 32px;} }


/* ================= FEINSCHLIFF =================
   Barrierefreiheit, Ziffernsatz und Verhalten auf kleinen Bildschirmen. */

/* Tastaturbedienung sichtbar machen – vorher hatten nur Eingabefelder einen Fokusring */
.btn:focus-visible,.navItem:focus-visible,.projCard:focus-visible,.chipToggle:focus-visible,
.switch:focus-visible,.iconBtn:focus-visible,.linkBtn:focus-visible,.sceneRow:focus-visible,
.pBtn:focus-visible,.pWs:focus-visible,.linkChip:focus-visible,.moveBtns button:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;}
body.pro .btn:focus-visible,.pBtn:focus-visible,.pWs:focus-visible{outline-color:var(--p-acc);}

/* Zahlen laufen in Tabellen und Statistiken sonst optisch auseinander */
.pTable td,.barRow .val,.statNum b,.pSideItem .n,.storBar+div,.progRow span,.chapNum,.tlItem .date{
  font-variant-numeric:tabular-nums;}

/* Überschriften im Inhaltsbereich */
.mCard h3,.chapRow h3,.tlItem h3{font-size:14.5px; font-weight:650; letter-spacing:-.005em;}
.mCard .desc{line-height:1.5;}
.dField .vl{line-height:1.6;}
.emptyMsg{color:var(--text2); line-height:1.6;}
.emptyMsg .big{opacity:.45;}

/* Mindmap und Lightbox an die neuen Radien angleichen */
.mmWrap{border-radius:var(--radius); box-shadow:var(--shadow-sm);}
.mmHint{background:var(--panel); border:1px solid var(--border-subtle); color:var(--text2);}
.cardImg,.formImgPrev{border-radius:11px;}
.linkChip{background:var(--panel2); border-color:var(--border-subtle); transition:all .15s ease;}
.linkChip:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-light);}
.kCard{box-shadow:var(--shadow-sm); border-radius:9px;}
.kCol{background:var(--panel2); border:1px solid var(--border-subtle);}
.tlItem{box-shadow:var(--shadow-sm);}
.dashCard h2,.kCol h3{text-transform:none;}

/* Bewegung reduzieren, wenn das System es verlangt */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important; scroll-behavior:auto !important;}
  .mCard:hover,.chapRow:hover,.btn:hover{transform:none;}
}

/* ============================================================
   EIGENE DIALOGE UND MENÜS
   ============================================================ */
.dlgOverlay{align-items:center; z-index:500;}
.dlgModal{width:460px; padding:22px 24px;}

/* ---------- Rechtliches ----------
   Impressum, Datenschutz und Lizenz liegen als Textdateien im Paket.
   Sie hier zu zeigen ist keine Kür: Anbieterangaben müssen ohne Umweg
   erreichbar sein, und die App läuft offline – ein Link ins Netz wäre
   also gerade dann nutzlos, wenn man ihn braucht. */
.rtModal{width:min(760px, 92vw); height:min(78vh, 720px); padding:0; display:flex; flex-direction:column;}
.rtKopf{display:flex; align-items:center; gap:10px; padding:16px 20px 0;}
.rtKopf h2{font-size:16px; margin:0; flex:1;}
.rtReiter{display:flex; gap:6px; padding:12px 20px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.rtReiter button{background:none; border:none; border-bottom:2px solid transparent; color:var(--text2);
  padding:8px 10px; font-size:13px; cursor:pointer; border-radius:6px 6px 0 0;}
.rtReiter button:hover{color:var(--text); background:var(--panel2);}
.rtReiter button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600;}
.rtInhalt{flex:1; overflow:auto; padding:18px 24px; line-height:1.7; font-size:13.5px;}
.rtInhalt h1{font-size:18px; margin:0 0 12px;}
.rtInhalt h2{font-size:15px; margin:22px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--border);}
.rtInhalt h3{font-size:13.5px; margin:16px 0 6px; color:var(--accent);}
.rtInhalt p{margin:0 0 10px;}
.rtInhalt li{margin:0 0 6px 18px;}
.rtInhalt code{font-family:ui-monospace,Consolas,monospace; font-size:12.5px; background:var(--panel2);
  padding:1px 5px; border-radius:4px;}
.rtInhalt blockquote{margin:0 0 12px; padding:10px 14px; background:var(--panel2);
  border-left:3px solid var(--accent); border-radius:0 6px 6px 0; color:var(--text2);}
.rtInhalt .luecke{background:rgba(176,113,58,.18); border-radius:3px; padding:0 3px;}
.rtFuss{display:flex; align-items:center; gap:10px; padding:12px 20px; border-top:1px solid var(--border);}
.rtFuss .hinweis{flex:1; font-size:11.5px; color:var(--text3); line-height:1.5;}
body.pro .rtModal{background:var(--p-bg2); border-color:var(--p-line);}
.dlgModal h2{font-size:16px; margin-bottom:10px;}
.dlgText{font-size:13.5px; line-height:1.55; color:var(--text2); white-space:pre-wrap; margin-bottom:6px;
  max-height:46vh; overflow-y:auto;}
.bildVorschau{display:flex; flex-wrap:wrap; gap:8px;}
.bildWahl{display:flex; gap:8px; margin-top:8px; align-items:center;}
.bildWahl input[type=file]{flex:1; padding:5px; min-width:0;}
.feldLabel{display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:4px;}
#kindPickWrap{margin-bottom:14px;}
#kindPickWrap select{width:100%;}
.dlgLabel{display:block; font-size:12px; font-weight:600; color:var(--text2); margin:14px 0 5px;}
.dlgInput{width:100%; font-size:13.5px;}
.btn.danger{background:var(--bad); color:#fff; border-color:transparent; font-weight:650;}
.btn.danger:hover{background:var(--bad); filter:brightness(1.1);}
body.pro .dlgModal{background:var(--panel); color:var(--p-txt); border-color:var(--p-line);}
body.pro .dlgText{color:var(--p-txt2);}
body.pro .dlgLabel{color:var(--p-txt2);}
body.pro .dlgInput{background:var(--p-feld); border-color:var(--p-line); color:var(--p-txt);}

.popupMenu{position:fixed; z-index:520; min-width:262px; max-height:calc(100vh - 60px); overflow-y:auto;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:5px;}
.popItem{display:flex; align-items:baseline; gap:10px; width:100%; text-align:left; background:none; border:none;
  border-radius:var(--radius-sm); padding:7px 10px; font-size:13px; color:var(--text); flex-wrap:wrap;}
.popItem:hover{background:var(--panel2);}
.popItem.aus{color:var(--text3); cursor:default;}
.popItem.aus:hover{background:none;}
.popItem .pl{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.popItem .pk{font-family:var(--font-mono); font-size:10.5px; color:var(--text3); white-space:nowrap;}
.popItem .ps{flex-basis:100%; font-size:10.5px; color:var(--text3); margin-top:-2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.popSep{height:1px; background:var(--border-subtle); margin:4px 8px;}
body.pro .popupMenu{background:var(--panel); border-color:var(--p-line);}
body.pro .popItem{color:var(--p-txt);} body.pro .popItem:hover{background:var(--p-bg3);}
body.pro .popItem .pk,body.pro .popItem .ps{color:var(--p-txt3);}
body.pro .popSep{background:var(--p-line2);}

/* Punkt an der Projektkarte: es gibt ungesicherte Änderungen */
.projCard .pDot{color:var(--accent); font-size:15px; line-height:0; vertical-align:middle;}

/* ============================================================
   JSON EINLESEN
   Der Dialog zeigt je Datensatz eine Tabelle Quellfeld → Zielfeld.
   Bewusst breit: die Zuordnung prüft man nur, wenn man Feldname,
   Ziel und Beispielwert nebeneinander sieht.
   ============================================================ */
.jsonModal{width:820px; max-width:100%;}
.jsSatz{border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px;
  background:var(--bg2); transition:opacity .15s ease;}
.jsSatz.aus{opacity:.45;}
.jsKopf{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.jsAn{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; cursor:pointer;}
.jsAn input{width:16px; height:16px; accent-color:var(--accent); cursor:pointer;}
.jsPfad{font-family:var(--font-mono); font-size:11.5px; color:var(--text2); background:var(--panel2);
  border:1px solid var(--border-subtle); border-radius:5px; padding:2px 7px; word-break:break-all;}
.jsAnzahl{font-size:11.5px; color:var(--text3); margin-left:auto; white-space:nowrap;}
.jsKopf select{font-size:12.5px; padding:5px 8px;}
.jsTabelle{width:100%; border-collapse:collapse; font-size:12.5px;}
.jsTabelle th{text-align:left; font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text3); padding:4px 8px 6px; border-bottom:1px solid var(--border-subtle);}
.jsTabelle td{padding:4px 8px; border-bottom:1px solid var(--border-subtle); vertical-align:middle;}
.jsTabelle tr:last-child td{border-bottom:none;}
.jsTabelle tr.jsAus{opacity:.5;}
.jsTabelle code{font-family:var(--font-mono); font-size:11.5px; color:var(--text); word-break:break-all;}
.jsTabelle select{width:100%; font-size:12px; padding:4px 6px;}
.jsTabelle td:first-child{width:30%;} .jsTabelle td:nth-child(2){width:32%;}
.jsTabelle td.jsWert{color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:0;}
.jsSumme{margin-right:auto; font-size:12.5px; color:var(--text2); align-self:center;}
body.pro .jsSatz{background:var(--p-bg2); border-color:var(--p-line);}
body.pro .jsPfad{background:var(--p-bg3); border-color:var(--p-line); color:var(--p-txt2);}
body.pro .jsTabelle code{color:var(--p-txt);}
@media(max-width:700px){ .jsWert{display:none;} .jsTabelle td:first-child{width:45%;} }

/* ---------- BIBLIOTHEK ----------
   Eine Karte je Geschichte. Der ganze Kopfbereich ist ein Knopf,
   damit man nicht auf ein kleines Ziel treffen muss. */
.bibGitter{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
.bibKarte{display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden; min-width:0; transition:border-color .15s ease;}
.bibKarte:hover{border-color:var(--line-strong);}
.bibKarte.offen{border-color:var(--accent);}
.bibKarte.kaputt{opacity:.7;}
.bibOeffnen{display:block; width:100%; text-align:left; background:none; border:none; padding:14px 15px 10px; min-width:0;}
.bibOeffnen:hover{background:var(--panel-hover);}
.bibKopf{display:flex; align-items:center; gap:10px; margin-bottom:9px; min-width:0;}
.bibAv{width:32px; height:32px; flex-shrink:0; border-radius:8px; background:var(--accent-light); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; border:1px solid var(--border);}
.bibText{flex:1; min-width:0; display:block; overflow:hidden;}
.bibTitel{display:block; font-size:14px; font-weight:650; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bibUnter{display:block; font-size:11.5px; color:var(--text3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
.bibMarke{flex-shrink:0; font-size:10px; font-weight:650; letter-spacing:.05em; text-transform:uppercase;
  color:var(--text3); background:var(--chip); border:1px solid var(--border-subtle); border-radius:20px; padding:2px 8px;}
.bibMarke.offen{color:var(--accent-ink); background:var(--accent); border-color:transparent;}
.bibZahlen{display:block; font-size:12px; color:var(--text2); margin-bottom:6px;}
.bibFehler{display:block; font-size:12px; color:var(--bad); margin-bottom:6px;}
.bibOeffnen .progressBar{display:block; height:5px; margin-bottom:8px;}
.bibOeffnen .progressBar>span{display:block; height:100%; background:var(--accent); border-radius:6px;}
.bibFuss{display:block; font-size:10.5px; color:var(--text3); font-variant-numeric:tabular-nums;}
.bibKnoepfe{display:flex; gap:6px; padding:0 12px 12px; flex-wrap:wrap;}
.bibKnoepfe .btn{flex:1; padding:4px 6px; font-size:11.5px;}
.bibOrdner{display:block; font-size:11.5px; color:var(--text3); margin-left:auto; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46%;}
.bibOrdner code{font-family:var(--font-mono); font-size:11px; color:var(--text2);}
body.pro .bibKarte{background:var(--panel); border-color:var(--p-line);}

/* ---------- SPRACHAUSWAHL ----------
   Jede Sprache steht in ihrer eigenen Schrift und darunter auf
   Deutsch: wer die Oberfläche versehentlich umgestellt hat,
   findet den Weg zurück, ohne die Schrift lesen zu können. */
.sprachGitter{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:7px;}
.sprachKnopf{display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:8px 10px; color:var(--text); min-width:0;}
.sprachKnopf:hover{border-color:var(--line-strong); background:var(--panel-hover);}
.sprachKnopf.aktiv{border-color:var(--accent); background:var(--accent-light);}
.sprachKnopf .se{display:block; font-size:13.5px; font-weight:650; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; max-width:100%;}
.sprachKnopf .sd{display:block; font-size:10.5px; color:var(--text3); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; max-width:100%;}
.sprachKnopf[dir="rtl"] .se,.sprachKnopf[dir="rtl"] .sd{text-align:right; width:100%;}
body.pro .sprachKnopf{background:var(--p-bg3); border-color:var(--p-line); color:var(--p-txt);}
body.pro .sprachKnopf.aktiv{border-color:var(--p-acc);}

/* ---------- VON RECHTS NACH LINKS ----------
   Arabisch und Urdu. dir="rtl" auf dem Dokument dreht Textfluss und
   Flex-Reihenfolge bereits mit; hier bleiben die Stellen, die eine
   feste Seite haben und sonst auf der falschen landen. */
body.rtl .sceneRow .st{transform:scaleX(-1);}
body.rtl .kCard{border-left:none; border-right:4px solid var(--accent);}
body.rtl .dTl{border-left:none; border-right:3px solid var(--accent); padding-left:0; padding-right:12px;}
body.rtl .tlWrap{padding-left:0; padding-right:26px;}
body.rtl .tlWrap::before{left:auto; right:7px;}
body.rtl .tlItem::before{left:auto; right:-24px;}
body.rtl .tlBtns{right:auto; left:10px;}
body.rtl .barRow .lbl{text-align:left;}
body.rtl .sideSearch input{padding:8px 30px 8px 46px;}
body.rtl .sideSearch .mag{left:auto; right:10px;}
body.rtl .kbd{right:auto; left:7px;}
/* Zahlen und Kürzel bleiben von links nach rechts lesbar */
body.rtl .cnt,body.rtl .statBig,body.rtl .kTag,body.rtl .pk,body.rtl .ag{direction:ltr; unicode-bidi:embed;}

/* ---------- ANGEHÄNGTE DATEIEN ----------
   Eine Zeile je Datei statt Chips: nur so ist Platz für die
   Zusatzknöpfe, und lange Dateinamen kürzen sauber. */
.anhangListe{display:flex; flex-direction:column; gap:6px;}
.anhangZeile{display:flex; align-items:center; gap:6px; background:var(--panel2);
  border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:5px 7px 5px 5px;}
.anhangName{flex:1; min-width:0; display:flex; align-items:center; gap:8px; background:none; border:none;
  text-align:left; color:var(--text); font-size:13px; padding:3px 4px; border-radius:5px;}
.anhangName:hover{background:var(--panel-hover); color:var(--accent);}
.anhangName .ic{flex-shrink:0; font-size:15px;}
.anhangName .nm{flex:1; min-width:0; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.anhangZeile .btn{padding:3px 8px; font-size:11.5px;}
body.pro .anhangZeile{background:var(--p-bg3); border-color:var(--p-line);}
body.pro .anhangName{color:var(--p-txt);}

/* ============================================================
   NICHTS LÄUFT AUS SEINEM KASTEN
   Zwei wiederkehrende Ursachen, beide hier abgestellt:

   1. Ein Knopf in einem Flex-Kasten schrumpft unter seine
      Textbreite. Zusammen mit white-space:nowrap tritt der Text
      dann seitlich aus dem Rahmen aus – so geschehen bei
      „Speichern und beenden" im Beenden-Dialog.
